<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feuerprobe Spielerbögen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#D9DEE3; --paper:#FFFFFF; --ink:#161C26; --ink-2:#3C4756; --muted:#66717F; --line:#C4CBD3; --rule:#8E98A4; --box:#FFFFFF;
  --pb-face:#A8720A; --pb-snake:#2C8452; --pb-hacker:#1683A0; --pb-rigger:#C96A0B; --pb-muscle:#B3382C; --pb-punk:#BA2F86; --pb-adept:#7443B5; --pb-mage:#3B4FB8;
  --tb-bg:#FBFBFC; --tb-line:#CBD1D8; --accent:#0F7B86;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#0D1218;--tb-bg:#151B23;--tb-line:#293441;--accent:#3FC1CC}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0D1218;--tb-bg:#151B23;--tb-line:#293441;--accent:#3FC1CC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:9pt/1.32 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
/* Werkzeugleiste (nicht gedruckt) */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--tb-bg);border-bottom:1px solid var(--tb-line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font:13.5px "IBM Plex Sans",sans-serif;color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toolbar{color:#E7EBF0}}
:root[data-theme="dark"] .toolbar{color:#E7EBF0}
.toolbar .t{font:700 20px "Barlow Condensed",sans-serif;letter-spacing:.01em;margin-right:auto}
.toolbar .t small{font:11px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-left:10px}
.toolbar label{display:inline-flex;align-items:center;gap:6px}
.toolbar select,.toolbar button{font:500 13px "IBM Plex Sans",sans-serif;padding:6px 10px;border:1px solid var(--tb-line);border-radius:8px;background:transparent;color:inherit;cursor:pointer}
.toolbar button.primary{border-color:var(--accent);background:var(--accent);color:#fff}
.toolbar .langs{display:inline-flex;border:1px solid var(--tb-line);border-radius:8px;overflow:hidden}
.toolbar .langs button{border:0;border-radius:0;padding:6px 12px;font-weight:600;letter-spacing:.04em}
.toolbar .langs button+button{border-left:1px solid var(--tb-line)}
.toolbar .langs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.toolbar .hint{flex-basis:100%;font-size:12px;opacity:.75}
.stack{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 8px 40px}
/* Bogen */
.sheet{--pb:var(--accent);width:210mm;height:297mm;padding:7mm 8mm 5mm;background:var(--paper);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.18),0 14px 40px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:2.2mm;overflow:hidden;position:relative}
body.only .sheet{display:none}
body.only .sheet.show{display:flex}
.sheet h1,.sheet h2,.sheet h3{margin:0;font-family:"Barlow Condensed",sans-serif}
.sheet h3{font:600 6.4pt "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--pb);margin-bottom:1mm;padding-bottom:.6mm;border-bottom:.5pt solid var(--pb)}
.sheet section+section{margin-top:2mm}
.sheet p{margin:0}
/* Kopf */
.sh{display:grid;grid-template-columns:1fr 58mm;gap:4mm;border-top:2.2mm solid var(--pb);padding-top:1.8mm}
.ids{display:grid;grid-template-columns:1fr 1fr;gap:1.6mm 4mm}
.fld{display:flex;flex-direction:column;gap:.6mm}
.fld.big{grid-column:1/-1}
.fld span{font:600 6.4pt "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld span em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--pb);margin-left:1.5mm}
.fld input{width:100%;border:0;border-bottom:.6pt solid var(--rule);background:transparent;color:var(--ink);padding:0 0 .6mm;font:11pt "IBM Plex Sans",sans-serif;border-radius:0}
.fld.big input{font:700 20pt/1 "Barlow Condensed",sans-serif;letter-spacing:.01em;padding-bottom:1mm}
.fld input:focus{outline:none;border-bottom-color:var(--pb)}
.pbbox{border:.6pt solid var(--line);border-radius:1.5mm;padding:2mm 3mm;display:flex;flex-direction:column;gap:.8mm}
.pbbox .pbname{font:700 18pt/1 "Barlow Condensed",sans-serif;color:var(--pb);letter-spacing:.02em}
.pbbox .pbdesc{font-size:7.4pt;color:var(--ink-2)}
.pbbox .meta{font:600 6.6pt "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:auto}
.pbbox .role{font-size:6.6pt;color:var(--ink-2);margin-top:.8mm}
/* Spalten */
.cols{display:grid;grid-template-columns:60mm 66mm 60mm;gap:4mm;flex:1 1 auto;min-height:0}
.col{min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.5mm 2mm;font-size:7.15pt}
.kv dt{font:600 5.9pt "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding-top:.3mm}
.kv dd{margin:0;color:var(--ink)}
.tr{margin:0;padding:0;list-style:none;font-size:7.05pt;color:var(--ink-2);display:grid;gap:.5mm}
.tr b{color:var(--ink)}
.txt{font-size:7.15pt;color:var(--ink-2)}
.lore{font-size:6.55pt;color:var(--ink-2);background:color-mix(in srgb,var(--pb) 7%,white);border-radius:1.2mm;padding:1.4mm 2mm;margin-top:0}
.lore b{color:var(--pb)}
/* Actions */
.attr{border:.6pt solid var(--line);border-radius:1.2mm;overflow:hidden}
.attr+.attr{margin-top:1.2mm}
.attr h4{margin:0;display:flex;align-items:center;justify-content:space-between;gap:2mm;padding:.8mm 2mm;background:color-mix(in srgb,var(--pb) 12%,white);font:700 7.2pt "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase}
.attr h4 .res{font:500 6.2pt "IBM Plex Mono",monospace;letter-spacing:.02em;text-transform:none;color:var(--ink-2)}
.attr h4 .kt{display:inline-flex;gap:.6mm}
.act{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2mm;padding:.55mm 2mm;border-top:.5pt solid var(--line)}
.act .an{font-weight:600;font-size:7.4pt;line-height:1.08}
.act .an small{display:block;font-weight:400;font-size:5.8pt;color:var(--muted)}
.dots{display:inline-flex;gap:.9mm}
.dots i{width:2.8mm;height:2.8mm;border-radius:50%;border:.6pt solid var(--ink);display:inline-block;background:var(--box)}
.dots i.on{background:var(--pb);border-color:var(--pb)}
.act.sup .an::after{content:"übernatürlich";font:600 5.4pt "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--pb);margin-left:1.5mm}
/* Kästchen */
.boxes{display:flex;flex-wrap:wrap;gap:1.2mm}
.bx{width:4mm;height:4mm;border:.7pt solid var(--ink);border-radius:.7mm;background:var(--box);display:inline-block}
.bx.sm{width:3mm;height:3mm;border-radius:.5mm}
.bx.xs{width:2.6mm;height:2.6mm;border-radius:.4mm}
.bx.dash{border-style:dashed}
.trk{border:.6pt solid var(--line);border-radius:1.2mm;padding:1.1mm 2mm}
.trk+.trk{margin-top:1.2mm}
.trk h4{margin:0 0 1mm;display:flex;justify-content:space-between;gap:2mm;font:700 7.2pt "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase}
.trk h4 span{font:400 6pt "IBM Plex Mono",monospace;letter-spacing:0;text-transform:none;color:var(--muted)}
.trauma{display:flex;flex-wrap:wrap;gap:.8mm 2mm;margin-top:1mm;font:500 6pt "IBM Plex Mono",monospace;color:var(--muted)}
.harm{display:grid;gap:1mm}
.harm .row{display:grid;grid-template-columns:17mm 1fr;gap:1.5mm;align-items:stretch}
.harm .lv{font:600 6pt "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);line-height:1.15}
.harm .lv small{display:block;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.harm .cells{display:grid;grid-template-columns:1fr 1fr;gap:1.2mm}
.harm .cells.one{grid-template-columns:1fr}
.harm .cell{border:.6pt solid var(--rule);border-radius:.8mm;min-height:5mm;background:var(--box)}
.inl{display:flex;flex-wrap:wrap;gap:.8mm 2.4mm;align-items:center;font-size:6.6pt}
.inl label{display:inline-flex;align-items:center;gap:1mm}
.stash{display:grid;grid-template-columns:repeat(10,2.6mm);gap:.7mm}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:2mm}
.grp h5{margin:0 0 .6mm;font:700 6.6pt "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase}
/* Fähigkeiten & Ausrüstung */
.ab{margin:0;padding:0;list-style:none;display:grid;gap:1.4mm}
.ab li{font-size:6.9pt;color:var(--ink-2);padding-left:1.8mm;border-left:1.6pt solid var(--pb)}
.ab li b{display:block;color:var(--ink);font-size:7.3pt}
.ab li b i{font-style:normal;font:600 5.6pt "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--pb);margin-left:1.2mm}
.items{width:100%;border-collapse:collapse;font-size:6.75pt}
.items td{padding:.45mm .8mm .45mm 0;vertical-align:top;border-top:.4pt solid var(--line);color:var(--ink-2)}
.items tr:first-child td{border-top:0}
.items td.ck{width:5mm;padding-right:0}
.items td.ld{width:4mm;font:600 6.8pt "IBM Plex Mono",monospace;color:var(--ink)}
.items td b{color:var(--ink);font-weight:600}
.items tr.rec td b::after{content:" ●";color:var(--pb)}
.std{font-size:6.2pt;color:var(--muted);margin-top:1mm;line-height:1.35}
.shine{margin:0;padding-left:3.2mm;font-size:6.8pt;color:var(--ink-2);display:grid;gap:.6mm}
.shine li::marker{color:var(--pb)}
.shine b{color:var(--ink)}
/* Untere Leiste & Fuß */
.band{display:grid;grid-template-columns:1fr 1fr 1.2fr 1.35fr;gap:3.5mm;border-top:.6pt solid var(--line);padding-top:2mm}
.band p{font-size:6.7pt;color:var(--ink-2)}
.band p b{color:var(--ink)}
.foot{display:flex;justify-content:space-between;gap:4mm;font:500 6.2pt "IBM Plex Mono",monospace;letter-spacing:.04em;color:var(--muted);border-top:.6pt solid var(--line);padding-top:1.4mm}
.foot b{color:var(--ink-2);font-weight:500}
@media screen and (max-width:820px){.stack{padding:10px 0 30px}.sheet{transform-origin:top center;transform:scale(calc((100vw - 16px) / 794px));margin-bottom:calc((297mm) * ((100vw - 16px) / 794px) - 297mm)}}
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff}
  .toolbar,.fine{display:none!important}
  .stack{display:block;padding:0}
  .sheet{box-shadow:none;margin:0;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .fld input{color:#000}
}
</style>
</head>

{

 shine:['<b>Tiefgarage & Frachtvorraum:</b> Mit Nadias Schichtplatz und Cateringuniform kommst du über die Laderampe hinein. Die Schichtleiterin scannt ihr Tablet: Master of Disguise gibt dir +1d, wenn sie stutzt.','<b>Eventbüro & Ausgabefenster:</b> In Sicherheitsuniform verlangst du die Keycard „auf Kades Anweisung für die Rückführung“. Influence 2, Risky. Bei 4/5 ruft die Eventmanagerin Kade an.','<b>Gäste-WC & Umkleide:</b> Als Gast hinein, als Personal hinaus. Fine Cover Identity trägt dich als Versicherungsgutachten bis zu Dr. Venn.'],
 lore:{h:'Trideo, Simsense und gekaufte Identitäten',t:'Trid ist das Fernsehen der Sechsten Welt: dreidimensional, überall, mit Stars, die mehr Macht haben als Senatoren. Simsense geht weiter und überspielt Gefühle und Sinneseindrücke direkt ins Gehirn. Wer in dieser Welt berühmt war, weiß, wie billig Identität ist: Eine SIN kostet auf dem Schwarzmarkt weniger als ein gutes Abendessen, hält aber nur so lange, wie niemand genau hinsieht.'},
 gm:'Die Deckidentität „Dr. Voss“ existiert wirklich: eine Züricher Kunstversicherung, mit der Dr. Venn schon E-Mails ausgetauscht hat. Venn wird höflich fragen, wie das Wetter in Zürich war. Ein Fehler hier macht Venn misstrauisch (Consequence), ein Erfolg öffnet die private Besichtigung. Detective Ruiz steht nicht im Spire, aber ihr Name eignet sich für die Heat-Abrechnung nach dem Run.',
},
{
 id:'kessel',color:'hacker',pb:'Hacker',pbDesc:'Hacker: digitaler Spionageapparat und virtuelle Waffe',street:'Kessel',meta:'Zwerg',idnShort:'SIN-los · eigener Fake',

 background:'Academic · Matrix-Informatik an der U-Dub, im dritten Semester geflogen wegen eines umgeschriebenen Notensystems',
 vice:'Obligation · zwei jüngere Geschwister in Puyallup, deren Schulgeld und Klinikrechnungen du bezahlst',
 idn:'Nie eine echte gehabt. Die gefälschte SIN hast du selbst gebaut; sie hält jeder Routineprüfung stand, aber keiner gezielten.',
 friendsLabel:'1337 Friends (elite Freunde)',
 role:'Gästeliste, Kameras, Aufzüge, Drohnen: alles, was ein Netz hat, ist deine Tür. Du siehst das Gebäude als Datenfluss und findest die Stelle, an der er stockt.',
 feel:'Matrix, Kameras, Schleusen und das Gefühl, das Gebäude atmen zu hören. Du bist selten dort, wo geschossen wird, und trotzdem überall.',
 actions:{interface:2,survey:1,engineer:1,study:1,prowl:1,consort:1},
 metaTraits:[['Thermal Senses','Du erkennst Wärmesignaturen in deiner Nähe, die normal unsichtbar wären.'],['Fun-sized','Du bist bei Light Load nicht schnell, bleibst aber bei Normal Load unauffällig. Man unterschätzt dich, und deine Statur.'],['Tenacious','Du erleidest erst eine Harm-Strafe, wenn eine ganze Zeile voll ist.'],['Thiccblood','Alkohol hängt dir nicht nach. Widerstehst du Gift oder Krankheit, kostet es nur 1 Edge.']],
 cyber:'Datenbuchse an der linken Schläfe, Cyberaugen mit Bildlink und Restlichtverstärker. Dein Cyberdeck „Kessel“ ist aus drei Konzernkommlinks zusammengelötet und trägt einen Anhänger deiner Schwester.',
 karma:['Du hast eine Herausforderung mit Information oder Cyberkriminalität gelöst.'],
 abilities:[{n:'Search Protocol',tag:'Start',t:'Du bist dir aller Online-Geräte in deiner Nähe stets bewusst. +1d, wenn du auf beliebige Weise Informationen über Hochtechnologie sammelst.'}],
 items:[
  {n:'A Scratch-Built Cyberdeck',l:1,rec:true,t:'Ein umgebautes Kommlink, das versteckte Datenspuren zeigt und leise ausnutzt. Merkmal: smart (kann nicht gegen dich gehackt werden).'},
  {n:'Suite of Warez',l:0,rec:true,t:'Illegale Apps fürs Cyberdeck: Armor, Arsenal, Breach, Mask. Mehrere Warez in einem Run ziehen Aufmerksamkeit.'},
  {n:'Blueprints',l:0,rec:true,t:'Datenbank mit Bauplänen und Stadtplänen. Sag beim Run, welche Pläne du geladen hast.'},
  {n:'Fine Surveillance Gear',l:1,t:'Signalscanner, Funk-Datenabgriffe, Tracer-Tags, Langstreckensensoren für Bild und Ton.'},
  {n:'VR Trodes',l:0,t:'Leichtes Stirnband für den Sprung in die virtuelle Realität ohne Datenbuchse.'},
  {n:'Portable VR Kit',l:1,t:'Flacher Koffer mit Sitz und Trodes: die sichere Ecke, aus der du das Gebäude übernimmst.'},
 ],
 friend:{n:'Glitch, Ex-Spinne für Gebäudeleittechnik',t:'Hat als Subunternehmerin die Aufzugsteuerung des Meridian Spire gewartet. Kennt den GLT-Verteiler in der Garage, den Wartungsplan der Fassadengondel und die Regel, dass der Frachtaufzug 110 nicht anfährt.'},
 rival:{n:'Nullpunkt, Konkurrenz in der Matrix',t:'Verkauft dieselben Exploits an dieselben Leute, nur eine Stunde früher. Behauptet, Kessels Cyberdeck sei „ein Toaster mit Ambitionen“.'},
 why:'Die Klinik in Puyallup schickt Mahnungen. Sechs Nuyen tilgen den Rest. Und Glitch hat etwas gesagt, das dich nicht mehr loslässt: „Ebene 110 hat einen eigenen Host. Niemand baut so etwas für Kunst.“',
 shine:['<b>Garage, GLT-Verteiler:</b> Von hier aus erreichst du Aufzüge, Türen und die Garagenkameras. Ebene 110 nicht, aber du kannst den Frachtaufzug dort anhalten lassen.','<b>Sicherheitsraum & Kameras:</b> Aufnahmen tauschen, einen Sensor als Defekt markieren: So sinkt Alert wieder. Search Protocol verrät dir, welche Drohne gerade sendet.','<b>Sicherheitsserver 110:</b> Physischer Zugriff auf Türen, Sensoren und Drohnenlogik der Ebene. Controlled, aber jeder Login wird protokolliert: Heat nach dem Run.'],
 lore:{h:'Die Matrix',t:'Die Matrix ist überall: als Augmented Reality über der Straße, als virtuelle Realität, wenn du dich per Trodes oder Datenbuchse einstöpselst. Konzerne betreiben Hosts, ihre Sicherheitshacker heißen Spinnen. Wer einbricht, riskiert Biofeedback, das den Körper verletzt. Decker wie Kessel bauen sich ihr Werkzeug aus Schrott, weil ein legales Cyberdeck mehr kostet als eine Wohnung in Bellevue.'},
 gm:'Kessels Geschwister sind der Hebel für Veyraths Gier-Test: Das kompakte Stück Cybertechnologie in der Sammlung ist genau die Prothesensteuerung, die die Schwester braucht. Beschreibe es, wenn Kessel den Koffer sieht. Glitch hat recht: Der Host von 110 ist vom Gebäudehost getrennt (Plan 110, Ort 8). Ein Hack von der Garage aus erreicht ihn nicht, ein physischer Zugriff im Serverraum schon.',
},
{
 id:'zephyr',color:'rigger',pb:'Rigger',pbDesc:'Rigger: Technik, Flugkunst, Kontrolle über jede Maschine',street:'Zephyr',meta:'Mensch',idnShort:'SIN „gefallen“',
 look:'Ende 30, sonnengegerbt, kurzes Haar, Fliegerjacke mit abgetrennten Abzeichen. Am Nacken die Buchsen des Steuerimplantats, an der Hüfte immer ein Werkzeuggürtel.',
 heritage:'Nordamerika · Atlanta (CAS), Drohneneinsätze für die UCAS-Armee, in Seattle hängen geblieben',
 background:'Military · Aufklärungs- und Transportdrohnen im Desert-Wars-Einsatz, unehrenhaft entlassen nach einer Befehlsverweigerung',
 vice:'Stupor · billiger Synthwhisky in der Hangar-Bar „Cap’s“ am Everett-Feld, nachts, wenn die Erinnerungen laut werden',
 idn:'Deine echte Militär-SIN wurde beim Abschied auf „gefallen“ gesetzt. Für den Alltag hast du eine gefälschte Zivil-SIN.',
 friendsLabel:'Handy Friends (praktische Freunde)',
 role:'Luftweg, Fassadengondel, Skycab, Drohnen im Schacht: Wo andere eine Tür suchen, siehst du einen Flugkorridor. Du bringst die Crew hoch und wieder runter.',
 feel:'Fahrzeuge, Drohnen und der Blick durch fremde Kameras. Dein Körper sitzt im Van, dein Kopf fliegt schon über dem Turm.',
 actions:{engineer:2,finesse:2,interface:1,survey:1,stalk:1},
 metaTraits:[['Mensch','Keine besonderen Merkmale. Laut Regelwerk darfst du stattdessen bis zu zwei freie Permutationen wählen. Sprecht das mit der SL ab oder lasst es weg.']],
 cyber:'Steuerimplantat (Control Rig) im Nacken, das dich direkt mit Drohnen und Fahrzeugen verbindet. Wenn du „rigst“, sackt dein Körper zusammen und atmet flach. Deine linke Hand ist eine schlichte Prothese aus Armeebestand.',
 karma:['Du hast eine Herausforderung mit technischem Können oder Kontrolle gelöst.'],
 abilities:[{n:'Ace',tag:'Start',t:'Du kannst mit Finesse jedes Fahrzeug starten, steuern und landen, egal wie es angetrieben wird. Bei schwierigen Manövern erhältst du Potency.'}],
 items:[
  {n:'A Configured Drone',l:0,rec:true,t:'„Libelle“: handtellergroße Rotordrohne mit Kamera und Mikrofon, passt durch den Drohnenschacht. Weitere Merkmale kosten je eine Special-Item-Wahl.'},
  {n:'A Personal Vehicle',l:0,rec:true,t:'Ein schweres Motorrad mit Beiwagen, wartet in der VIP-Vorfahrt oder an der Rampe. Für zwei Personen, autonom fahrbar.'},
  {n:'Utility Harness',l:1,rec:true,t:'Drei Chemikalien oder Gadgets: Hypersolvent, Hyperglue, Thermite Gel, Nightshades, Sensor Tag, Spatial Scanner, Thermite Rod, Vehicular Override.'},
  {n:'Medical Supplies',l:1,t:'Drei Sprays oder Pflaster: Antidote Patch, Hard-Clot, Sterilizer, Stim Patch, Stun Patch.'},
  {n:'Fine Electrical Tools',l:1,t:'Lötkolben, Spezialschlüssel, Präzisionssensoren, Kopflampe mit Vergrößerung.'},
 ],
 friend:{n:'„Cap“ Okafor, Pilotin mit Kipprotor-Maschine',t:'Fliegt Frachtrouten über den Sound und hat keine Angst vor einem Überflug in 400 Metern. Sie setzt die Crew über dem Dach ab oder sammelt sie an der Ostfassade wieder ein.'},
 rival:{n:'Dispatcher Vance, Skycab-Leitstelle Seattle',t:'Hat Zephyr einmal dabei erwischt, ein Skycab ohne Freigabe umzuleiten. Er kennt die Signatur des Control Rigs und meldet sie mit Vergnügen.'},
 why:'Du willst deine alte Aufklärungsdrohne zurück, die ein Schrotthändler in Tacoma für zwölf Nuyen hält. Sechs sind ein Anfang. Und dieser Run hat Höhe, Wind und einen Turm, der einen echten Anflug verdient.',
 shine:['<b>Dach & Skycab-Plattform:</b> Mit Ace und Cap kommst du von oben. Der Anflugtransponder gibt gehackten Skycabs Landefreigabe; ohne Freigabe kreist das Cab und meldet sich.','<b>Fassadengondel:</b> Steuerkasten auf dem Dach, Andockpunkt auf 110. Finesse 2 für die Fahrt im Wind, Vehicular Override im Utility Harness für die Elektronik.','<b>Drohnenschacht:</b> „Libelle“ fliegt von der Garage in die Küche 111 und aufs Dach. Ausrüstung in Portionen, Augen überall, und niemand fragt eine Lieferdrohne nach der Einladung.'],
 lore:{h:'Rigger, Drohnen und die Kriege der Konzerne',t:'Ein Control Rig verbindet das Nervensystem direkt mit Maschinen: Wer rigt, fühlt den Rotor wie die eigene Hand. Solche Implantate kosten Essenz, ein Stück Menschlichkeit, das sich nicht zurückkaufen lässt. Die Desert Wars sind die Fernsehkriege der Konzerne, in denen Söldner vor Kameras kämpfen. Wer dort geflogen ist, kennt den Unterschied zwischen einem Ziel und einem Menschen.'},
 gm:'Zephyrs Control Rig ist registriertes Armee-Eigentum. Kades Sicherheitsbogen erkennt militärische Augmentierung und meldet sie still (Alert +1), falls Zephyr durch das Foyer geht. Die Gondel-Fahrt ist der klassische Dragon’s Deal: „Sie bringt euch exakt ans Ziel und verriegelt sich danach außen.“ Cap fliegt zuverlässig, aber nur einmal: Ein zweiter Überflug zieht die Aufmerksamkeit der Luftraumüberwachung auf sich.',
},

{
 id:'bastion',color:'muscle',pb:'Muscle',pbDesc:'Muscle: gefährlich, einschüchternd, der Schild der Crew',street:'Bastion',meta:'Troll',idnShort:'Konzern-SIN abgelaufen',
 look:'2,40 m, ruhige Bewegungen, ein abgesägtes Horn (das andere poliert). Dunkler Mantel über schusssicherer Weste, eine Stimme wie ein Kühlschrank, der anläuft.',
 heritage:'Europa · Hamburg (Allianz Deutscher Länder), vor zehn Jahren mit einem Sicherheitsvertrag nach Seattle geholt',
 background:'Law · zwölf Jahre Konzernsicherheit und Personenschutz bei Sentinel Solutions, wegen eines verweigerten Schießbefehls gefeuert',
 vice:'Obligation · die Ex und die gemeinsame Tochter in Tacoma, deren Schulgeld du pünktlich überweist, egal was es kostet',
 idn:'Echte Konzern-SIN von Sentinel Solutions, mit der Kündigung ausgelaufen. Nie ersetzt, deshalb bei jeder Kontrolle ein Problem.',
 friendsLabel:'Dangerous Friends (gefährliche Freunde)',
 role:'Steht zwischen der Crew und dem, was schiefgeht. Weiß, wie Sicherheitsleute denken, weil du selbst einer warst. Beherrscht Gewalt, statt sie zu brauchen.',
 feel:'Präsenz, Schutz, die Ruhe im Sturm. Du gewinnst, indem du die Crew heil herausbringst, nicht indem du Gegner zählst.',
 actions:{fight:2,command:1,wreck:1,survey:1,consort:1,study:1},
 metaTraits:[['Thermal Senses','Du erkennst Wärmesignaturen in deiner Nähe.'],['Oversized','Du bist nie unauffällig (auch nicht bei Light Load), dafür bei Heavy Load nicht langsamer und trägst +1 Load. Leute fürchten deinesgleichen.'],['Troll Armor','Haut und Knochen sind gehärtet: ein zusätzliches Armor-Kästchen und +1d auf Resistance Rolls mit Body.'],['Horned','Hörner als Waffe. Ein Horn hast du entfernen lassen, das andere macht Leute nervös.']],
 cyber:'Keine Implantate, aus Prinzip. „Ich habe genug Chrom in Gesichtern gesehen, die nichts mehr fühlten.“ Dafür Kevlar unter dem Mantel und eine Sicherheitslizenz, die noch aussieht wie echt.',
 karma:['Du hast eine Herausforderung mit Gewalt oder Zwang gelöst.'],
 abilities:[{n:'Bodyguard',tag:'Start',t:'Wenn du ein Teammitglied schützt, erhältst du +1d auf deinen Resistance Roll. Sammelst du Informationen, um Bedrohungen in der aktuellen Lage vorherzusehen, erhältst du +1 Effect.'}],
 items:[
  {n:'Light Armor',l:1,rec:true,t:'Leichter und unauffälliger als normale Panzerung, mit (echter oder gefälschter) Sicherheitslizenz. Passiert den Bogen im Foyer plausibel.'},
  {n:'Fine Scary Weapon/Tool',l:1,rec:true,t:'Schockhandschuhe: mehr Effect beim Einschüchtern, nicht mehr Schaden. Nichttödlich, wenn es sein muss.'},
  {n:'Containment Manacles',l:0,rec:true,t:'Selbstschließende Handschellen mit schlagfester Kette. Ein Souvenir aus der Sicherheitszeit.'},
  {n:'Fine Brutal Weapon',l:2,t:'Eine verheerende schwere Waffe, hier eine Schrotflinte aus Sentinel-Bestand. Potency, wenn Kraft oder Reichweite zählen.'},
  {n:'Kamikaze Vial',l:0,t:'Kampfdroge: Kraft, Schmerztoleranz, Wut für Minuten. Danach zwei Consequences: „Kann Freund nicht von Feind unterscheiden“ und „Hört nicht auf, bis alle liegen“.'},
  {n:'A Medieval Weapon',l:1,rec:true,t:'Standard: ein Teleskopschlagstock. Getting medieval, aber kontrolliert.'},
 ],
 friend:{n:'Doc Amsel, Straßenärztin in Tacoma',t:'Flickt Runner ohne Fragen und hat Bastions Horn amputiert. Sie kennt jeden Bodyguard der Stadt, der heute auf einer Gala Dienst hat.'},
 rival:{n:'Dorian Kade, Sicherheitschef der Gala',t:'War bei Sentinel Solutions Bastions Teamleiter und unterschrieb die Kündigung. Kade hat ein Gedächtnis für Gesichter und zwei verchromte Arme, die Bastion nie mochte.'},
 why:'Du brauchst das Geld für Tacoma, aber du nimmst den Job, weil Mr. Johnson sagte: kein Wetwork. Ein Run, bei dem niemand stirbt, in einem Turm, den Kade bewacht. Du willst beweisen, dass man Sicherheit auch ohne Schießbefehl überwinden kann.',
 shine:['<b>Foyer & Sicherheitsbogen:</b> Light Armor mit Lizenz und Oversized bedeutet: Man sieht dich, aber man erwartet dich auch. Als angeheuerter Bodyguard eines Gasts bist du plausibel.','<b>Drohnenknoten 110:</b> Wächterdrohnen blockieren zuerst und schießen zuletzt. Bodyguard gibt dir +1d, wenn du dich vor die Crew stellst, und +1 Effect, wenn du ihre Zustände liest.','<b>Kade:</b> Du kennst seine Routine, seine Zuckungen, seinen Stolz. Consort oder Command, um ihn zu lesen, Survey, um seine Runde vorherzusagen. Solange er dich nicht sieht.'],
 lore:{h:'Trolle, Goblinisierung und Konzernsicherheit',t:'2021 verwandelten sich weltweit Menschen über Nacht in Orks und Trolle: die Goblinisierung. Trolle sind stark, gepanzert und leben mit Türen, Stühlen und Vorurteilen, die nicht für sie gebaut sind. Konzerne heuern sie gern als Sicherheit an und geben ihnen ungern Verantwortung. Ein Troll, der einen Schießbefehl verweigert, ist in den Schatten eine Legende und in Bellevue ein Fall für die Personalabteilung.'},
 gm:'Kade erkennt Bastion sofort, wenn er die Figur unverkleidet sieht: keine Sirene, sondern ein Gespräch („Sieh an. Ich dachte, Sie machen jetzt Nachtwache in Tacoma.“). Danach lässt er Bastion nicht mehr aus den Augen (Alert +1, eine Wache bleibt in Sichtweite), aber er könnte auch etwas fragen, das der Crew nützt. Bastions Test ist nicht Gier, sondern Ehre: Veyrath bewertet besonders, ob Gewalt vermieden wird, wenn Gewalt einfacher wäre.',
},

  {n:'Gecko Gloves',l:1,rec:true,t:'Nanofaser-Handschuhe mit extremer Haftung: glatte und senkrechte Flächen erklimmen, Dinge sicher halten.'},

 friend:{n:'Mondo, Fassadenreiniger der Wartungsfirma',t:'Fährt die Gondel des Meridian Spire jeden Dienstag. Er verrät, wo der Steuerkasten sitzt, wann der Wartungsplan eine Fahrt vorsieht und dass die Terrassenkamera nur den Drohnen-Landeplatz sieht.'},
 rival:{n:'Reißzahn, Anführer der Rusted Halos',t:'Nimmt es persönlich, dass Fizz gegangen ist. Seine Gang kontrolliert die Straßen um die Zufahrt nach Bellevue.'},
 why:'Dein kleiner Bruder Teo ist elf und fängt an, die Rusted Halos cool zu finden. Sechs Nuyen sind eine Wohnung außerhalb der Barrens. Außerdem: 112 Stockwerke Glas. Du hast noch nie etwas so Hohes gesehen, das du nicht bestiegen hast.',
 shine:['<b>Steigleiter & Wartungsschacht:</b> Von der Terrasse 111 zum Dach, vom Dach durch den Schacht bis auf 110, ohne die Party zu berühren. Catch Me If You Can zahlt für den Moment, in dem ein Sensor doch anschlägt.','<b>Deckenhohlraum:</b> Aus der Umkleide über die Trennwand ins Eventbüro. Eng, dunkel, genau dein Ding. Die Keycard liegt darunter in der Kassette.','<b>Ablenkung:</b> Pepper Smoke im Salon, ein Gast fällt in den Pool, ein Tablett kippt: Du kaufst der Crew die zwei Minuten, in denen niemand hinsieht.'],
 lore:{h:'Die Barrens, Go-Gangs und ein Leben ohne SIN',t:'Redmond war einmal ein Technologievorort. Heute sind die Barrens ein Stadtteil ohne Strom, Polizei oder Müllabfuhr, in dem Gangs die Ordnung sind. Wer hier geboren wird, hat oft keine SIN: keine Schule, kein Arzt, kein Weg hinaus außer den Schatten. Orks werden dort geboren, wo Menschen wegziehen. Fizz hält das nicht für Schicksal, sondern für eine Wand, die man hochklettern kann.'},
 gm:'Foolish Pride ist auch ein Charakterzug: Fizz kann einer Mutprobe nicht widerstehen. Die Schatulle mit Edelsteinen liegt in der Sammlung direkt neben der Tür und passt in die Bauchtasche. Beschreibe sie, bevor du den Koffer beschreibst. Mondos Wissen über die Gondel ist echt, aber jede Fahrt wird protokolliert (Plan Dach, Ort 7). Reißzahn kann bei der Flucht durch die Barrens als Response-Clock-Komplikation auftauchen.',
},

 actions:{prowl:2,finesse:1,fight:1,survey:1,study:1,stalk:1},
 metaTraits:[['Mensch','Keine besonderen Merkmale. Laut Regelwerk darfst du stattdessen bis zu zwei freie Permutationen wählen. Sprecht das mit der SL ab oder lasst es weg.']],
 cyber:'Keine Implantate: Cyberware würde deine Magie schwächen. Deine Tätowierungen sind Fine Mystic Body Art, ein Fokus, der deinen Weg trägt.',
 karma:['Du hast eine schwere Herausforderung mit innerer Vollkommenheit oder mystischer Kraft gelöst.'],
 abilities:[
  {n:'Practitioner of the Way',tag:'Pflicht',t:'Weg des Körpers (Fight, Finesse, Prowl, Wreck): Drei deiner Startpunkte liegen dort. Übernatürlichen Consequences widerstehst du mit Body. Du kannst nie Erwachte:r oder Emergente:r werden. Wähle einen Adepten-Drawback aus dem Regelwerk.'},
  {n:'Adept Senses',tag:'Start',t:'1 Edge: Für mehrere Minuten nimmst du über normale Grenzen hinaus wahr. Erkenne feine Veränderungen (Temperatur, Frequenz, Druck), spüre Gefahr, sei ein lebender Lügendetektor.'},
 ],
 items:[
  {n:'Fine Mystic Body Art',l:0,rec:true,t:'Tätowierungen, die deinen Adeptenkern bündeln. Supernatural gebunden, einzigartig, mühsam zu entfernen.'},
  {n:'Strange Trinket',l:0,rec:true,t:'Ein kleiner Gegenstand, hier eine abgenutzte Gebetskette, der Visionen der Vergangenheit oder nahen Zukunft eines Ortes zeigt, ob du willst oder nicht.'},
  {n:'Fine Astral Weapon',l:2,t:'Ein kurzer Stab, der gegen astrale Wesen wirkt. Für die Feuerprobe eher Ballast als Hilfe, außer der Watcher kommt näher.'},
  {n:'A Quiet Weapon',l:1,rec:true,t:'Standard: Wurfmesser oder ein Blasrohr mit Betäubungspfeilen. Leise, leicht, nichttödlich einsetzbar.'},
  {n:'Climbing Gear',l:2,t:'Standard: Enterhaken und Karabiner, falls Prowl 2 einmal nicht reicht.'},
 ],
 friend:{n:'Meister Oyelaran, Dojo-Leiter in Georgetown',t:'Trainiert die halbe Sicherheitsbranche von Seattle. Er weiß, welche Wachen heute im Spire stehen, wer davon augmentiert ist und wer nach einem 14-Stunden-Tag nachlässig wird.'},
 rival:{n:'Aurel Voss, Adept im Dienst einer Konzernsicherheit',t:'Trainierte einst neben Stille und hält diesen Weg für Schwäche. Er berät Sicherheitsfirmen in Bellevue, gelegentlich auch Vesperline.'},
 why:'Du suchst Aufgaben, an denen du wächst. Ein Turm voller Sensoren, Drohnen und einer Kuratorin, die nicht verletzt werden darf, ist eine Prüfung deiner Disziplin. Das Geld geht ans Dojo. Der Test geht an dich selbst.',
 shine:['<b>Sensorkorridor 110:</b> Adept Senses spüren Lichtschranken als Wärme, Druckplatten als Unebenheit, Kameras als Summen. Prowl 2 trägt dich hindurch.','<b>Dr. Venn:</b> Als lebender Lügendetektor merkst du, ob sie misstrauisch wird, bevor sie es zeigt. Study, um sie zu lesen; Finesse, um den Iris-Scan unauffällig aufzunehmen.','<b>Glasdach Wintergarten:</b> Der Lüftungsflügel klemmt mechanisch, ohne Sensor. Fünf Meter Abseilen in weiche Pflanzen ist für dich ein Schritt.'],
 lore:{h:'Das Erwachen und die Adepten',t:'Seit 2011 ist Magie zurück in der Welt. Etwa einer von hundert Menschen ist erwacht: Magier zaubern und beschwören, Adepten lenken Mana in den eigenen Körper und werden schneller, wacher, härter, ohne dass man es sieht. Cyberware und Magie vertragen sich schlecht: Jedes Implantat kostet Essenz und schwächt die Gabe. Adepten wie Stille wählen deshalb den Körper, den sie haben, und machen ihn zur Waffe.'},
 gm:'Stilles Aura ist im Astralraum hell wie die eines Magiers. Der Watcher auf 110 bemerkt sie ebenso wie einen Zauberer (Alert +1 bei astraler Aktivität in seiner Nähe). Die Strange Trinket ist ein Werkzeug für Vorahnung: Vor der Tresortür kann sie eine Vision zeigen, in der ein gewaltiger Schatten über die Fassade gleitet. Ein leiser Vorgeschmack auf Veyrath, ohne den Twist zu verraten.',
},
{
 id:'ravn',color:'mage',pb:'Mage',pbDesc:'Magie: erwacht, hermetisch, Blick in den Astralraum',street:'Ravn',meta:'Ork',idnShort:'Konzern-SIN gekündigt',
 look:'Mitte 40, grau werdende Schläfen, kräftige, polierte Hauer. Tweedjacke, Lesebrille mit Sensorfokus, ein Ring aus Meteoreisen am kleinen Finger.',
 heritage:'Europa · Krakau, mit einem Konzernvertrag nach Seattle versetzt und dort geblieben',
 background:'Corporate · Wage Mage in der magischen Sicherheit eines Konzerns: Barrieren prüfen, Geister bannen, Dinge nicht hinterfragen. Du hast hinterfragt.',
 vice:'Weird · Gespräche mit „Vesna“, einem freien Geist, der in der leerstehenden Bibliothek am Pike Place wohnt und nur in Reimen antwortet',
 idn:'Deine Konzern-SIN wurde mit der Kündigung gelöscht. Du lebst mit einer gefälschten SIN, Berufsangabe: Privatgelehrsamkeit.',
 friendsLabel:'Strange Friends (seltsame Freunde)',
 role:'Sieht, was niemand sonst sieht: Barrieren, Watcher, magische Auren, den Koffer unter hundert Objekten. Zaubert leise und weiß, wie Konzernmagier denken.',
 feel:'Wissen, Astralraum, Zauber mit Bedacht. Du bist die Figur, die sagt: „Wartet. Da ist etwas an dieser Wand.“',
 actions:{study:2,consort:1,survey:1,influence:1,prowl:1},
 sup:{name:'Assense',dots:1,attr:'Awakened · zählt zu den 7 Punkten',gloss:'astral wahrnehmen, Barrieren und Geister lesen'},
 metaTraits:[['Low-light Vision','Du siehst bei schwachem Licht wie bei Tag.'],['Foolish Pride','Wirfst du bei einer Desperate Action ein Critical, erhältst du 1 Edge zurück.'],['Numbskull','1 Edge: ignoriere für eine Action eine Harm-Strafe, auch Kampfunfähigkeit.']],
 cyber:'Keine Implantate: Jedes Stück Chrom würde deine Magie schwächen. Deine Foki sind Brille und Ring.',
 karma:['Du hast eine Herausforderung mit Wissen oder magischer Kraft gelöst.'],
 abilities:[
  {n:'Awakened',tag:'Pflicht',t:'Arkane Methode: hermetische Tradition (Drawbacks laut Regelwerk). Du darfst Assense würfeln; bei einer Desperate Assense-Action markierst du 1 Karma auf der Willpower-Leiste. Weitere Assense-Punkte kaufst du als Willpower-Aufstieg. Nie Emergente:r oder Adept:in.'},
  {n:'Sorcerer',tag:'Start',t:'Du kennst die Methoden, metaplanare Energie durch deinen Körper zu leiten und Zauber zu wirken. Mit Study wirkst du eine Zauberformel und erzeugst einen übernatürlichen Effekt. Du startest mit zwei Zaubern.'},
 ],
 spells:{h:'Zwei gelernte Zauber',list:[
  {n:'Betäubungsblitz',t:'Ein Stoß Mana gegen den Geist eines Ziels: Ohnmacht statt Wunden. Nichttödlich, lautlos, sichtbar nur für Erwachte. Study, Reichweite Sichtlinie.'},
  {n:'Schleier',t:'Ein Trugbild über Person oder Sache: andere Kleidung, ein anderes Gesicht, ein Koffer, der wie eine Aktentasche aussieht. Hält, solange du dich konzentrierst. Menschen täuscht es, Kameras nicht.'},
 ]},
 items:[
  {n:'Fine Spell Focus',l:1,rec:true,t:'Der Ring aus Meteoreisen: Zauber mit außergewöhnlicher Kontrolle wirken.'},
  {n:'Fine Sensing Focus',l:1,rec:true,t:'Brille, durch die du arkane Energien in großem Detail siehst. Schützt auch etwas gegen Besessenheit.'},
  {n:'Banishing Focus',l:0,rec:true,t:'Ein kleines arkanes Amulett, dem astrale Wesen lieber aus dem Weg gehen.'},
  {n:'Fine Arcane Reagents',l:1,t:'Grabstaub, Gebetsperlen, erwachte Federn: konzentrierte Essenz für große Zauber, zerfällt nach Gebrauch.'},
  {n:'A Paracritter',l:0,t:'Ein erwachtes Tier als Begleiter (Cohort, Expert). Ravn hat keins; angeblich wäre Vesna eifersüchtig.'},
 ],
 friend:{n:'Talia Vance, Talismonger in Tacoma',t:'Handelt mit Foki und Reagenzien und hört alles, was Seattles Erwachte tratschen. Sie hat gehört, dass die Barriere im Meridian Spire von einem Meister gezogen wurde, den niemand kennt.'},
 rival:{n:'Dr. Henrik Solvay, Ravns alter Vorgesetzter',t:'Leitet weiter die magische Sicherheit des Ex-Konzerns und hat Ravns Akte mit dem Vermerk „unzuverlässig, Verbleib beobachten“ versehen.'},
 why:'Zwölf Jahre lang hast du Barrieren für Leute gezogen, die dir nie sagten, was dahinter lag. Jetzt willst du einmal wissen, was hinter einer Wand ist, die so gut gebaut wurde. Die Nuyen zahlen Vesnas Bibliothek. Die Neugier zahlst du selbst.',
 shine:['<b>Vault 110:</b> Assense zeigt dir die duale Manabarriere, das lebende Gewebe und den Watcher auf seiner Runde. Am Türdurchgang siehst du, wie die Barriere kontrolliert geöffnet wird: ein Vorteil für jeden eigenen Weg hinein.','<b>Die Sammlung:</b> Der Koffer trägt eine schwache, alte Aura. Unter hundert glänzenden Dingen ist er für dich der einzige, der flüstert. Ebenso siehst du, welche Antiquitäten magisch sind und welche nur teuer.','<b>Betäubungsblitz & Schleier:</b> Eine Wache schläft, ein Runner sieht aus wie Personal, der Koffer wirkt wie eine Aktentasche. Nichttödlich, lautlos, genau nach Johnsons Bedingungen.'],
 lore:{h:'Hermetiker, Astralraum und Drachen',t:'Erwachte Magier folgen Traditionen: Hermetiker verstehen Magie als Wissenschaft mit Formeln und Kreisen, Schamanen als Beziehung zu Geistern und Mentoren. Der Astralraum ist die zweite Schicht der Welt, in der Gedanken Farben haben und Barrieren wie Mauern stehen. Ganz oben stehen die Großen Drachen: uralt, unfassbar reich, in Konzernvorständen vertreten. Manche Wände wurden nicht für Menschen gebaut.'},
 gm:'Ravn erkennt die Vault-Hülle als gezüchtete Dual-Barriere: eine Technik, die Jahrzehnte Zeit und ein Vermögen kostet. Kein Konzern baut so etwas für Kunst. Das ist die Spur zu Veyrath, ohne den Twist zu verraten. Vesna hat Ravn vor dem Run in Reimen gesagt, der Turm „habe einen Herzschlag“. Der Watcher meldet astrale Aktivität (Alert +1), greift aber nicht an; Ravn kann ihn mit Assense ablenken oder still bleiben. Solvay ist eine Heat-Komplikation für die Zeit nach dem Run.',
},
];
const CREWS=[
 {n:'Die Einladung',t:'Mercer (Face), Kessel (Hacker), Bastion (Muscle), Ravn (Magie). Über den Glasaufzug hinein, Venn im Gespräch, Kameras im Griff, ein Schild vor der Crew und ein Blick in den Astralraum.'},
 {n:'Die Leisen',t:'Chamäleon (Snake), Fizz (Punk), Stille (Adept), Kessel (Hacker). Als Personal durch die Garage, Keycard aus dem Eventbüro, Wartungsschacht nach 110, kein Schuss.'},
 {n:'Der Luftweg',t:'Zephyr (Rigger), Fizz (Punk), Bastion (Muscle), Stille (Adept). Von oben aufs Dach, Steigleiter und Schacht, Gondel zur Technischen Schleuse, Skycab zur Flucht.'},
 {n:'Drei Personen',t:'Mercer, Fizz und Ravn: Charme, Kletterei und Magie. Kessels Kameraarbeit ersetzt ihr durch Flashbacks und Fizz’ EMP-Granaten.'},
];

const EN={
mercer:{
 street:'Mercer',pbDesc:'Face: smooth, connected, invited everywhere',idnShort:'SIN revoked · fake',
 look:'Late thirties, hair dyed silver-grey, tailored evening wear in charcoal, a single earring of real gold. You smile before you speak.',
 heritage:'North America · born in Tír Tairngire (Portland), in Seattle since 2071',
 background:'Corporate · art PR for a corporate gallery in Bellevue, fired after a scandal',
 vice:'Luxury · Chef Horowitz’s private dinners at the Wilder Hotel, Downtown',
 idn:'Your own SIN still exists but is revoked. A fake SIN under an alias of your choice, occupation art consultant, good quality.',
 friendsLabel:'Shrewd Friends',
 role:'Opens doors others would have to force: invitation, guest list, a conversation with Dr. Venn. The reason the crew gets into the glass elevator at all.',
 feel:'Charm, contacts, small talk with snakes. You talk; the others work in the shadow of your smile.',
 metaTraits:['You can see in low light as well as if it were well lit.','You hear from further away. Spend 1 edge to perceive beyond normal limits for several minutes (whispers in a noisy room, ultrasound).','You remain fast at normal load.','When you resist a consequence of social pressure, it costs only 1 edge, regardless of the roll.'],
 cyber:'No implants. You consider chrome a flaw and let people notice. Instead you carry a high-end commlink and contact lenses with an AR overlay.',
 karma:['You addressed a challenge with charisma or conspiracy.'],
 abilities:[{tag:'Start',t:'You gain +1d to Consort when you gather information on a target for a run. You get +1d to the engagement roll for that operation.'}],
 items:['A suit of clothes that marks you as an executive, an officer of rank or the undisputed leader of a gang, badges and accoutrements included.','Prepaid credit at the city’s popular clubs and restaurants. Intoxicates and impresses.','A small tabletop device for a short conversation free of audio surveillance. Perfect for five minutes with Dr. Venn in the conservatory.','Up to three doses: Bluecoke, Glow, Nu-Ganja, Red Rock. Refills itself during downtime.','Like the Fine Outfit, one step more expensive: gala level.','Three to five bodyguards, fans and retainers loyal only to you. Quality equals Tier when they can help.'],
 friend:{n:'Ines Okonkwo-Harada, gallerist',t:'Curates in Bellevue and still owes Mercer. She can put a name on the guest list of the Vesperline gala or tell you which collectors are there tonight.'},
 rival:{n:'Tobias Wren, society reporter',t:'Writes for a trid gossip channel, knows every face on the scene and once covered Mercer’s fall with relish. He is invited tonight.'},
 why:'You used to be inside: the invitations, the receptions, the right people. A scandal you did not cause threw you out. Six nuyen is good money, but the real payoff is one evening standing at the top again. And maybe the name behind it all.',
 shine:['<b>Foyer & security arch:</b> With the Fine Outfit and a name from Ines you get waved through. Sprawl Whisperer gives the crew +1d on the engagement roll if you did your research.','<b>Gallery & conservatory:</b> Dr. Venn only talks to people who take art seriously. Consort 2 and Study 1 are enough to ask for a private viewing. The Privacy Generator buys five undisturbed minutes.','<b>Lowering Alert:</b> When a guard spots a deviation, you deliver the plausible explanation before they reach for the radio.'],
 lore:{h:'SINs, elves and the price of existing',t:'A SIN (System Identification Number) is more than an ID in the Sixth World: bank account, apartment, health insurance, the right to vote. Lose it and you officially stop existing. Mercer comes from Tír Tairngire, the elven nation south of Seattle, where bloodline decides careers. That Mercer now works with ork punks counts as a disgrace in the family.'},
 gm:'Mercer’s real face has been on a Bellevue blacklist since the gallery scandal, and Kade’s arch checks it. If Mercer enters the foyer undisguised, that counts as a deviation (silent check, Alert +1). Tobias Wren is the perfect Dragon’s Deal: “The invitation is real, but someone at the party recognizes your alias.” Mercer also has a fine nose for money and is the first to sense that someone very old and very rich stands behind Vesperline.',
},
chamaeleon:{
 street:'Chameleon',pbDesc:'Snake: lies, manipulation, a thousand faces',idnShort:'fake SIN',
 look:'Early thirties, completely unremarkable on request. Today: dark suit, glasses without prescription, hair pulled back. Tomorrow: someone else entirely.',
 heritage:'North America · Los Angeles (California Free State), in Seattle for five years',
 background:'Media · stunt double and bit parts in trid series, then acting lessons for people who did not want to act',
 vice:'Gambling · Krist’s fight clubs under the Kingdome grounds, bets on anything that moves',
 idn:'None of your own anymore. The fake SIN changes with the role; the current one reads “Dr. L. Voss, art insurance” (see Fine Cover Identity). You choose the first name to fit the part.',
 friendsLabel:'Sly Friends',
 role:'Becomes someone who is allowed to be here: catering, insurance assessor, security. Fetches the keycard without anyone noticing it was fetched.',
 feel:'Disguise, deception, the moment everyone believes what you say. You win scenes in which nobody draws a gun.',
 metaTraits:['No special traits. By the rules you may instead pick up to two free permutations to represent an easier life. Talk it over with the GM or skip it.'],
 cyber:'An inconspicuous voice modulator in the larynx (changes pitch and accent) and a datajack behind the ear for simsense recordings from your trid days.',
 karma:['You addressed a challenge with deception or information.'],
 abilities:[{tag:'Start',t:'When you use a disguise or other form of covert misdirection, you get +1d to rolls to confuse or deflect suspicion. When you throw off your disguise, the resulting surprise gives you the initiative in the situation.'}],
 items:['A vial of pheromones and a thermoplastic mask kit with expert appliances. May increase the effect of your deceptions.','Fake licenses, business holo-cards, planted rumors and relationships: enough to pass as a different person.','Low calibre, vanished up a sleeve. Hard to find even in a search.','Compromising recordings, embarrassing video or incriminating evidence.','One dose: the victim slips into a calm, suggestible state, similar to hypnosis.','Standard gear: makeup kit, subvocal communicator, janitor outfit, blank licenses, reversible coat.'],
 friend:{n:'Nadia Feld, shift planner at Silberkante Catering',t:'Sells empty shift slots at galas for cash. She knows Silberkante is catering the Meridian Spire tonight and what the shift list on the supervisor’s tablet looks like.'},
 rival:{n:'Detective Marisol Ruiz, contracted police service',t:'Missed Chameleon by a hair two years ago and has collected every recording of a person who never shows up twice since.'},
 why:'The bookies want their money and you have skipped town too often already. But honestly: a gala, a vault, a curator with a cybereye and a case nobody may open. It is the best role you have been offered in years.',
 shine:['<b>Garage & freight lobby:</b> With Nadia’s shift slot and a catering uniform you come in over the loading dock. The shift supervisor scans her tablet: Master of Disguise gives you +1d when she hesitates.','<b>Event office & hatch:</b> In a security uniform you demand the keycard “on Kade’s orders for the return transport”. Influence 2, risky. On a 4/5 the event manager calls Kade.','<b>Guest restroom & locker room:</b> In as a guest, out as staff. Fine Cover Identity carries you as an insurance assessor all the way to Dr. Venn.'],
 lore:{h:'Trideo, simsense and identities for sale',t:'Trid is the television of the Sixth World: three-dimensional, everywhere, with stars more powerful than senators. Simsense goes further and plays feelings and senses straight into the brain. Anyone who was famous in this world knows how cheap identity is: on the black market a SIN costs less than a good dinner, but it only holds as long as nobody looks closely.'},
 gm:'The cover identity “Dr. Voss” really exists: a Zurich art insurer Dr. Venn has exchanged e-mails with. Venn will politely ask how the weather was in Zurich. A slip here makes Venn suspicious (consequence); a success opens the private viewing. Detective Ruiz is not in the Spire, but her name suits the Heat reckoning after the run.',
},
kessel:{

 look:'Mid twenties, broad shoulders, braided hair with a data cable as jewelry. Hoodie covered in stickers, the cyberdeck belt underneath.',
 heritage:'North America · Puyallup, Seattle, grew up in the shadow of the Ash Pit',

 cyber:'Datajack at the left temple, cybereyes with image link and low-light amplifier. Your cyberdeck “Kessel” is soldered together from three corporate commlinks and carries a pendant from your sister.',
 karma:['You addressed a challenge with information or cybercrime.'],
 abilities:[{tag:'Start',t:'You are always aware of online devices in your presence. Take +1d when you gather information about high technology by any means.'}],
 items:['A modified comm that spots hidden data trails and quietly exploits them. Feature: smart (cannot be hacked to turn against you).','Illegal apps for the cyberdeck: Armor, Arsenal, Breach, Mask. Executing several warez in one run draws attention.','A database of architectural and city plans. Say which plans you loaded when the run starts.','Signal scanner, wireless data taps, tracer tags, long-range audio and video sensors.','A lightweight headband for entering virtual reality without a datajack.','A thin case with a seat and trodes: the safe corner from which you take over the building.'],
 friend:{n:'Glitch, former building-automation spider',t:'Maintained the elevator controls of the Meridian Spire as a subcontractor. Knows the building-control node in the garage, the maintenance schedule of the facade gondola and the rule that the freight elevator does not stop at 110.'},
 rival:{n:'Nullpunkt, Matrix competition',t:'Sells the same exploits to the same people, just an hour earlier. Claims Kessel’s cyberdeck is “a toaster with ambitions”.'},
 why:'The clinic in Puyallup keeps sending reminders. Six nuyen clears the rest. And Glitch said something that will not let you go: “Level 110 has its own host. Nobody builds that for art.”',
 shine:['<b>Garage, building-control node:</b> From here you reach elevators, doors and the garage cameras. Not level 110, but you can make the freight elevator stop there.','<b>Security room & cameras:</b> Swap footage, mark a sensor as defective: that is how Alert drops again. Search Protocol tells you which drone is transmitting right now.','<b>Security server 110:</b> Physical access to doors, sensors and drone logic of the level. Controlled, but every login is logged: Heat after the run.'],
 lore:{h:'The Matrix',t:'The Matrix is everywhere: as augmented reality over the street, as virtual reality when you plug in via trodes or datajack. Corporations run hosts; their security hackers are called spiders. Break in and you risk biofeedback that injures the body. Deckers like Kessel build their tools from scrap because a legal cyberdeck costs more than an apartment in Bellevue.'},
 gm:'Kessel’s siblings are the lever for Veyrath’s greed test: the compact piece of cybertechnology in the collection is exactly the prosthetic controller the sister needs. Describe it when Kessel sees the case. Glitch is right: the host of 110 is separate from the building host (plan 110, location 8). A hack from the garage cannot reach it; physical access in the server room can.',
},
zephyr:{

 look:'Late thirties, sun-weathered, short hair, a flight jacket with the patches cut off. Control-rig jacks at the neck, always a tool belt at the hip.',
 heritage:'North America · Atlanta (CAS), drone missions for the UCAS Army, stuck in Seattle since',

 friendsLabel:'Handy Friends',

 cyber:'A control rig in the neck that links you directly to drones and vehicles. When you “rig”, your body slumps and breathes shallowly. Your left hand is a plain army-issue prosthesis.',
 karma:['You addressed a challenge with technical skill or control.'],
 abilities:[{tag:'Start',t:'You can Finesse a vehicle to take off, control or land it, regardless of its means of propulsion. You gain potency when you make difficult maneuvers while piloting a vehicle.'}],
 items:['“Dragonfly”: a palm-sized rotor drone with camera and microphone, fits through the drone shaft. More features cost one special item choice each.','A heavy motorcycle with sidecar, waiting at the VIP drop-off or the ramp. Seats two, drives autonomously.','Three chemicals or gadgets: Hypersolvent, Hyperglue, Thermite Gel, Nightshades, Sensor Tag, Spatial Scanner, Thermite Rod, Vehicular Override.','Three sprays or patches: Antidote Patch, Hard-Clot, Sterilizer, Stim Patch, Stun Patch.','Soldering irons, special wrenches, precision sensors, a headlamp with magnification.'],
 friend:{n:'“Cap” Okafor, tilt-rotor pilot',t:'Flies freight routes over the Sound and is not afraid of a pass at 400 meters. She drops the crew above the roof or picks them up again at the east facade.'},
 rival:{n:'Dispatcher Vance, Seattle skycab control',t:'Once caught Zephyr rerouting a skycab without clearance. He knows the control rig’s signature and reports it with pleasure.'},
 why:'You want your old reconnaissance drone back; a scrap dealer in Tacoma holds it for twelve nuyen. Six is a start. And this run has altitude, wind and a tower that deserves a proper approach.',
 shine:['<b>Roof & skycab pad:</b> With Ace and Cap you come in from above. The approach transponder grants hacked skycabs landing clearance; without clearance the cab circles and calls in.','<b>Facade gondola:</b> Control box on the roof, docking point on 110. Finesse 2 for the ride in the wind, Vehicular Override from the Utility Harness for the electronics.','<b>Drone shaft:</b> “Dragonfly” flies from the garage to the kitchen on 111 and up to the roof. Gear in portions, eyes everywhere, and nobody asks a delivery drone for an invitation.'],
 lore:{h:'Riggers, drones and corporate wars',t:'A control rig links the nervous system directly to machines: whoever rigs feels the rotor like their own hand. Such implants cost Essence, a piece of humanity that cannot be bought back. The Desert Wars are the televised wars of the corporations, mercenaries fighting in front of cameras. Anyone who flew there knows the difference between a target and a person.'},
 gm:'Zephyr’s control rig is registered army property. Kade’s security arch recognizes military augmentation and reports it silently (Alert +1) if Zephyr walks through the foyer. The gondola ride is the classic Dragon’s Deal: “It takes you exactly to the target and then locks itself to the outside of the building.” Cap flies reliably, but only once: a second pass draws the attention of airspace control.',
},

 look:'2.40 m, calm movements, one horn sawn off (the other polished). Dark coat over a bulletproof vest, a voice like a refrigerator starting up.',

 friend:{n:'Doc Amsel, street doctor in Tacoma',t:'Patches up runners without questions and amputated Bastion’s horn. She knows every bodyguard in town who is on duty at a gala tonight.'},

 lore:{h:'Trolls, goblinization and corporate security',t:'In 2021 people all over the world turned into orks and trolls overnight: goblinization. Trolls are strong, armored and live with doors, chairs and prejudices not built for them. Corporations like hiring them as security and dislike giving them responsibility. A troll who refuses a shoot order is a legend in the shadows and an HR case in Bellevue.'},
 gm:'Kade recognizes Bastion at once if he sees the character undisguised: no siren, but a conversation (“Well now. I thought you were doing night watch in Tacoma these days.”). Afterwards he does not let Bastion out of his sight (Alert +1, one guard stays in view), but he might also ask something useful to the crew. Bastion’s test is not greed but honor: Veyrath judges especially whether violence is avoided when violence would be easier.',
},

 street:'Fizz',pbDesc:'Punk: wily, streetwise, chaos with a plan',idnShort:'SINless',

 lore:{h:'The Barrens, go-gangs and life without a SIN',t:'Redmond used to be a tech suburb. Today the Barrens are a district without power, police or garbage collection, where gangs are the order. Those born here often have no SIN: no school, no doctor, no way out except the shadows. Orks are born where humans move away. Fizz does not consider that fate, but a wall you can climb.'},

},
stille:{
 street:'Hush',pbDesc:'Adept: magic in the body, perfection as a path',idnShort:'real SIN',

 items:['Tattoos that focus your adept core. Supernaturally bonded, unique, painstaking to remove.','A small item, here a worn prayer chain, that shows visions of the past or near future of a place, whether you want them or not.','A short staff effective against astral beings. For the Trial by Fire more ballast than help, unless the watcher comes closer.','Standard: throwing knives or a blowgun with tranquilizer darts. Quiet, light, usable non-lethally.','Standard: grappling hooks and carabiners in case Prowl 2 is not enough for once.'],

 lore:{h:'The Awakening and the adepts',t:'Magic has been back in the world since 2011. About one in a hundred people is Awakened: mages cast and summon, adepts channel mana into their own bodies and become faster, more alert, harder, without anyone seeing it. Cyberware and magic do not mix: every implant costs Essence and weakens the gift. Adepts like Hush therefore choose the body they have and make it the weapon.'},
 gm:'Hush’s aura is as bright in astral space as a mage’s. The watcher on 110 notices it just like a sorcerer (Alert +1 for astral activity nearby). The Strange Trinket is a tool for foreboding: in front of the vault door it can show a vision of a huge shadow gliding across the facade. A quiet foretaste of Veyrath without giving away the twist.',

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function bx(n,cls){let h='';for(let i=0;i<n;i++)h+='<i class="bx'+(cls?' '+cls:'')+'"></i>';return h;}
function dots(n){let h='<span class="dots">';for(let i=0;i<4;i++)h+='<i class="'+(i<n?'on':'')+'"></i>';return h+'</span>';}
function short(t,max){const s=String(t||'').replace(/<[^>]+>/g,'');const m=s.match(/^.*?[.!?](\s|$)/);let r=(m?m[0]:s).trim();if(r.length>max)r=r.slice(0,max-1).replace(/\s+\S*$/,'')+'…';return r;}
/* Sprachschicht: EN-Texte über die deutsche Basis legen (Arrays nach Index) */
function loc(R,lang){
  if(lang!=='en'||!EN[R.id])return R;const e=EN[R.id];const o=Object.assign({},R,e);
  o.metaTraits=R.metaTraits.map((t,i)=>[t[0],(e.metaTraits||[])[i]??t[1]]);
  o.abilities=R.abilities.map((a,i)=>Object.assign({},a,(e.abilities||[])[i]||{}));
  o.items=R.items.map((it,i)=>Object.assign({},it,{t:(e.items||[])[i]??it.t}));
  o.karma=e.karma||R.karma;o.shine=e.shine||R.shine;o.lore=e.lore||R.lore;o.friend=e.friend||R.friend;o.rival=e.rival||R.rival;
  if(R.sup)o.sup=Object.assign({},R.sup,e.sup||{});if(R.spells)o.spells=e.spells||R.spells;
  return o;
}

  </header>
  <div class="cols">
    <div class="col">
      <section><h3>${T.profile}</h3><dl class="kv"><dt>${T.look}</dt><dd>${esc(R.look)}</dd><dt>${T.heritage}</dt><dd>${esc(R.heritage)}</dd><dt>${T.background}</dt><dd>${esc(R.background)}</dd><dt>${T.vice}</dt><dd>${esc(R.vice)}</dd><dt>${T.idn}</dt><dd>${esc(R.idn)}</dd><dt>${T.contacts}</dt><dd>${esc(R.friendsLabel)}</dd></dl></section>
      <section><h3>${T.metatype} · ${esc(R.meta)}</h3><ul class="tr">${R.metaTraits.map(([n,t])=>`<li><b>${esc(n)}.</b> ${esc(t)}</li>`).join('')}</ul></section>
      ${R.cyber?`<section><h3>${T.implants}</h3><p class="txt">${R.cyber}</p></section>`:''}
      <section><h3>${T.karma} <span class="boxes" style="display:inline-flex;vertical-align:middle;margin-left:1mm">${bx(10,'xs')}</span></h3><ul class="tr"><li><b>${T.karmaPb}</b> ${R.karma.join(' ')}</li><li>${T.karma2}</li><li>${T.karma3}</li></ul></section>
      ${spells}
    </div>
    <div class="col">
      <section><h3>${T.actions}</h3>${attrs}</section>
      <div class="trk" style="margin-top:2mm"><h4>${T.edge} <span>${T.edgeSub}</span></h4><div class="boxes">${bx(9)}</div><div class="trauma"><span class="boxes">${bx(4,'sm')}</span>${TRAUMA.map(t=>`<span>${t}</span>`).join('')}</div></div>
      <div class="trk"><h4>${T.harm} <span>${T.harmSub}</span></h4><div class="harm">
        <div class="row"><div class="lv">${T.lvl} 3<small>${T.h3}</small></div><div class="cells one"><div class="cell"></div></div></div>
        <div class="row"><div class="lv">${T.lvl} 2<small>${T.h2}</small></div><div class="cells"><div class="cell"></div><div class="cell"></div></div></div>
        <div class="row"><div class="lv">${T.lvl} 1<small>${T.h1}</small></div><div class="cells"><div class="cell"></div><div class="cell"></div></div></div>
      </div></div>
      <div class="trk"><div class="grp"><div><h5>${T.armor}</h5><div class="inl">${armor}</div></div><div><h5>${T.load}${lb?' (+'+lb+')':''}</h5><div class="inl">${load}</div></div></div></div>
    </div>
    <div class="col">
      <section><h3>${T.abilities}</h3><ul class="ab">${R.abilities.map(ab=>`<li><b>${esc(ab.n)}<i>${esc(ab.tag)}</i></b>${ab.t}</li>`).join('')}</ul></section>
      <section><h3>${T.gear}</h3><table class="items"><tbody>${R.items.map(it=>`<tr class="${it.rec?'rec':''}"><td class="ck"><i class="bx sm"></i></td><td class="ld">${it.l}</td><td><b>${esc(it.n)}</b> ${esc(short(it.t,80))}</td></tr>`).join('')}</tbody></table><p class="std"><b>${T.std}</b> ${T.stdList}</p></section>
      <section><h3>${T.shine}</h3><ul class="shine">${R.shine.map(x=>`<li>${x}</li>`).join('')}</ul></section>
      <div class="trk" style="margin-top:2mm"><div class="grp"><div><h5>${T.nuyen} <span style="font:400 5.8pt 'IBM Plex Mono',monospace;text-transform:none;letter-spacing:0;color:var(--muted)">${T.nuyenSub}</span></h5><div class="boxes">${bx(4)}</div></div><div><h5>${T.stash}</h5><div class="stash">${bx(20,'xs')}</div></div></div></div>
    </div>
  </div>
  <div class="band">
    <section style="margin-top:0"><h3>${T.friend}</h3><p><b>${esc(R.friend.n)}.</b> ${R.friend.t}</p></section>
    <section style="margin-top:0"><h3>${T.rival}</h3><p><b>${esc(R.rival.n)}.</b> ${R.rival.t}</p></section>
    <section style="margin-top:0"><h3>${T.why}</h3><p>${R.why}</p></section>
    <section class="lore"><b>${esc(R.lore.h)}.</b> ${R.lore.t}</section>
  </div>
  <footer class="foot"><span>${T.dice}</span><span>${T.sheet} ${idx+1}/${total}</span></footer>
</section>`;
}

function applyHash(){
  const id=(location.hash||'').replace('#','');
  const ok=RUNNERS.some(r=>r.id===id);
  document.body.classList.toggle('only',ok);
  document.querySelectorAll('.sheet').forEach(s=>s.classList.toggle('show',s.id===id));
  const sel=document.getElementById('selRunner');if(sel)sel.value=ok?id:'';
}
function fillStreets(on){
  document.querySelectorAll('.sheet').forEach(sh=>{const inp=sh.querySelector('input[data-k="street"]');if(!inp)return;
    if(on&&!inp.value){inp.value=sh.dataset.street;inp.dataset.auto='1';}
    else if(!on&&inp.dataset.auto==='1'){inp.value='';delete inp.dataset.auto;}
  });
}
window.fpCheck=()=>[...document.querySelectorAll('.sheet')].map(s=>({id:s.id,sheetOverflow:s.scrollHeight-s.clientHeight,cols:[...s.querySelectorAll('.col')].map(c=>{const k=[...c.children];return Math.round(k.reduce((a,x)=>a+x.getBoundingClientRect().height,0)+(k.length-1)*2*3.7795);}),colsBox:Math.round(s.querySelector('.cols').getBoundingClientRect().height),band:Math.round(s.querySelector('.band').getBoundingClientRect().height),head:Math.round(s.querySelector('.sh').getBoundingClientRect().height)}));

function renderAll(){
  const T=UI[lang];document.documentElement.lang=lang;
  document.getElementById('tbSub').textContent=T.sub;document.getElementById('tbHint').textContent=T.hint;
  document.getElementById('lblStreet').textContent=T.chkStreet;document.getElementById('btnClear').textContent=T.btnClear;document.getElementById('btnPrint').textContent=T.btnPrint;
  document.getElementById('langDE').setAttribute('aria-pressed',lang==='de'?'true':'false');document.getElementById('langEN').setAttribute('aria-pressed',lang==='en'?'true':'false');
  const sel=document.getElementById('selRunner');sel.innerHTML=`<option value="">${T.selAll}</option>`+RUNNERS.map(R=>{const L=loc(R,lang);return `<option value="${R.id}">${esc(L.street)} · ${esc(R.pb)} · ${esc(R.meta)}</option>`;}).join('');
  document.getElementById('stack').innerHTML=RUNNERS.map((R,i)=>renderSheet(R,i,RUNNERS.length)).join('');
  document.querySelectorAll('.sheet input').forEach(i=>i.addEventListener('input',()=>{const id=i.closest('.sheet').id;st(id)[i.dataset.k]=i.value;delete i.dataset.auto;save();}));
  const chk=document.getElementById('chkStreet');fillStreets(chk.checked);
  applyHash();
}
(function boot(){
  const sel=document.getElementById('selRunner');
  sel.addEventListener('change',()=>{if(sel.value)location.hash=sel.value;else history.replaceState(null,'',location.pathname+location.search);applyHash();window.scrollTo(0,0);});
  window.addEventListener('hashchange',applyHash);
  const chk=document.getElementById('chkStreet');
  let pre=false;try{pre=localStorage.getItem('fp-bogen-street')==='1';}catch(e){}
  chk.checked=pre;
  chk.addEventListener('change',()=>{fillStreets(chk.checked);try{localStorage.setItem('fp-bogen-street',chk.checked?'1':'0');}catch(e){}});
  document.getElementById('btnClear').addEventListener('click',()=>{document.querySelectorAll('.sheet input').forEach(i=>{i.value='';delete i.dataset.auto;const s=st(i.closest('.sheet').id);delete s[i.dataset.k];});chk.checked=false;save();try{localStorage.setItem('fp-bogen-street','0');}catch(e){}});
  document.getElementById('btnPrint').addEventListener('click',()=>{try{window.print();}catch(e){}});
  const setLang=l=>{lang=l;try{localStorage.setItem('fp-lang',l);}catch(e){}renderAll();};
  document.getElementById('langDE').addEventListener('click',()=>setLang('de'));
  document.getElementById('langEN').addEventListener('click',()=>setLang('en'));
  renderAll();
})();

</script>

</body>
</html>
