<title>Feuerprobe SL-Leitfaden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E4E8EC; --surface:#FBFBFC; --surface-2:#F0F2F5; --ink:#161C26; --ink-2:#3C4756; --muted:#66717F; --line:#CBD1D8; --line-2:#AEB7C1;
  --accent:#0F7B86; --accent-soft:rgba(15,123,134,.12); --gm:#8A3FB3; --gm-soft:rgba(138,63,179,.08);
  --warn:#B3382C; --warn-soft:rgba(179,56,44,.09); --gold:#A8720A; --gold-soft:rgba(168,114,10,.1);
  --alert0:#2C8452; --alert1:#A8720A; --alert2:#C96A0B; --alert3:#B3382C;
  --box:#FBFBFC; --shadow:0 1px 2px rgba(20,28,40,.08),0 10px 28px rgba(20,28,40,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1218; --surface:#151B23; --surface-2:#1B222C; --ink:#E7EBF0; --ink-2:#C4CCD6; --muted:#8E9AA9; --line:#293441; --line-2:#3B4756;
    --accent:#3FC1CC; --accent-soft:rgba(63,193,204,.16); --gm:#CD85FF; --gm-soft:rgba(205,133,255,.1);
    --warn:#F0716A; --warn-soft:rgba(240,113,106,.12); --gold:#E9BC3F; --gold-soft:rgba(233,188,63,.12);
    --alert0:#5AD08A; --alert1:#E9BC3F; --alert2:#FFAB45; --alert3:#F0716A;
    --box:#1B222C; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1218; --surface:#151B23; --surface-2:#1B222C; --ink:#E7EBF0; --ink-2:#C4CCD6; --muted:#8E9AA9; --line:#293441; --line-2:#3B4756;
  --accent:#3FC1CC; --accent-soft:rgba(63,193,204,.16); --gm:#CD85FF; --gm-soft:rgba(205,133,255,.1);
  --warn:#F0716A; --warn-soft:rgba(240,113,106,.12); --gold:#E9BC3F; --gold-soft:rgba(233,188,63,.12);
  --alert0:#5AD08A; --alert1:#E9BC3F; --alert2:#FFAB45; --alert3:#F0716A;
  --box:#1B222C; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding-block:20px 56px;padding-inline:16px}
h1,h2,h3,h4{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-wrap:balance;margin:0}
a{color:var(--accent)}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-block:4px 18px;border-bottom:1px solid var(--line)}
header.top h1{font-size:clamp(34px,5vw,50px);line-height:.95;font-weight:700}
header.top h1 small{display:block;font-size:.42em;font-weight:500;color:var(--ink-2);letter-spacing:.04em;margin-top:6px}
.tog{display:flex;flex-wrap:wrap;gap:8px}
.tog button,.tog a{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 13px/1 "IBM Plex Sans",sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.tog .langs{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.tog .langs button{border:0;border-radius:0;padding:8px 13px;font-weight:600;letter-spacing:.04em}
.tog .langs button+button{border-left:1px solid var(--line-2)}
.tog .langs button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* layout: sidebar + content */
.layout{display:grid;gap:24px;margin-top:22px;align-items:start}
@media (min-width:1040px){.layout{grid-template-columns:272px minmax(0,1fr)}.side{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;padding-right:4px}}
.side{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.panel h3{font:600 11.5px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel h3 span{font-weight:400;letter-spacing:.02em;text-transform:none}
nav.steps ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
nav.steps a{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:13.5px}
nav.steps a:hover{background:var(--surface-2)}
nav.steps a.cur{background:var(--accent-soft);color:var(--ink)}
nav.steps .n{font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.04em;color:var(--accent);text-align:center;border:1px solid var(--line-2);border-radius:6px;padding:1px 0;width:24px}
nav.steps a.done .n{background:var(--accent);color:#fff;border-color:var(--accent)}
nav.steps .t{font:500 10.5px "IBM Plex Mono",monospace;color:var(--muted);white-space:nowrap}
nav.steps li.sep{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.prog{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

/* alert clock */
.clock{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.clock svg{width:96px;height:96px;display:block}
.clock .seg{fill:var(--surface-2);stroke:var(--surface);stroke-width:2;cursor:pointer;transition:fill .15s}
.clock .seg.on{fill:var(--alertcol,var(--warn))}
.clock .seg:hover{filter:brightness(1.08)}
.clock .lvl{font:700 24px/1 "Barlow Condensed",sans-serif}
.clock .lvl small{display:block;font:500 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.clock .st{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.clock .st b{color:var(--ink)}
.clockbtns{display:flex;gap:6px;margin-top:10px}
.mini{appearance:none;border:1px solid var(--line-2);background:var(--box);color:var(--ink);font:500 12px "IBM Plex Sans",sans-serif;padding:5px 10px;border-radius:999px;cursor:pointer}
.mini:hover{background:var(--surface-2)}

/* payoff calculator */
.calc label{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding:4px 0}
.calc input{margin:3px 0 0;accent-color:var(--accent)}
.calc .out{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.calc .out b{font:700 30px/1 "Barlow Condensed",sans-serif;color:var(--gold)}
.calc .out span{font-size:12.5px;color:var(--ink-2)}
.calc .verdict{grid-column:1/-1;font-size:12.5px;padding:6px 9px;border-radius:7px;background:var(--surface-2)}
.calc .verdict.good{background:color-mix(in srgb,var(--alert0) 14%,transparent)}
.calc .verdict.mid{background:color-mix(in srgb,var(--alert1) 16%,transparent)}
.calc .verdict.bad{background:var(--warn-soft)}

/* content */
.main{display:grid;gap:22px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px 22px}
.chap{scroll-margin-top:16px}
.chap>header{display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:start;margin-bottom:14px}
.chap>header .num{font:600 11.5px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.chap>header h2{font-size:clamp(26px,3vw,34px);font-weight:700;line-height:1.02}
.chap>header .lead{grid-column:1;color:var(--ink-2);max-width:78ch;margin-top:6px;font-size:14.5px}
.chap>header .meta{display:flex;flex-direction:column;gap:6px;align-items:flex-end;grid-row:1/3}
.chap .time{font:500 11.5px "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.done{display:inline-flex;align-items:center;gap:6px;font:500 12.5px "IBM Plex Sans",sans-serif;border:1px solid var(--line-2);border-radius:999px;padding:5px 10px;cursor:pointer;background:var(--box);color:var(--ink)}
.done input{margin:0;accent-color:var(--accent)}
.done.on{border-color:var(--accent);background:var(--accent-soft)}
.chap h3{font:600 12px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.chap h3:first-child{margin-top:0}
.chap h4{font:700 17px "Barlow Condensed",sans-serif;letter-spacing:.01em;margin:12px 0 4px}
.chap p{margin:0 0 10px;max-width:78ch;color:var(--ink-2)}
.chap p b,.chap li b,.chap td b{color:var(--ink);font-weight:600}
.chap ul,.chap ol{margin:0 0 10px;padding-left:20px;color:var(--ink-2);display:grid;gap:4px;max-width:78ch}
.chap li::marker{color:var(--accent)}
.chap ol li::marker{font-weight:600;color:var(--ink)}
.q{margin:10px 0 12px;padding:12px 16px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;font-style:italic;color:var(--ink);max-width:78ch}
.q.sys{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.04em;border-color:var(--line-2)}
.note{margin:10px 0 12px;padding:11px 14px;border-radius:0 10px 10px 0;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:13.5px;color:var(--ink);max-width:78ch}
.note.gm{border-color:var(--gm);background:var(--gm-soft)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.gold{border-color:var(--gold);background:var(--gold-soft)}
.note h5{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px;color:var(--accent)}
.note.gm h5{color:var(--gm)}.note.warn h5{color:var(--warn)}.note.gold h5{color:var(--gold)}
.note p:last-child,.note ul:last-child{margin-bottom:0}
.grid{display:grid;gap:12px;margin:8px 0 12px}
@media (min-width:760px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.tile h4{margin:0 0 6px;font-size:17px}
.tile h4 small{display:block;font:500 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.tile p,.tile ul{font-size:13.5px;margin-bottom:6px}
.tile p:last-child,.tile ul:last-child{margin-bottom:0}
.tile .pro,.tile .con{padding-left:18px}
.tile .pro li::marker{content:"+ ";color:var(--alert0)}
.tile .con li::marker{content:"− ";color:var(--warn)}
.tile .fb{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:8px}
.tile .fb b{color:var(--ink-2)}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 12px}
table.tb th{text-align:left;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line-2)}
table.tb td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
table.tb td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
table.tb td.r{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12.5px;white-space:nowrap}
details.qa{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--surface)}
details.qa summary{cursor:pointer;padding:10px 14px;font:600 15px "IBM Plex Sans",sans-serif;color:var(--ink);list-style:none;display:flex;gap:10px;align-items:baseline}
details.qa summary::before{content:"?";font:700 13px "Barlow Condensed",sans-serif;color:var(--accent);border:1px solid var(--accent);border-radius:6px;width:20px;height:20px;display:inline-grid;place-items:center;flex:none}
details.qa[open] summary{border-bottom:1px solid var(--line)}
details.qa .a{padding:10px 14px 4px 44px}
.stages{display:grid;gap:8px;margin:8px 0 12px}
@media (min-width:760px){.stages{grid-template-columns:repeat(4,1fr)}}
.stage{border:1px solid var(--line);border-top:5px solid var(--sc);border-radius:10px;padding:10px 12px;font-size:13px}
.stage b{display:block;font:700 18px/1 "Barlow Condensed",sans-serif;color:var(--ink);margin-bottom:2px}
.stage i{display:block;font:500 11px "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--sc);font-style:normal;margin-bottom:6px}
.stage ul{padding-left:16px;font-size:12.5px;gap:2px;margin:0}
.deals{list-style:none;padding:0;display:grid;gap:8px}
.deals li{border:1px dashed var(--line-2);border-radius:10px;padding:9px 12px;font-size:13.5px;color:var(--ink)}
.deals li::before{content:"⚖ ";color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font:500 12px "IBM Plex Mono",monospace;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.chip.k{border-color:var(--accent);color:var(--accent)}

/* NPCs */
.npcs{display:grid;gap:14px;margin:6px 0 4px}
@media (min-width:760px){.npcs{grid-template-columns:1fr 1fr}}
.npc{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:grid;grid-template-columns:156px 1fr;box-shadow:var(--shadow)}
@media (max-width:480px){.npc{grid-template-columns:1fr}}
.npc .por{position:relative;background:var(--surface-2);border-right:1px solid var(--line);min-height:176px;display:grid;place-items:center;overflow:hidden}
@media (max-width:480px){.npc .por{border-right:0;border-bottom:1px solid var(--line);min-height:200px}}
.npc .por svg{width:100%;height:100%;position:absolute;inset:0;color:var(--line-2)}
.npc .por img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.npc .por .lbl{position:absolute;left:0;right:0;bottom:0;text-align:center;font:500 10px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 4px;background:linear-gradient(transparent,var(--surface-2))}
.npc .por .pick{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.npc .por .rm{position:absolute;top:6px;right:6px;border:0;background:rgba(0,0,0,.55);color:#fff;font:600 11px/1 "IBM Plex Sans",sans-serif;padding:4px 7px;border-radius:999px;cursor:pointer;display:none}
.npc .por.own .rm{display:block}
.npc .por{aspect-ratio:1/1;min-height:0;align-self:start;border-bottom:1px solid var(--line)}
.npc.wide{grid-column:1/-1;grid-template-columns:1fr}
.npc.wide .por{border-right:0;border-bottom:1px solid var(--line)}
.npc.wide .por{aspect-ratio:16/9}
.npc .por.has .lbl{display:none}
.npc .por.has svg{display:none}
.npc .info{padding:14px 16px 16px;min-width:0}
.npc .nm{font:700 26px/1 "Barlow Condensed",sans-serif;letter-spacing:.01em}
.npc .rl{font-size:13px;color:var(--ink-2);margin:4px 0 8px}
.npc .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.npc .tags span{font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
.npc .tags span.k{border-color:var(--gold);color:var(--gold)}
.npc p{font-size:13.5px;margin:0 0 8px;max-width:none}
.npc h5{font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.npc ul{font-size:13px;margin:0;padding-left:18px;gap:2px}
.npc .sec{border-left:3px solid var(--gm);background:var(--gm-soft);padding:7px 10px;border-radius:0 8px 8px 0;font-size:13px;margin-top:10px;color:var(--ink)}
.npc .sec h5{color:var(--gm);margin:0 0 3px}
.npc .say{font-style:italic;color:var(--ink);font-size:13px;border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}

/* quick reference */
.qr{display:grid;gap:12px}
@media (min-width:760px){.qr{grid-template-columns:1fr 1fr}}
.qr .tile ul{padding-left:16px}
.qr .tile li{font-size:13px}

.fine{font-size:12.5px;color:var(--muted);margin-top:22px;max-width:90ch}
.fine a{color:var(--accent)}
.toplink{position:fixed;right:14px;bottom:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 12px;font:500 12.5px "IBM Plex Sans",sans-serif;text-decoration:none;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toplink.show{opacity:1;pointer-events:auto}

@media print{
  @page{size:A4;margin:11mm}
  body{background:#fff;font-size:11.5px}
  .tog,.side,.toplink,.done,.npc .por .rm{display:none!important}
  .wrap{max-width:none;padding:0}
  .layout{display:block;margin-top:10px}
  .main{gap:10px}
  .card{box-shadow:none;border-color:#bbb;break-inside:avoid;padding:12px 14px}
  .card.long{break-inside:auto}
  .chap>header h2{font-size:22px}
  .npc{break-inside:avoid;box-shadow:none}
  .npcs{grid-template-columns:1fr 1fr}
  .npc.wide .por{aspect-ratio:21/9}
  .grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}
  .stages{grid-template-columns:repeat(4,1fr)}
  details.qa{break-inside:avoid}
  details.qa summary::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .note,.q,.stage,.tile,.npc .por,.npc .sec{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:inherit;text-decoration:none}
}
</style>

<div class="wrap">
<header class="top">
  <div>
    <div class="eyebrow" id="eyebrow">Shadowrun · Feuerprobe · Runners in the Shadows</div>

  </div>
  <div class="tog">
    <span class="langs" role="group" aria-label="Sprache / Language"><button type="button" id="langDE" aria-pressed="true">DE</button><button type="button" id="langEN" aria-pressed="false">EN</button></span>
    <a id="lnkPlans" href="meridian-spire-plaene.html"></a>
    <a id="lnkRunner" href="feuerprobe-runner.html"></a>
    <button type="button" id="btnPrint"></button>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <nav class="panel steps" aria-label="Kapitel"><h3 id="navH"></h3><ol id="nav"></ol><div class="prog"><i id="progBar"></i></div></nav>

      <div class="clock">

      </div>

    <section class="panel calc" id="calcPanel"><h3 id="calcH"></h3><div id="calcBody"></div></section>

  <div class="main" id="main"></div>
</div>

<p class="fine" id="fine"></p>
</div>

 npcs:[
  {id:'johnson',name:'Mr. Johnson',role:'Variante A · erfahrener Vermittler, das Gesicht des Auftrags',tags:['Elf','Jahrzehnte im Geschäft','Tablet & AR-Brille'],kind:'person',
   bio:'Ein ruhiger Profi, der für Veyrath die Kontakte in die Schatten hält. Er erscheint pünktlich, sitzt bereits in der Privatsphäre-Nische, wenn die Crew eintrifft, und hält ein gläsernes Tablet in der Hand, auf das er während des ganzen Gesprächs kaum hinunterschaut: Was er wissen muss, blendet ihm die randlose AR-Brille ein. Keine Drohung, kein Theater. Johnson hält Absprachen ein und erwartet dasselbe.',
   look:['Älterer Elf, silbergraues Haar zurückgekämmt und im Nacken gebunden, feine Falten um die Augen','Randlose AR-Brille, ein dünnes Kabel läuft zum Ohr; gläsernes Tablet','Anthrazitfarbener Maßanzug, keine Insignien','Höflich, sachlich, nie hektisch','Trinkt seinen Soykaf tatsächlich aus'],
   play:['Nennt „ungeöffnet“ sachlich als eine Bedingung unter mehreren, betont es nicht.','Feilscht nach dem Run nicht über vereinbarte Bedingungen.','Beantwortet Fragen zum Auftraggeber mit „Mein Klient legt Wert auf Diskretion.“'],
   secret:'Arbeitet direkt für Veyrath und weiß, dass der Run eine Feuerprobe ist. Er verrät es nicht, lügt aber auch nicht plump: Wer ihn scharf beobachtet, merkt, dass er die Crew studiert wie Bewerber.',
   say:'„Der Koffer wird geschlossen übergeben. Alles andere im Raum interessiert meinen Klienten nicht, und es sollte auch euch nicht interessieren.“'},
  {id:'johnson-rookie',name:'Mr. Johnson',role:'Variante B · Rookie-Fixer, der selbst geprüft wird',tags:['Mensch','Anfang 20','Datenbuchsen & Tablet'],kind:'person',
   bio:'Veyraths neuester Mittelsmann, kaum älter als die jüngsten Runner am Tisch und noch nie für einen Auftrag dieser Größe verantwortlich. Er hat sich gründlich vorbereitet, viel zu gründlich: Die Bedingungen liest er vom Tablet ab, die Preisspanne hat er auswendig gelernt, und für jede Frage gibt es eine vorbereitete Antwort, bis eine kommt, mit der er nicht gerechnet hat. Er will unbedingt professionell wirken und ist dabei sympathischer, als ihm lieb ist.',
   look:['Gebleichtes Haar mit neongrüner Strähne über dem Auge, eine Seite kurz','Datenbuchsen an beiden Schläfen, Kabel bis in den Kragen; AR-Brille','Anzug eine Spur zu scharf, Krawatte gelockert; ein Tablet mit gesprungenem Rand','Lächelt zu oft, schaut zu oft aufs Tablet'],
   play:['Die Vertragsbedingungen bleiben genau dieselben; nur der Ton ist ein anderer.','Bei hartem Feilschen gerät er ins Schwimmen und sucht im Tablet nach einer Antwort. Mehr als die vorgesehene Spanne gibt er trotzdem nicht her.','Unter Druck rutscht ihm ein Detail zu viel heraus, etwa wie genau sein Klient den Turm kennt. Gute Consequence, ohne die Enthüllung vorwegzunehmen.','Wer ihn fair behandelt, gewinnt einen Kontakt, der mit Veyrath wächst.'],
   secret:'Weiß, dass der Run eine Feuerprobe für die Crew ist, aber nicht, dass Veyrath ihn ebenso bewertet: wie er das Briefing führt, ob er Bedingungen hält und ob er der Crew nach dem Run sauber auszahlt. Scheitert die Crew, scheitert auch er. Er verrät nichts, lügt aber schlecht, und wer ihn genau beobachtet, merkt, dass er mindestens so nervös ist wie die Runner.',
   say:'„Also. Bedingungen. Der Koffer bleibt zu, nichts anderes mitnehmen, und Dr. Venn wird nicht angefasst. Das ist … nicht verhandelbar. Ja. Nicht verhandelbar.“'},
  {id:'kade',name:'Dorian Kade',role:'Variante A · Sicherheitschef der Gala, kennt den Weg zur Keycard',tags:['Mensch','Cyberarme','Augmentierte Reflexe'],kind:'person',
   bio:'Leitet die Sicherheit des Abends und will vor allem eines: keinen sichtbaren Zwischenfall vor den VIPs. Kade ist höflich, ruhig und ausgesprochen aufmerksam. Er trägt die Vault-Keycard nicht selbst, weiß aber genau, wo sie in der schwarzen Kassette im Eventbüro liegt und wie eine legitime Entnahme protokolliert wird. Er autorisiert die Ausgabe oder bestimmt jemanden dafür.',
   look:['Eleganter dunkler Maßanzug über zwei makellos verchromten Cyberarmen','Kleine, fast unmerkliche Zuckungen in Händen, Schultern und Blick','Diskret mit einer Pistole bewaffnet'],
   play:['Informationsquelle, Hindernis oder Gelegenheit, nie zwingendes Zwischenziel.','Bittet höflich um Identifikation, statt zu drohen.','Reagiert auf Alert: bei Verdacht fragt er nach, bei aktivem Alarm hält er Gäste aus gefährdeten Bereichen fern.'],
   secret:'Ahnt nichts vom Test. Wer ihm eine plausible Erklärung liefert, kann Alert senken; wer ihn täuscht, bekommt einen Gegner mit sehr schnellen Reflexen.',
   say:'„Ich habe niemanden mit Ihrer Beschreibung auf der Liste. Das muss nichts heißen. Helfen Sie mir, es zu klären, bevor jemand anderes es tut.“'},
  {id:'kade-troll',name:'Dorian Kade',role:'Variante B · Troll-Sicherheitschef, der in die High Society passt',tags:['Troll','Cyberarme','Augmentierte Reflexe'],kind:'person',
   bio:'Leitet die Sicherheit des Abends und will vor allem eines: keinen sichtbaren Zwischenfall vor den VIPs. Trolle und Penthouse-Galas passen eigentlich nicht zusammen, Kade passt trotzdem hinein: Er kennt die Namen der Gäste, die Etikette und die Weinkarte, bewegt sich erstaunlich leise durch die Menge und spricht leiser als die meisten Menschen im Raum. Gefährlich bleibt er trotzdem, und das sieht jeder. Wie Variante A trägt er die Vault-Keycard nicht selbst, weiß aber genau, wo sie in der schwarzen Kassette im Eventbüro liegt und wie eine legitime Entnahme protokolliert wird.',
   look:['Knapp 2,60 m, breite Schultern, mitternachtsblauer Maßanzug in Trollmaß, makellos geschnitten','Geschwungene, polierte Hörner mit schmalen Platinringen; gepflegte Hauer','Zwei verchromte Cyberarme, eigens für ihn gefertigt; die Manschettenknöpfe sitzen trotzdem','Kleine Zuckungen in Händen und Blick verraten augmentierte Reflexe','Pistole im Schulterholster, die in seiner Hand fast zierlich wirkt'],
   play:['Gleiche Rolle wie Variante A: Informationsquelle, Hindernis oder Gelegenheit, nie zwingendes Zwischenziel.','Höflich, gewählt, ein wenig altmodisch. Wer ihn für bloße Muskeln hält, wird mit einem Lächeln korrigiert.','Schon seine Präsenz ist eine Consequence: Wo er sich hinstellt, wird es still, und Runner geraten leichter in Erklärungsnot.','Kommt es zur Gewalt, ist er schneller, als ein Troll sein dürfte.'],
   secret:'Ahnt nichts vom Test. Er hat sich seinen Platz in dieser Welt hart erarbeitet und merkt sofort, wenn jemand mit Vorurteilen gegen ihn spielt. Wer ihn respektvoll behandelt und eine plausible Erklärung liefert, kann Alert senken; wer ihn täuscht, bekommt einen Gegner mit Trollkraft und sehr schnellen Reflexen.',
   say:'„Bitte, bleiben Sie sitzen. Ich setze mich nicht dazu, die Stühle hier sind nicht für mich gebaut. Aber ich hätte gern Ihren Namen. Und dann den richtigen.“'},
  {id:'venn',name:'Dr. Amara Venn',role:'Leitende Kuratorin der Vesperline Collections · biometrischer Schlüssel',tags:['Ork','Mitte 40','Linkes Auge = Biometrie'],kind:'person',key:true,
   bio:'Kunsthistorikerin und Sicherheitskuratorin. Sie verantwortet Auswahl, Provenienz und physische Übergabe der wertvollsten Stücke und ist eine der wenigen Personen, deren Augenscan der Tresor akzeptiert. Venn hält die meisten Gäste für Leute mit zu viel Geld und zu wenig Ahnung; ernsthaftes Interesse an einem Werk gewinnt sofort ihre Aufmerksamkeit. Sie will den Abend ohne Zwischenfall beenden und danach nach Hause.',
   look:['Groß, schlank, sehr aufrechte Haltung, rasierter Kopf','Polierte silberne Kappen auf beiden Hauern','Linkes Auge bernsteinfarben und natürlich; rechtes Auge schwarzes Cyberauge ohne Iris','Dunkelgrüner, streng geschnittener Abendanzug, goldene Federbrosche'],
   play:['Hält sich meist in der Galerie auf, zieht sich gelegentlich in den Wintergarten zurück.','Kann Gäste zu einer privaten Besichtigung anmelden und bis zur Schleuse begleiten.','Besitzt die Vault-Keycard nicht und kann den Tresor nicht allein öffnen.','Darf laut Auftrag nicht verletzt werden. Entführung ist möglich, aber auffällig.'],
   secret:'Weiß nichts von der Feuerprobe. Ihr Misstrauen ist eine gute Consequence: Sie stellt Rückfragen, holt Kade dazu oder kündigt ihren Aufbruch an, wenn die Party zu lange dauert.',
   say:'„Sie sehen das Stück tatsächlich an, nicht das Preisschild. Das ist heute Abend selten. Kommen Sie, ich zeige Ihnen, warum es hier hängt.“'},
  {id:'veyrath',name:'Veyrath',role:'Erwachsener Drache · Eigentümer und eigentlicher Auftraggeber',tags:['Drache','Sammler','Kein Gegner'],kind:'dragon',
   bio:'Ein zurückhaltender, außerordentlich vermögender Sammler, der lieber durch Mittelsleute handelt, als öffentlich aufzutreten. Ihm gehören Penthouse, Tresor, Sammlung und Aktenkoffer; hinter Vesperline Collections und mehreren Briefkastenfirmen steht er. Veyrath betrachtet Runner als potenziell wertvolle Spezialisten und sucht eine kleine Crew für spätere Aufgaben. Was ihn interessiert, ist Verlässlichkeit, wenn Gier, Angst und Improvisation kollidieren.',
   look:['Erscheint erst bei der Enthüllung: ein gewaltiger Schatten, Flügel im Regen','Spricht direkt in die Gedanken der Runner','Bleibt außer Reichweite, blockiert nichts, greift nicht an'],
   play:['Rettet die Crew nicht und behindert sie nicht. Das Gebäude ist das Hindernis, nicht er.','Bewertet am Ende: Disziplin, Kreativität, Teamwork, Eskalationskontrolle.','Misst seinem Eigentum mehr Wert bei als metamenschlichem Leben. Das ist bewusst unangenehm.','Wird nie zur Kampfbegegnung. Schießt jemand auf ihn, beendet er den Kontakt.'],
   secret:'Hat für diese Nacht eine schwierige, aber realistisch nutzbare Schwachstelle im Event Mode zugelassen. Sammlung, Gäste, Personal und Sicherheit sind echt. Gelingt der Crew eine außergewöhnliche Recherche, darf sie das vorher erfahren; die Enthüllung wird dann zur Bestätigung.',
   say:'„Nennt mich Veyrath. Der Turm ist mein. Der Tresor ist mein. Und der Koffer, den ihr gerade gestohlen habt, ebenfalls.“'},
 ],

 chapters:[
  {id:'blick',num:'Auf einen Blick',title:'Was hier wirklich passiert',time:'vor der Sitzung',
   lead:'Ein Oneshot für 3–4 Spieler:innen, drei bis vier Stunden, Seattle 2080. Die Crew soll während einer Gala einen Aktenkoffer aus einem privaten Tresorgeschoss stehlen. Was sie nicht weiß: Der Tresor gehört dem Auftraggeber.',
   blocks:[
    ['tiles',3,[
      {h:'Der Auftrag',sub:'öffentlich',ul:['Schwarzen Aktenkoffer aus dem Tresor unter dem Penthouse holen, während der Gala','Koffer <b>ungeöffnet</b> übergeben, sonst <b>nichts</b> mitnehmen','Dr. Amara Venn nicht verletzen, Tote vermeiden','Zugang: physische Vault-Keycard + Augenscan von Venn']},
      {h:'Die Wahrheit',sub:'nur SL',ul:['Penthouse, Tresor, Sammlung und Koffer gehören dem Drachen <b>Veyrath</b>','Mr. Johnson arbeitet für Veyrath; der Run ist eine <b>Feuerprobe</b>','Kein rivalisierender Drache, kein fremder Besitzer, kein versteckter Twist dahinter','Veyrath greift nicht ein und rettet nicht']},
      {h:'Was geprüft wird',sub:'Bewertungsmaßstab',ul:['Anweisungen verstehen und ernst nehmen','Ungewöhnliche Probleme selbst lösen','Unter Druck nicht sofort eskalieren','Nicht alles stehlen, nur weil es geht','Als Team arbeiten']}]],
    ['h3','Zeitplan für 3–4 Stunden'],
    ['table',['Abschnitt','Richtwert'],[['Charakterwahl + Kurzintro Shadowrun/RitS','15–25 Min.'],['Treffen mit Mr. Johnson','10–15 Min.'],['Gather Information + Plan','10–20 Min.'],['Zugang und Party','45–70 Min.'],['Tresorgeschoss','45–70 Min.'],['Flucht + Enthüllung','20–35 Min.'],['Puffer','20–30 Min.']],[1]],
    ['p','Wurden die Charaktere vorher gewählt, bleibt deutlich mehr Zeit für die Mission. Die Kapitel links folgen dem Ablauf am Tisch; hake sie ab, wenn du weiter bist. Die Alert Clock und der Payoff-Rechner begleiten dich durch den ganzen Run.'],
    ['note','gm','Leitlinien',
     '<ul><li>Kein Playbook und keine einzelne Action ist Pflicht.</li><li>Keycard und Augenscan sind Probleme, keine vorgegebenen Rätsel.</li><li>Veyrath testet die Crew, manipuliert aber kein Würfelergebnis und wird nie zur Kampfbegegnung.</li><li>Voller Alert ist Eskalation, kein automatisches Scheitern. Consequences erzeugen neue Situationen.</li><li>Kompetente Runner brauchen für Routine keinen Roll. Gute Ideen dürfen vorbereitete Szenen umgehen.</li><li>Wenn die Runner die Wahrheit über den Auftraggeber verdienen, verrate sie.</li><li>Für 3–4 Stunden gilt: Spielbarkeit vor Vollständigkeit.</li></ul>'],
    ['h3','Wichtige Personen'],
    ['npcs']]},

  {id:'einstieg',num:'Schritt 1',title:'Einstieg am Tisch',time:'15–25 Min.',
   lead:'Charaktere wählen, dann Welt und Regeln in wenigen Minuten. Mehr braucht niemand vor dem ersten Wurf.',
   blocks:[
    ['h3','Shadowrun in fünf Sätzen'],
    ['p','Seattle 2080 ist eine Stadt gewaltiger Konzerne, extremer Unterschiede, allgegenwärtiger Vernetzung und realer Magie. Menschen und Metamenschen leben zwischen AR-Werbung, Cyberware, Drohnen, Geistern und privatisierter Sicherheit. <b>Shadowrunner</b> erledigen inoffizielle Aufträge für Leute, die nicht mit einer Tat in Verbindung gebracht werden wollen; deshalb heißt der Auftraggeber <b>Mr. Johnson</b>.'],
    ['ul',['Ihr seid kompetente Berufskriminelle und dürft euch riskante Dinge zutrauen.','Die Welt ist voller Technik, Matrix und Magie.','Ein guter Plan hilft, aber niemand plant jede Eventualität vor.','Wenn etwas schiefgeht, entsteht eine neue Komplikation statt eines Game Over.']],
    ['h3','RitS in fünf Minuten'],
    ['tiles',2,[
      {h:'Action Roll',sub:'Fiction first',p:'Erst beschreibt die Spielerin, was ihr Runner tut und will. Nur wenn etwas Gefährliches auf dem Spiel steht, wird gewürfelt: so viele W6 wie das Action Rating, der höchste zählt.',ul:['<b>6</b> voller Erfolg · <b>4/5</b> Erfolg mit Consequence · <b>1–3</b> schlecht plus Consequence','Mehrere 6en: Critical','Vorher klären: <b>Position</b> (Controlled / Risky / Desperate) und <b>Effect</b> (Limited / Standard / Great)','Actions sind keine Wissensfertigkeiten; sie folgen dem, was die Figur tatsächlich tut']},
      {h:'Edge & Flashbacks',sub:'Reserve und Vorbereitung',ul:['<b>2 Edge</b>: sich pushen, +1d oder mehr leisten','<b>1 Edge</b>: einem Teammitglied assistieren, +1d','<b>Resistance Roll</b> mildert eine Consequence; funktioniert immer, der Wurf bestimmt die Edge-Kosten','<b>Flashback</b>: mitten im Run erklären, was man vorbereitet hatte. Je aufwendiger, desto mehr Edge']}]],
    ['h3','Plan und Engagement'],
    ['p','Die Gruppe wählt nur einen groben Plan und nennt das erforderliche Detail. Danach folgt der <b>Engagement Roll</b>, und du schneidest direkt zur ersten interessanten Situation.'],
    ['chips',['Assault · Point of attack','Deception · Method','Social · Connection','Stealth · Entry point','Supernatural · Power / method','Transport · Route & means']],
    ['note','warn','Wichtig','Lass die Gruppe nicht eine Stunde lang hypothetische Sicherheitsmaßnahmen durchplanen. Sobald Plan und Detail stehen, beginnt der Run. Alles Weitere sind Flashbacks.']]},

  {id:'johnson',num:'Schritt 2',title:'Treffen mit Mr. Johnson',time:'10–15 Min.',
   lead:'Ruhig, professionell, ohne Falle. Der Auftrag wird klar formuliert, die Bedingungen sachlich genannt. Hier legst du den Maßstab, an dem die Crew später gemessen wird.',
   blocks:[
    ['h3','Empfohlener Treffpunkt: „Raincheck“'],
    ['p','Ein rund um die Uhr geöffnetes Soykaf-Diner auf einer mittleren Etage eines gemischt genutzten Hochhauses. Regen läuft in breiten Bahnen über die Panoramascheiben. Die meisten Tische sind leer; draußen warten Lieferdrohnen an einer Ladeschiene. Johnson sitzt bereits in einer halbtransparenten Privatsphäre-Nische, anthrazitfarbener Maßanzug, randlose AR-Brille, ein gläsernes Tablet vor sich, daneben ein dampfender Soykaf.'],
    ['note','gm','Zwei Johnsons zur Wahl','Unter „Wichtige Personen“ stehen zwei Varianten: der erfahrene elfische Profi, der sein Tablet kaum braucht (wie hier beschrieben) und ein junger Rookie-Fixer mit Datenbuchsen, der sich an sein Tablet klammert, den Veyrath ebenfalls prüft. Auftrag, Bedingungen und Bezahlung sind in beiden Fällen gleich; der Rookie macht das Briefing lockerer und gibt der Crew jemanden, mit dem sie mitfiebern kann.'],
    ['tiles',3,[
      {h:'Späte Fähre',sub:'Alternative',p:'Johnson steigt an einer Haltestelle zu, setzt sich zehn Minuten neben die Crew und verschwindet am nächsten Anleger in der Menge.'},
      {h:'Parkdeck über den Wolken',sub:'Alternative',p:'Ein fast leeres automatisiertes Parkhaus in den oberen Etagen eines Büroturms. Wind und Regen peitschen durch offene Seiten, autonome Fahrzeuge fahren wortlos ein und aus.'},
      {h:'Private Matrix-Lounge',sub:'Alternative',p:'Ein gemieteter virtueller Besprechungsraum. Für einen ersten Shadowrun-Abend ist die physische Variante besser: Die Spieler:innen lernen erst die reale Sechste Welt kennen.'}]],
    ['h3','Das Briefing'],
    ['tiles',2,[
      {h:'Auftrag',sub:'so sagt es Johnson',p:'Beschafft während der heutigen Gala einen bestimmten Aktenkoffer aus dem privaten Tresor unterhalb des Penthouses des Meridian Spire. Johnson liefert ein aktuelles Foto von Dr. Venn und die genaue Beschreibung des Koffers.'},
      {h:'Bedingungen',sub:'Vertrag',ul:['Der Koffer wird <b>ungeöffnet</b> übergeben.','Es wird <b>nichts anderes</b> aus dem Tresor entwendet.','Dr. Amara Venn wird <b>nicht verletzt</b>.','Kein Wetwork. Vermeidbare Todesfälle sind ausdrücklich unerwünscht.','Wie die Crew vorgeht, entscheidet sie selbst.']},
      {h:'Bekannte Zugangsfaktoren',sub:'zwei Schlüssel',ol:['Eine physische Vault-Keycard, die sich während der Gala irgendwo im Penthouse befindet.','Der biometrische Augenscan von Dr. Amara Venn.']},
      {h:'Bezahlung',sub:'Empfehlung 6 Nuyen',p:'Ein ernsthafter, professioneller Run. 4 Nuyen für einen kleineren Tutorial-Charakter, 8 nur, wenn schon im Briefing ein außergewöhnlich reicher Auftraggeber durchscheinen soll. Bezahlt wird bei vertragsgemäßer Übergabe; Johnson feilscht danach nicht.'}]],
    ['note','gm','Nicht ankündigen','Johnson nennt „ungeöffnet“ sachlich als eine Bedingung unter mehreren und betont das Wort nicht. Der versteckte Manipulationsschutz wird im Briefing nicht angedeutet. Wer den Koffer später aus eigener Initiative untersucht, kann Hinweise entdecken.'],
    ['h4','Was Johnson nicht sagt'],
    ['ul',['Dass Penthouse, Tresor und Koffer Veyrath selbst gehören.','Dass Veyrath der eigentliche Auftraggeber hinter ihm ist.','Dass der Auftrag ein Test ist.','Dass die Sicherheitskonfiguration absichtlich eine Chance lässt.']],
    ['p','Verdienen sich die Runner diese Informationen durch glaubwürdige Recherche, halte sie nicht künstlich zurück.']]},

  {id:'info',num:'Schritt 3',title:'Gather Information',time:'10–20 Min.',
   lead:'Ein oder zwei gezielte Fragen pro Spieler:in reichen. Die Gruppe braucht nur genug, um Plan und Detail festzulegen.',
   blocks:[
    ['qa',[
      {q:'Wann ist die Sicherheit am schwächsten?',a:'<p>Während des <b>Event Mode</b>. Zwischen Mitternacht und Ende der Gala sind beide Zugangsfaktoren gleichzeitig vor Ort. Danach verschwindet die Keycard wieder aus dem Gebäude, und der Tresor geht in strengeren Lockdown.</p>'},
      {q:'Wo befindet sich die Keycard?',a:'<p>Im Servicebereich gibt es ein kleines, nicht öffentliches <b>Eventbüro</b>, in dem während der Gala sensible Veranstaltungsausrüstung verwahrt wird.</p><p><b>Bei besonders gutem Ergebnis:</b> Die Karte liegt dort in einer schwarzen Schlüsselkassette; Entnahme und Rückgabe werden protokolliert.</p>'},
      {q:'Wie komme ich an Dr. Venn heran?',a:'<p>Venn hält sich meist in der Nähe der ausgestellten Stücke auf und erklärt ernsthaft interessierten Gästen bereitwillig Details. Sie zieht sich gelegentlich in einen ruhigeren <b>Wintergarten</b> zurück, um dem Smalltalk zu entkommen.</p>'},
      {q:'Welche Ausrüstung fällt auf?',a:'<p>Gäste dürfen leichte persönliche Ausrüstung tragen. Große Waffen, schwere Rüstung und offensichtliche Operationsausrüstung sind im Glasaufzug kaum plausibel und werden am Empfang zum Problem. <b>Servicepersonal</b> kann wesentlich sperrigere Kisten und Werkzeuge mitführen.</p>'},
      {q:'Gibt es einen alternativen Zugang?',a:'<p>An der Außenfassade läuft ein automatisiertes Wartungssystem mit einer kleinen Reinigungs- und Inspektionsgondel. Sie kann nahe dem Penthouse an einer technischen Schleuse andocken.</p>'},
      {q:'Was erwartet uns unter dem Penthouse?',a:'<p>Das Tresorgeschoss ist normalerweise unbemannt. Es arbeitet mit Sensoren, Schleusen und autonomen Sicherheitsdrohnen.</p>'},
      {q:'Was ist das für ein Gebäude?',a:'<p>Die Eigentumsstruktur endet hinter mehreren undurchsichtigen Holdings. Vesperline Collections ist nur die sichtbare Verwaltung.</p><p><b>Bei außergewöhnlicher Recherche:</b> Hinter der Struktur steht der Drache <b>Veyrath</b>, und das Penthouse samt Tresor gehört ihm. Die spätere Enthüllung funktioniert trotzdem: Sie wird vom Twist zur Bestätigung, dass ein Drache die Crew beim Einbruch in sein eigenes Eigentum prüft.</p>'}]],
    ['note','','Pacing-Hebel','Wenn die Gruppe zu lange diskutiert, frage nur: Welchen Plan? Welches Detail? Welches Load? Dann Engagement Roll und Schnitt.']]},

  {id:'plan',num:'Schritt 4',title:'Plan, Engagement und Zugang',time:'Übergang',
   lead:'Sobald Plan und Detail stehen, folgt der Engagement Roll und der Schnitt zur ersten ernsthaften Situation. Diese Zugänge sind Angebote, keine Lösungen.',
   blocks:[
    ['table',['Plan','Mögliches Detail'],[['Social','Eine echte Einladung über einen Kontakt'],['Deception','Cateringcrew mit gefälschter Schichtzuweisung'],['Stealth','Wartungsschleuse an der Fassade'],['Transport','Absprung vom Flugzeug auf das Dach'],['Supernatural','Eine konkrete magische Methode der Runner'],['Assault','Technischer Zugangspunkt, den die Crew mit Gewalt nimmt']]],
    ['p','Ein schlechtes Engagement heißt nicht, dass die Planung dumm war. Es heißt nur, dass die erste Situation bereits gefährlich ist.'],
    ['h3','Mögliche Zugänge'],
    ['tiles',2,[
      {h:'Als Gäste über den Glasaufzug',sub:'Social · Deception',pro:['Nach dem Eintritt geringe Aufmerksamkeit','Direkter Kontakt zu Dr. Venn','Ideal für Beobachtung und Täuschung'],con:['Einladung und Identität müssen plausibel sein','Sperrige Ausrüstung fällt auf','Der Aufzug protokolliert Ankünfte'],fb:'Einladung kopiert, Name auf die Gästeliste gebracht, Waffe vorher im Penthouse deponiert.'},
      {h:'Als Personal über Tiefgarage und Frachtaufzug',sub:'Deception · Stealth',pro:['Werkzeug, Kisten und Ausrüstung sind plausibel','Direkter Zugang zum Servicebereich und zur Keycard'],con:['Personal wird nach Funktion und Einsatzort getrennt','Unbekannte Namen fallen in Dienstplänen auf','Wer im falschen Bereich steht, wirkt schnell verdächtig'],fb:'Gefälschte Arbeits-ID, manipulierte Schichtliste, echte Uniform, Lieferauftrag.'},
      {h:'Sprung auf das Dach',sub:'Transport · Assault',pro:['Kaum soziale Voraussetzungen','Viel Ausrüstung möglich','Spektakulär für körperliche Runner'],con:['Wetter, Wind, Höhe','Sichtbare Annäherung; das Glasdach ist von unten einsehbar','Falscher Absetzpunkt, Ausrüstungsverlust oder Harm als Consequence'],fb:'Ein Absturz durch das Glasdach ist eine mögliche Consequence, nicht das automatische Ergebnis.'},
      {h:'Fassadenwartung',sub:'Stealth · Rigger · Hacker',pro:['Umgeht den Haupteingang','Werkzeug und Kletterausrüstung wirken plausibel','Dockt an einer technischen Schleuse knapp unter dem Penthouse an'],con:['Die Gondel ist Gebäudetechnik und wird protokolliert','Gäste oder Kameras können sie sehen','Ein falscher Fahrbefehl stoppt oder verriegelt sie'],fb:'Gondelroute vorab manipuliert, Wartungsauftrag eingespielt, Techniker-Zugang gekauft.'}]],
    ['note','gold','Kreative Idee der Spieler:innen','Wenn der Plan mit der etablierten Fiktion vereinbar ist, spiele ihn aus. Gechartertes Skycab, inszenierter medizinischer Notfall, Kunsttransport, übernommener Lieferdrohnenschwarm, ungewöhnliche Magie: Gute Ideen dürfen geplante Bereiche vollständig umgehen.']]},

  {id:'party',num:'Schritt 5',title:'Die Party im Penthouse',time:'45–70 Min.',
   lead:'Die Gala ist in vollem Gange. Hier lösen die Runner zwei Probleme, in beliebiger Reihenfolge: den Augenscan von Dr. Venn und die Vault-Keycard aus dem Eventbüro.',
   blocks:[
    ['h3','Atmosphäre'],
    ['p','Glas, dunkles Holz, lebende Pflanzen, AR-Skulpturen und echte Kunst konkurrieren um Aufmerksamkeit. Aus dem offenen Atrium sieht man zwischen den Wolken die Lichter Seattles. Dezente Musik liegt über Gesprächen von Konzernleuten, Sammler:innen, Künstler:innen und Personen, deren Tätigkeit niemand offen benennt. Servicedrohnen tragen Getränke. Sicherheitskräfte beobachten eher, als dass sie einschüchtern. Alles soll teuer, kontrolliert und mühelos wirken.'],
    ['h3','Bereiche'],
    ['tiles',3,[
      {h:'Großer Salon',sub:'Ebene 111',p:'Gesellschaftlicher Mittelpunkt. Viele Gäste, gute Deckung in der Menge, aber auch viele Augen.'},
      {h:'Ausstellungsgalerie',sub:'Venns Revier',p:'Hier hält sich Dr. Venn am häufigsten auf. Objekte werden in AR mit Herkunft und Wert kommentiert. Dahinter liegt der Sammlerlift.'},
      {h:'Wintergarten',sub:'ruhig',p:'Etwas abseits. Gute Gelegenheit für private Gespräche oder eine unauffällige biometrische Aufnahme.'},
      {h:'Servicebereich',sub:'Küche · Lager · Eventbüro',p:'Personalflur, Materiallager und das Eventbüro mit der Keycard in der schwarzen Kassette. Gäste fallen hier auf.'},
      {h:'Private Arbeitszimmer',sub:'Ebene 112',p:'Nicht Teil der Veranstaltung. Hinter einer bündigen Holzverkleidung liegt der Privatlift zum Tresorgeschoss.'},
      {h:'Glasdach und Dachzugang',sub:'exponiert',p:'Von unten sichtbar. Spektakulärer, aber sehr auffälliger Zugang.'}]],
    ['h3','Dr. Venn und der Augenscan'],
    ['p','Die Runner entscheiden selbst, wie sie an den biometrischen Faktor kommen. Wichtig: <b>Venn besitzt die Keycard nicht.</b> Selbst wenn die Crew sie vollständig auf ihre Seite zieht, bleibt das Problem der Karte bestehen. Erst beschreibt die Spielerin die Handlung, daraus ergibt sich die Action; „hier muss Interface gewürfelt werden“ gibt es nicht.'],
    ['ul',['Hochauflösende Aufnahme des linken Auges und Vorbereitung eines Retinaduplikats.','Venn dazu bringen, freiwillig in einen Scanner oder ein optisches Gerät zu blicken.','Eine private Besichtigung der Sammlung arrangieren.','Venn unter einem Vorwand zur Zugangsschleuse locken.','Betäuben oder entführen: kein automatischer Fehlschlag, nur deutlich auffälliger und riskanter.','Magie, soweit die konkrete Figur dazu in der Lage ist.']],
    ['tiles',2,[
      {h:'Private Besichtigung',sub:'sozialer Königsweg',p:'Venn darf ausgewählte Gäste anmelden und bis in den Vorbereich begleiten. Sie legitimiert den biometrischen Teil, kann den Tresor aber nicht allein öffnen: Vier-Augen-Prinzip mit separat verwahrter Keycard.',ul:['Aufklärungsdrohnen zählen und identifizieren die angemeldeten Personen','Sensoren prüfen auf nicht angemeldete Ausrüstung','Drohnen achten darauf, dass niemand die Gruppe verlässt','Abweichungen lösen erneute Authentifizierung oder stillen Alarm aus'],fb:'Der Vorteil ist nicht „keine Sicherheit“, sondern eine bessere Ausgangslage: Handlungen gegenüber den Drohnen können <b>Controlled</b> statt Risky oder Desperate sein.'},
      {h:'Unter einem Vorwand zur Schleuse',sub:'Täuschung',p:'Venn bestätigt nur ihren Faktor, ohne an eine Besichtigung zu glauben: angeblicher Klimafehler an einem empfindlichen Objekt, automatische Sicherheitsmeldung, fehlerhafter Zugriffsversuch eines Mitarbeiters, Störung im Sammlungsbereich.',ul:['Venn geht bis zum Authentifizierungspunkt und scannt','Die Tür bleibt zu, bis die Keycard eingesetzt wird','Venn steht womöglich direkt daneben, während der zweite Faktor kommen muss','Zu langes Warten oder widersprüchliche Angaben machen Drohnen misstrauisch'],fb:'Ein sozialer Erfolg überspringt das Tresorgeschoss nicht. Er verändert nur, wie die Sicherheit die Runner zunächst einordnet.'}]],
    ['q','BIOMETRISCHER FAKTOR: BESTÄTIGT · PHYSISCHER FAKTOR: AUSSTEHEND','sys'],
    ['h3','Die Vault-Keycard und Dorian Kade'],
    ['note','gm','Zwei Kades zur Wahl','Unter „Wichtige Personen“ stehen zwei Varianten: ein Mensch mit verchromten Cyberarmen und ein Troll, der sich trotz Hörnern und Hauern mühelos in die Gala einfügt. Keycard-Wissen, Aufgaben und Reaktionen auf Alert sind in beiden Fällen gleich.'],
    ['p','Die Karte ist dunkelgrau, unbeschriftet und zeigt nur bei direkter Betrachtung ein schwach irisierendes Hologramm. Sie liegt im Eventbüro in einer schwarzen Schlüsselkassette; Entnahme und Rückgabe werden protokolliert. Die Sicherheitsarchitektur trennt bewusst Biometrie und physische Berechtigung.'],
    ['p','Kade trägt die Karte nicht selbst, weiß aber genau, wo sie liegt und wie eine legitime Entnahme funktioniert: Er oder ein von ihm bestimmter Mitarbeiter autorisiert die Ausgabe, danach wird sie wieder eingecheckt. Mögliche Ansätze: Kassette umgehen, Karte kopieren, einen legitimen Zugriff abpassen, Kade täuschen, eine Berechtigung vortäuschen oder etwas ganz anderes.'],
    ['note','gm','Optionale Komplikation','Für sehr sozial starke Gruppen: Eine zweite orkische Frau mit rasierter Frisur und silbernen Haueraufsätzen steht auf der Gästeliste und kann aus der Entfernung mit Venn verwechselt werden. Für einen Einsteiger-Oneshot besser weglassen.'],
    ['h3','Consequences auf der Party'],
    ['ul',['Eine Sicherheitskraft bittet höflich um Identifikation.','Ein Gast glaubt, einen Runner zu kennen.','Dr. Venn wird misstrauisch.','Die Keycard wird vorübergehend aus dem Eventbüro entfernt.','Eine sperrige Ausrüstungskiste soll überprüft werden.','Alert +1 oder +2.']],
    ['note','','Wenn die Party zu lange dauert','Dr. Venn kündigt ihren baldigen Aufbruch an (etwa in zwanzig Minuten). Ein Kunstwerk soll zurück in den Tresor. Das Personal beginnt mit dem Abbau. Nimm den Punkt, der logisch aus dem Verlauf folgt.']]},

  {id:'ebene110',num:'Schritt 6',title:'Das Tresorgeschoss · Ebene 110',time:'45–70 Min.',
   lead:'Kein lebendes Personal, dafür Sensoren, Schleusen und Drohnen. Spiele die Ebene nicht als Dungeon mit zehn Räumen: vier Kernbereiche reichen, die magische Hülle liegt als zusätzliche Schicht darüber.',
   blocks:[
    ['p','Zwei reguläre Liftzugänge führen hinunter: der <b>Sammlerlift</b> hinter den Ausstellungsräumen und der <b>Privatlift</b> in Veyraths Arbeitszimmer. Beide münden in dieselbe Abfolge. Ein enger <b>Wartungsschacht</b> aus dem Servicekern bietet zusätzlich einen irregulären Zugang.'],
    ['chips',['Lift','Zugangsschleuse','Sensorkorridor','Tresortür','Sammlung']],
    ['tiles',2,[
      {h:'Zugangsschleuse',sub:'17.1',p:'Beide Lifte enden in derselben mattschwarzen Schleuse. Eine erste Sensorschicht registriert Bewegung, Gewicht und nicht autorisierte Geräte. Venns Anwesenheit oder eine gültige Anmeldung entscheidet nur, ob die Gruppe zunächst als erwartete Besucher oder als Eindringlinge gilt.',ul:['Gemeldete Personenzahl stimmt nicht','Auffällige oder nicht angemeldete Ausrüstung','Jemand trennt sich von der Gruppe','Stiller Alarm, Tür verriegelt hinter der Crew, Kameras fokussieren, zusätzliche Identitätsprüfung']},
      {h:'Sensorkorridor',sub:'17.2',p:'Lang, überraschend leer, fast museal. Kameras, Bewegungsmelder, unsichtbare Lichtschranken, Drucksensoren, lokale RFID- und Gerätescans. Nicht alles muss gleichzeitig relevant werden; beschreibe zuerst nur, was die Runner wahrnehmen.',ul:['Ein Sensor registriert eine Abweichung','Eine Tür hinter der Crew schließt','Eine Drohne wird aktiviert','Ausrüstung wird als Fremdgerät markiert','Alert steigt']},
      {h:'Drohnenknoten',sub:'17.3',p:'Eine Servicenische mit den lokalen Drohnen und ihren Wartungsanschlüssen. <b>Aufklärungsdrohnen</b>: klein, schnell, beobachten und markieren. <b>Wächterdrohnen</b>: größer, bewaffnet, isolieren und halten nieder; nichttödliche Optionen, bei massiver Eskalation tödlich.',ul:['<b>Routine:</b> Standardpatrouille, prüfen Unregelmäßigkeiten','<b>Autorisierte Besichtigung:</b> begleiten, zählen, vergleichen; bessere Position, aber beobachtet','<b>Unregelmäßigkeit:</b> stellen sich zwischen Verdächtige und Tresor, fordern Authentifizierung, trennen Personen; erst bei weiterer Eskalation Waffen'],fb:'Drohnen würfeln nicht. Ihr Verhalten läuft über die Action Rolls der Runner und deren Consequences. Besiegen: Interface, Sabotage, Umleiten, Einsperren, präzise Schüsse auf Sensoren, Nahkampf, Täuschung der Zielerkennung, Ablenkung, Magie oder schlicht schneller sein.'},
      {h:'Die Tresortür',sub:'17.4',p:'Zwei getrennte Prüfungen: Keycard lesen, innerhalb kurzer Zeit Augenscan bestätigen. Die Reihenfolge ist egal; der erste Faktor öffnet ein kurzes Fenster für den zweiten. Jeder Versuch wird protokolliert, ein sauberer Doppelzugang öffnet ohne Alarm.',ul:['Venn besitzt die Keycard nicht; ihre Anwesenheit ersetzt den physischen Faktor nicht','Ohne einen oder beide Faktoren bleibt der Zugang möglich: Manipulation, schweres Werkzeug, Sprengstoff, Magie, Flashback','Dann wird es lauter, riskanter oder zeitaufwendiger, nicht unmöglich']}]],
    ['h3','Magische Hülle der Vault'],
    ['p','Die Wände der eigentlichen Vault sind von kultiviertem lebendem Gewebe durchzogen: dunkle Faserstränge wie Wurzeln oder Muskelgewebe zwischen den Schichten. Es trägt eine <b>duale Manabarriere</b>, die physisch und astral abschirmt. Das Gewebe reagiert auf Bohrungen und Erschütterungen, kleine Verletzungen schließen sich, bei Alarm verdichten sich die Fasern. Beschädigungen sind sichtbar: Fasern zucken, dunkle Flüssigkeit tritt aus. Außerhalb der Barriere kann optional ein <b>astraler Watcher</b> patrouillieren, der nur meldet und kein Pflichtgegner ist.'],
    ['note','','Chancen für Mage und Adept','<ul><li><b>Assense</b> zeigt Manabarriere, Watcher, magische Spuren und auffällige Objekte in der Sammlung.</li><li>Ein Mage kann untersuchen, wie die Barriere am regulären Durchgang kontrolliert geöffnet wird, und daraus einen eigenen Ansatz gewinnen.</li><li>Ein Adept bemerkt subtile Umweltveränderungen, Gefahr, Stressreaktionen oder Sensorik früher; mit Assense oder Astral Warrior geht er astrale Probleme direkt an.</li><li>Magische Antiquitäten lassen sich von mundanen Stücken unterscheiden.</li></ul>'],
    ['h3','Consequences im Tresorgeschoss'],
    ['ul',['Eine Drohne erhält Sichtkontakt.','Eine Schleuse verriegelt.','Eine Waffe oder ein Werkzeug wird beschädigt oder verloren.','Sicherungsschaum füllt einen Abschnitt und erschwert Bewegung und Sicht.','Der direkte Rückweg wird blockiert.','Die biometrische Kopie funktioniert nur eingeschränkt; ein zusätzlicher Schritt bleibt nötig.','Alert steigt deutlich.']],
    ['note','','Wenn die Ebene zu lange dauert','Reduziere sie auf drei Beats: ein Sensorproblem, eine Drohnenkonfrontation, die Vault-Tür. Alles andere wird Beschreibung oder Consequence.']]},

  {id:'tresor',num:'Schritt 7',title:'Der Tresor und der Koffer',time:'Höhepunkt',
   lead:'Kein Bankraum voller Schließfächer, sondern der moderne Hort eines Drachen. Der Koffer liegt unscheinbar zwischen Dingen, die offensichtlich mehr wert sind. Hier fällt die Entscheidung, die Veyrath wirklich interessiert.',
   blocks:[
    ['h3','Veyraths moderner Drachenhort'],
    ['p','Die Beleuchtung geht langsam an: Gemälde aus verschiedenen Jahrhunderten, Skulpturen und archäologische Objekte, alte und moderne Nahkampfwaffen, hochwertige Schusswaffen, Schmuck und historische Edelsteine, seltene gedruckte Bücher, versiegelte Datenarchive, einzelne Stücke moderner Cyber- und Biotechnologie, mehrere magische Antiquitäten und Dinge, deren Wert ohne Spezialwissen kaum einzuschätzen ist. Alles ist kuratiert; nichts liegt zufällig herum. Der schwarze Aktenkoffer liegt auf einem niedrigen Sockel zwischen erheblich auffälligeren Objekten.'],
    ['note','gold','Versuchung','Mindestens ein Stück ist offensichtlich wertvoller als der Koffer und überraschend leicht mitzunehmen: eine kleine Schatulle mit historischen Edelsteinen, eine verzierte magische Antiquität, ein kompaktes Stück Cybertechnologie. Darum liegt <b>keine zusätzliche Falle</b>. Wollen die Spieler:innen etwas mitnehmen, lass sie. Der Auftrag verbietet es lediglich, und Veyrath wird es später sehr genau bewerten.'],
    ['h3','Der Aktenkoffer'],
    ['tiles',3,[
      {h:'Äußeres',sub:'für alle sichtbar',p:'Etwa 45 cm breit, mattschwarzer Keramikverbund, erstaunlich altmodisch: keine AR-Anzeige, keine Datenbuchse, kein Logo, kein Funksignal. Eine einzige dünne elfenbeinweiße Linie läuft fast als Kreis über Deckel und Unterseite, nur am Griff fingerbreit unterbrochen. Griff aus dunklem Metall mit abgenutztem schwarzem Leder. Über einem Verschluss ein blassblaues, einmaliges Manipulationssiegel.'},
      {h:'Matrix',sub:'offline',p:'Sendet nichts, ist nicht über die Matrix zu orten. Die Sicherungen arbeiten lokal ohne Funkverbindung. In einem Tresor voller vernetzter, glänzender Objekte wirkt diese Stille beinahe provokant schlicht.'},
      {h:'Magisch',sub:'schwache Aura',p:'Eine schwache, alte magische Aura. Nicht gefährlich, löst nichts aus, macht den Koffer für astral wahrnehmende Figuren unter den vielen Gegenständen aber auffällig.'}]],
    ['note','gm','Verborgener Manipulationsschutz','<p>Im Rahmen sitzt ein kleiner, professionell integrierter <b>Sprengsatz</b>. Wird der Koffer ohne Neutralisierung vollständig geöffnet, zerstört die Ladung in erster Linie den Inhalt. Wer ihn dabei vor sich hält, ist in ernsthafter Gefahr, aber es ist <b>keine automatische Todesfalle</b>: Harm, verlorene Ausrüstung, Alarm oder eine andere Consequence sind sinnvoller als ein plötzliches Charakterende.</p><p><b>Entdeckbar</b> bei gezielter Untersuchung: ungewöhnliches Gewicht, zweiter innerer Rahmen, feine Fertigungsspalten am Deckel, separater abgeschirmter Stromkreis, chemische oder technische Spuren. Survey, Study, Engineer oder Interface können passen; nichts ist vorgeschrieben. Neutralisieren ist unter ruhigen Bedingungen kontrolliert, unter Zeitdruck mit aktiven Drohnen deutlich riskanter.</p><p><b>Zweite Sicherung:</b> Ein unauffälliger mechanischer Manipulationsnachweis im Inneren. Selbst nach perfekter Entschärfung und sauberem Schließen kann Veyrath später feststellen, dass geöffnet wurde.</p><p>Wer den Koffer wie befohlen geschlossen lässt, erfährt von alldem nie. Es ist keine Pflichtszene und kein Rätsel.</p>'],
    ['table',['Verhalten','Bewertung'],[['Nicht geöffnet','Auftrag exakt erfüllt.'],['Sicherung erkannt, neutralisiert, trotzdem geöffnet','Technisch beeindruckend, aber klare Anweisung missachtet.'],['Unvorsichtig geöffnet','Sprengsatz detoniert; Inhalt zerstört, Situation eskaliert.']]],
    ['note','gm','Inhalt','Eine handtellergroße, gesprungene Scheibe aus schwarzem Obsidian. Nicht wertlos, ihr tatsächlicher Wert für die Runner aber nicht erkennbar. Warum sie Veyrath wichtig ist, bleibt offen. Er hat bewusst einen Gegenstand gewählt, dessen Verlust real, für ihn aber kaum schmerzhaft wäre; deshalb ist der Sprengsatz keine Attrappe. Der Inhalt ist kein Plotgerät. Der Test ist, ob die Crew die Vorgabe respektiert, obwohl sie mehr herausfinden könnte.']]},

  {id:'flucht',num:'Schritt 8',title:'Die Flucht',time:'20–35 Min. mit Enthüllung',
   lead:'Ausführlich nur, wenn sie interessant ist oder Zeit übrig bleibt. Der Alert-Stand bestimmt, wie viel Widerstand die Crew erlebt.',
   blocks:[
    ['tiles',3,[
      {h:'Glasaufzug',sub:'elegant bei niedrigem Alert',p:'Die Crew fährt zwischen ahnungslosen Gästen nach unten, während die Stadt hinter den Glaswänden vorbeizieht. Bei höherem Alert kann der Aufzug gestoppt, umgeleitet oder überprüft werden.'},
      {h:'Frachtaufzug und Tiefgarage',sub:'pragmatisch',p:'Unten wartet ein vorbereitetes Fahrzeug, ein spontanes wird beschafft, oder es geht zu Fuß in die unteren Ebenen des Komplexes.'},
      {h:'Sprung vom Dach',sub:'spektakulär',p:'Fallschirme oder Gleiteranzüge. Wind, Verfolger und verlorene Ausrüstung sind gute Consequences, ohne jeden Meter auszuspielen.'},
      {h:'Fassadenwartung',sub:'wieder nutzbar',p:'Die Gondel kann erneut verwendet, manuell übersteuert oder als Zwischenstation für den Abstieg dienen.'},
      {h:'Skycab-Extraktion',sub:'Kontakte · Technik',p:'Ein autonomes Skycab oder kleines Luftfahrzeug erscheint an einer zulässigen oder improvisierten Außenposition: echte Buchung, falsche VIP-Anweisung, Übernahme, Rigger oder Flashback.'},
      {h:'Kreative Idee',sub:'immer erlaubt',p:'Findet die Gruppe einen plausiblen besseren Weg, lass ihn funktionieren.'}]],
    ['h3','Consequences bei der Flucht'],
    ['ul',['Der bevorzugte Ausgang ist gesperrt.','Ein Aufzug hält auf einer falschen Etage.','Ausrüstung muss zurückgelassen werden.','Eine Drohne hängt sich an die Crew.','Die Gruppe wird getrennt.','Ein Sprung oder Flugmanöver verursacht Harm oder Verlust von Equipment.']],
    ['note','','Wer kommt bei vollem Alert?','Bewusst nur ein <b>zuständiger externer Polizeidienstleister</b> beziehungsweise ein vertragliches Response-Team. Ob Knight Errant oder Lone Star, legst du fest, wenn du es mit einer Seattle-Quelle abgleichen willst. Bei viel Restzeit startet eine kurze Response Clock; sonst ist die nächste große Consequence die eintreffende Verstärkung.']]},

  {id:'enthuellung',num:'Schritt 9',title:'Die Enthüllung',time:'während der Flucht',
   lead:'Während oder unmittelbar nach der Flucht, nicht als langer Monolog. Kein Endboss, keine neue Konfrontation: ausschließlich die Bewertung des Tests.',
   blocks:[
    ['p','Ein gewaltiger Schatten gleitet über die Fassade. Flügel schlagen im Regen. Für einen Moment fliegt oder klettert ein echter Drache in deutlichem Abstand neben der fliehenden Crew, weit größer als alles, womit sie gerechnet hat. Er versperrt ihnen nicht den Weg und macht keine Anstalten anzugreifen. Dann hören die Runner seine Stimme direkt in ihren Gedanken:'],
    ['q','„Nennt mich Veyrath. Der Turm ist mein. Der Tresor ist mein. Und der Koffer, den ihr gerade gestohlen habt, ebenfalls.“'],
    ['p','Damit ist klar: Sie haben keinen Rivalen bestohlen. Veyrath selbst hat sie in seinen eigenen Tresor geschickt. Je nach Verlauf ergänzt er:'],
    ['tiles',2,[
      {h:'Sauberer Run',p:'„Ihr nehmt, was euch gegeben wurde, und lasst liegen, was euch nicht gehört. Selten. Ihr seid also tatsächlich zu etwas zu gebrauchen.“'},
      {h:'Erfolgreich, aber chaotisch',p:'„Nicht elegant. Nicht leise. Aber ihr seid noch am Leben und der Koffer ist bei euch. Das genügt fürs Erste.“'},
      {h:'Viel Gewalt',p:'„Gewalt ist ein Werkzeug. Wer für jedes Problem dasselbe Werkzeug benutzt, ist kein Handwerker.“'},
      {h:'Zusätzliche Beute',p:'„Ich bat euch um einen Gegenstand. Ihr habt entschieden, dass mein Eigentum eure Bezahlung erhöhen sollte. Das merke ich mir.“'},
      {h:'Geöffneter Koffer',p:'„Neugier ist wertvoll. Disziplin ebenfalls. Heute habt ihr mir gezeigt, welche von beiden bei euch gewinnt.“'},
      {h:'Sprengsatz sauber neutralisiert',p:'„Den Sicherungsmechanismus zu erkennen war gute Arbeit. Ihn überwinden zu müssen, war eure eigene Entscheidung.“'}]],
    ['note','warn','Kein Kampf','Veyrath bleibt außer Reichweite, bedroht die Crew nicht und blockiert ihre Flucht nicht. Schießen die Runner auf ihn, beendet er den Kontakt und zieht sich zurück, statt aus dem Epilog einen Kampf gegen einen erwachsenen Drachen zu machen.']]},

  {id:'payoff',num:'Schritt 10',title:'Payoff und Bewertung',time:'Abschluss',
   lead:'Die Grundbezahlung beträgt 6 Nuyen. Veyrath koppelt die Auszahlung an die Professionalität der Crew. Der Rechner links übernimmt die Regel.',
   blocks:[
    ['table',['Alert am Ende','Auszahlung'],[['Low Alert (0–1)','6 Nuyen'],['Medium Alert (2–5)','5 Nuyen'],['High Alert / Lockdown (6)','3 Nuyen']],[1]],
    ['p','Verletzte oder tote Gäste und Angestellte zählen für die Auszahlung <b>mindestens wie High Alert</b>. Dr. Venn schwer zu verletzen oder zu töten ist zusätzlich klarer Vertragsbruch. Schäden an der Sammlung wiegen für Veyrath noch schwerer als Personenschäden: Beschädigte oder zusätzlich gestohlene Stücke ziehen deutlichen Unmut nach sich und können die Auszahlung weiter reduzieren.'],
    ['tiles',3,[
      {h:'Ideale Kandidaten',sub:'Folgeaufträge',ul:['Koffer ungeöffnet','Keine zusätzliche Beute, Sammlung unbeschädigt','Venn unverletzt','Wenig unnötige Gewalt','Probleme kreativ und als Team gelöst']},
      {h:'Brauchbar, aber riskant',sub:'vielleicht',ul:['Auftrag erfüllt','Medium oder High Alert','Vermeidbare Aufmerksamkeit','Unnötige, aber nicht katastrophale Eskalation']},
      {h:'Nicht geeignet',sub:'kein Kontakt mehr',ul:['Koffer absichtlich geöffnet, auch fachgerecht','Inhalt durch unvorsichtiges Öffnen zerstört','Venn schwer verletzt oder getötet','Sammlung beschädigt oder zusätzliche Beute','Wahllose Tötungen trotz klarer Anweisung']}]],
    ['p','Das heißt nicht, dass die Charaktere „falsch gespielt“ wurden. Es ist die Reaktion dieses Auftraggebers auf ihre Entscheidungen. Gib der Crew beim Payoff Gelegenheit, auf die Enthüllung zu reagieren.'],
    ['h3','Optional: Heat nach RitS'],
    ['p','Für einen reinen Oneshot entfällt dieser Schritt. Soll die Crew weitergespielt werden, wird Heat nach den normalen Regeln bestimmt, nicht von der Alert Clock übernommen: 0 Heat smooth & quiet, 2 contained, 4 loud & chaotic, 6 wild, plus situative Modifikatoren für hochprofilige Ziele oder Tötungen. <b>Alert</b> ist, was die Sicherheit jetzt weiß und tut. <b>Heat</b> ist die langfristige Aufmerksamkeit danach.']]},

  {id:'werkzeuge',num:'Werkzeuge',title:'Alert, Consequences und Pacing',time:'den ganzen Run über',long:true,
   lead:'Die Alert Clock ersetzt Heat während des Runs. Sie steigt, wenn eine Handlung plausibel Aufmerksamkeit erzeugt, und kann sinken, wenn die Fiktion es zulässt.',
   blocks:[
    ['h3','Alert Clock · 6 Segmente'],
    ['stages',[{range:'0–1',name:'Routine',col:'var(--alert0)',items:['Auffälligkeiten gelten als normale Event-Abweichung','Drohnen patrouillieren nach Standardmustern','Keine Suche nach den Runnern']},{range:'2–3',name:'Verdacht',col:'var(--alert1)',items:['Kameras vergleichen Bewegungen und Identitäten gezielter','Einzelne Türen verlangen erneut Berechtigung','Drohnen beobachten auffällige Bereiche','Personal wird diskret befragt']},{range:'4–5',name:'Aktiver Alarm',col:'var(--alert2)',items:['Drohnen suchen gezielt','Servicewege teilweise gesperrt','Aufzüge angehalten oder umgeleitet','Gäste werden aus gefährdeten Bereichen ferngehalten','Erfasste Runner werden verfolgt']},{range:'6',name:'Lockdown',col:'var(--alert3)',items:['Alarm gilt als bestätigt','Fluchtwege verriegelt oder kontrolliert','Externer Sicherheits- oder Polizeidienstleister verständigt','Handlungsspielraum bleibt, aber eindeutig Eskalation']}]],
    ['p','Verdacht bedeutet <b>keinen automatischen Würfelmalus</b>. Die veränderte Fiktion beeinflusst Position und Effect kommender Actions. Wirkt eine Handlung direkt auf die Clock, passt Limited / Standard / Great Effect zu 1 / 2 / 3 Segmenten.'],
    ['tiles',2,[
      {h:'Wann steigt Alert?',sub:'passende Consequence, wenn …',ul:['eine Kamera etwas sieht','ein Sensor ausgelöst wird','eine falsche Identität überprüft wird','eine Drohne eine Warnung sendet','ein Gast Alarm schlägt','eine Tür gewaltsam geöffnet wird','Schüsse oder Explosionen hörbar sind','ein Matrixeingriff einen verwertbaren Hinweis hinterlässt'],fb:'Nicht jede misslungene Probe erhöht Alert. Ebenso möglich: Harm, verlorene Ausrüstung, schlechtere Position, weniger Effect, versperrter Ausgang, misstrauische Venn, Keycard an anderem Ort, Drohne erscheint, Gruppe getrennt.'},
      {h:'Kann Alert sinken?',sub:'tug-of-war Clock',ul:['Ein Runner erklärt einer Sicherheitskraft glaubwürdig, warum die Abweichung harmlos war','Eine Kamerasequenz wird durch ältere Aufnahmen ersetzt','Ein ausgelöster Sensor wird als Defekt getarnt','Eine Drohne wird abgefangen, bevor sie meldet','Ein manipuliertes Türprotokoll sieht nach Wartung aus','Ein Partyzwischenfall erklärt Lärm oder Bewegung'],fb:'Niemand sagt „ich würfle, um Alert zu senken“. Erst muss klar sein, was die Figur in der Welt tut. Bei Erfolg sinkt Alert gemäß Effect oder ein drohender Anstieg wird verhindert.'}]],
    ['note','','Kein Hacker nötig','Ein Hacker hat viele Gelegenheiten, Alert zu verhindern, aber kein exklusives Recht darauf. Sozial: Verdacht umlenken, Personal beschäftigen. Täuschung: Identität oder Arbeitsanweisung. Physisch: Sensor oder Drohne ausschalten, bevor gesendet wird. Präzision: Optiken und Waffenmodule zerstören. Technik: Leitungen, Türen, lokale Steuerungen. Magie: Wahrnehmung oder Bewegung. Mobilität: den Bereich verlassen, bevor die Suche sich schließt. Wiederholte Hacks werden nicht automatisch schwerer, sondern dann, wenn die Fiktion einen Grund liefert: Gegenmaßnahme läuft, Trace begonnen, System isoliert.'],
    ['h3','Szenariospezifische Dragon’s Deals'],
    ['deals',['Die Einladung ist echt. Aber jemand auf der Party erkennt deinen Alias.','Du bekommst den perfekten biometrischen Scan. Dr. Venn wird sich später sehr genau an dein Gesicht erinnern.','Die Drohne geht sofort offline. Ihr letzter Datenburst wurde allerdings bereits gesendet.','Die Wartungsgondel bringt euch exakt ans Ziel. Danach verriegelt sie sich außen und steht für die Flucht nicht mehr zur Verfügung.','Du erreichst den Koffer ohne weiteren Widerstand. Dafür schließt sich die Tresortür hinter euch.']],

    ['p','Der Run ist kein Charakterquiz. Niemand bekommt einen Raum „nur für seine Klasse“. Die Actions auf dem Bogen sind wichtiger als das Etikett.'],
