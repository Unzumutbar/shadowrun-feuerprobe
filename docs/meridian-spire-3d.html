  --bg:#0D1218; --surface:#151B23; --surface-2:#1B222C; --ink:#E7EBF0; --ink-2:#C4CCD6; --muted:#8E9AA9; --line:#293441; --line-2:#3B4756;
  --wall:#D8DFE8; --cut:#151B23;
  --floor-public:#1E2630; --floor-service:#2B2620; --floor-secure:#1C2636; --floor-private:#28202F; --floor-outdoor:#162622; --floor-tech:#20262D; --floor-core:#2E3641; --floor-void:#111720; --floor-vault:#07090C; --floor-drive:#20262C; --floor-roof:#1B2129; --floor-glass:#143142; --floor-ramp:#262D36;
  --glass:#5CC0EA; --accent:#3FC1CC; --accent-ink:#8FE3EA; --accent-soft:rgba(63,193,204,.16);
  --sec:#FF6D5F; --guard:#78A6F2; --venn:#E9BC3F; --kade:#E5717F; --drone:#FFAB45; --astral:#B892F2; --plant:#74C283; --hidden:#CD85FF; --gmnote:#CD85FF;
  --r-public:#5AD08A; --r-staff:#FFB347; --r-tech:#3FC1CC; --r-out:#78A8FF; --r-private:#C6A1FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --hatch:rgba(231,235,240,.55);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1480px;margin:0 auto;padding-block:20px 48px;padding-inline:16px}
h1,h2,h3,.disp{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-wrap:balance;margin:0}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-block:4px 18px;border-bottom:1px solid var(--line)}
header.top h1{font-size:clamp(34px,5vw,50px);line-height:.95;font-weight:700;letter-spacing:.01em}
header.top h1 small{display:block;font-size:.42em;font-weight:500;color:var(--ink-2);letter-spacing:.04em;margin-top:6px}
.controls{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
@media (min-width:900px){.controls{align-items:flex-end}}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:600 15px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:9px 13px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.seg button small{font:11px/1 "IBM Plex Mono",monospace;letter-spacing:0;text-transform:none;color:var(--muted)}
.seg button:hover{background:var(--surface)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.seg button[aria-selected="true"] small{color:var(--surface);opacity:.75}
.seg button:focus-visible,.tog button:focus-visible,.spots li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tog{display:flex;flex-wrap:wrap;gap:8px}
.tog button{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 13px/1 "IBM Plex Sans",sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tog button .dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);flex:none}
.tog button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tog button[aria-pressed="true"] .dot{background:var(--accent)}
.tog button.gmtog[aria-pressed="true"]{border-color:var(--gmnote);background:rgba(138,63,179,.12)}
.tog button.gmtog[aria-pressed="true"] .dot{background:var(--gmnote)}

main.app{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:20px}
@media (min-width:1100px){main.app{grid-template-columns:minmax(0,1.55fr) minmax(320px,.8fr);align-items:start}}
.mappanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.maphead{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:space-between;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.maphead h2{font-size:28px;font-weight:700;letter-spacing:.01em}
.maphead h2 span{color:var(--muted);font-weight:500;margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
aside.key{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
.card h3{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Mono",monospace;margin-bottom:10px}
.spots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.spots li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 6px;border-radius:8px;border-top:1px solid var(--line);cursor:default}
.spots li:first-child{border-top:0}
.spots li:hover,.spots li.hl{background:var(--accent-soft)}
.spots .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 12px "IBM Plex Sans",sans-serif;background:var(--surface);margin-top:1px}
.spots li.gmonly .n{border-color:var(--gmnote);border-style:dashed}
.spots b{display:block;font-weight:600;font-size:14.5px}
.spots p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.spots .gmn{margin-top:6px;padding:7px 9px;border-left:3px solid var(--gmnote);background:rgba(138,63,179,.07);border-radius:0 6px 6px 0;font-size:13px;color:var(--ink)}
.spots .gmn::before{content:attr(data-l);font:600 10px "IBM Plex Mono",monospace;letter-spacing:.1em;color:var(--gmnote);display:block;margin-bottom:2px}
.chip{font:12px/1 "IBM Plex Mono",monospace;padding:6px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tog .langs{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.tog .langs button{border:0;border-radius:0;padding:8px 13px;font-weight:600;letter-spacing:.04em}
.tog .langs button+button{border-left:1px solid var(--line-2)}
.tog .langs button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ---------- 3-D ---------- */
.tog .langs .lbl{font:500 13px/1 "IBM Plex Sans",sans-serif;color:var(--muted);padding:8px 4px 8px 12px;display:inline-flex;align-items:center}
.stage{position:relative;height:min(74vh,820px);min-height:420px;background:var(--bg);touch-action:none}
.stage canvas{display:block;width:100%;height:100%;outline:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage .hint{position:absolute;left:12px;bottom:10px;font:11.5px/1.4 "IBM Plex Mono",monospace;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:5px 8px;border-radius:6px;pointer-events:none}
.stage .views{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.stage .views button{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 12.5px/1 "IBM Plex Sans",sans-serif;padding:7px 10px;border-radius:7px;cursor:pointer}
.stage .views button:hover{border-color:var(--accent)}
.stage .views button.walk{border-color:var(--accent);color:var(--accent-ink)}
.stage .views button.walk[aria-pressed="true"]{background:var(--accent);color:#fff}
.stage .pad{position:absolute;right:14px;bottom:62px;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:6px;touch-action:none;user-select:none}
.stage .pad[hidden]{display:none}
.stage .pad button{appearance:none;border:1px solid var(--line-2);background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);border-radius:10px;font-size:16px;cursor:pointer}
.stage .pad button:active{background:var(--accent);color:#fff}
.stage .pad [data-d="f"]{grid-column:2;grid-row:1}.stage .pad [data-d="l"]{grid-column:1;grid-row:2}.stage .pad [data-d="b"]{grid-column:2;grid-row:2}.stage .pad [data-d="r"]{grid-column:3;grid-row:2}
.stage:fullscreen{height:100vh;max-height:none;min-height:0}
.stage.max{position:fixed;inset:0;z-index:1000;height:100dvh;max-height:none;min-height:0}
html.noscroll,html.noscroll body{overflow:hidden}
.stage.walking .views{right:auto;left:10px}
.stage .minimap{position:absolute;top:10px;right:10px;border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);cursor:crosshair;background:var(--surface)}
.stage .minimap[hidden]{display:none}
.stage .portal{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;max-width:calc(100% - 140px);padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.stage .portal[hidden]{display:none}
.stage .portal b{font:600 15px "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;border-left:4px solid var(--c);padding-left:7px}
.stage .portal button{appearance:none;border:1px solid var(--accent);background:var(--surface);color:var(--ink);font:500 13px/1 "IBM Plex Sans",sans-serif;padding:7px 10px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.stage .portal button:hover{background:var(--accent-soft)}
.stage .portal kbd{font:600 11px "IBM Plex Mono",monospace;border:1px solid var(--line-2);border-radius:4px;padding:1px 4px;color:var(--muted)}
.stage .portal small{width:100%;text-align:center;font:11px "IBM Plex Mono",monospace;color:var(--muted)}
.stage .alertfx{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 4px var(--sec),inset 0 0 70px 14px color-mix(in srgb,var(--sec) 55%,transparent);opacity:0;transition:opacity .2s}
.stage .alertfx.on{opacity:1}
.stage .alerthud{position:absolute;left:10px;top:50px;appearance:none;border:1px solid var(--line-2);background:color-mix(in srgb,var(--surface) 90%,transparent);color:var(--ink);font:500 12.5px/1 "IBM Plex Mono",monospace;padding:7px 10px;border-radius:8px;cursor:pointer}
.stage .alerthud b{color:var(--sec);font-size:14px}
.stage .alerthud.hot{border-color:var(--sec);background:var(--sec);color:#fff}.stage .alerthud.hot b{color:#fff}
.stage .alerthud[hidden],.stage .note[hidden]{display:none}
.stage .note{position:absolute;left:10px;top:90px;width:min(360px,calc(100% - 290px));min-width:220px;max-height:calc(100% - 190px);overflow:auto;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:13px}
.stage .note b{display:flex;gap:8px;align-items:center;font-size:14px}
.stage .note b span{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:11px;flex:none}
.stage .note p{margin:6px 0 0;color:var(--ink-2)}
.stage .note p.g{border-left:3px solid var(--gmnote);padding-left:8px;color:var(--ink)}
.stage .note p.g::before{content:attr(data-l);display:block;font:600 10px "IBM Plex Mono",monospace;letter-spacing:.1em;color:var(--gmnote)}
.stage:not(.walking) #vShare{display:none}
@media (max-width:640px){.stage .note{width:calc(100% - 20px);top:auto;bottom:170px;max-height:30%}}
.tog .langs.off{opacity:.45;pointer-events:none}
.stage .err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}
.toprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toprow a.back{font:500 13px/1 "IBM Plex Sans",sans-serif;color:var(--accent-ink);text-decoration:none;border:1px solid var(--line-2);border-radius:999px;padding:8px 12px;background:var(--surface)}
.toprow a.back:hover{border-color:var(--accent)}
.legend3d{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 18px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.legend3d .lg{display:inline-flex;align-items:center;gap:7px}
.legend3d .sw{width:16px;height:12px;border-radius:3px;border:1px solid var(--line-2);flex:none}
.legend3d .sw.round{border-radius:50%;width:12px}
.legend3d .gm{display:none}
body.gm .legend3d .gm{display:inline-flex}
.keyhead{font:600 13px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.spots li{cursor:pointer}
body:not(.gm) .spots .gmn,body:not(.gm) .spots li.gmonly{display:none}
.fine{margin-top:26px;font-size:12px;color:var(--muted);max-width:900px}
</style>
</head>
<body>


<div class="wrap">
<header class="top">
  <div>
    <div class="eyebrow">Shadowrun · Feuerprobe · Runners in the Shadows</div>
    <h1>Meridian Spire<small id="subtitle"></small></h1>

      <a class="back" id="lnk2d" href="meridian-spire-plaene.html"></a>

  </div>
</header>

      <button type="button" class="alerthud" id="alerthud" hidden></button>
      <div class="note" id="note" hidden aria-live="polite"></div>

  </section>
  <aside class="key">

  </aside>
</main>
<p class="fine" id="fine"></p>
</div>

spots:[
 {n:1,t:'Glasaufzug, Foyer & Empfang',p:'Der Glasaufzug fährt außen an der Fassade hoch und öffnet direkt ins Foyer. Zwei Sicherheitsleute prüfen die Gästeliste, die Garderobe nimmt Mäntel und Taschen, ein unauffälliger Bogen steht am Übergang zum Salon.',g:'Der Bogen erkennt Waffen und schwere Cyberware, meldet aber nur still an Kade: Auffällige werden nicht gestoppt, sondern beobachtet (Alert +1, eine Wache bleibt in Sichtweite). Garderobe = perfektes Depot für einen Flashback („die Tasche hängt seit 21 Uhr hier“). Aufzugsprotokoll speichert Ankunftszeit und Gesicht.'},
 {n:2,t:'Großer Salon & Atrium',p:'Das gesellschaftliche Herz: ~50 Gäste, Bar, Bühne, Buffet, Servicedrohnen mit Getränken. Über dem Atrium öffnet sich der Raum bis zum Glasdach, die Freitreppe führt zur VIP-Lounge auf 112.',g:'Menge = Deckung, aber zwei Kameras decken fast alles. Servicedrohnen lassen sich übernehmen (Ablenkung: Tablett fällt; Transport: Keycard oder Kommlink wandert quer durch den Raum). Wer auf dem Glasdach steht, wirft bei Blitzen eine Silhouette über die Party. Zwei Sicherheitsleute, Kade zieht seine Runde Foyer → Salon → Galerie.'},
 {n:3,t:'Terrasse',p:'Offen zum Himmel, Wind und Regen. Im Westen der Landeplatz der Servicedrohnen, im Osten eine überdachte Rauchernische. Türen zur Küche, zum Salon und zum Wintergarten.',g:'Nur eine Kamera, die auf den Landeplatz zeigt; die Rauchernische ist unbeobachtet. Die Servicetür zur Küche steht oft nur angelehnt (Personal raucht). Steigleiter zum Dach: Käfig oben verschlossen, außen herum kletterbar (Prowl, Risky). Die Terrasse ist der Bypass um die Party herum: Küche → Terrasse → Wintergarten → Galerie.'},
 {n:4,t:'Wintergarten',p:'Ruhiger Rückzugsraum mit lebenden Pflanzen und einem eigenen Glasdach. Dr. Venn flieht hierher vor dem Smalltalk.',g:'Keine Kamera („Privatsphäre der Gäste“). Venn ist alle ~40 Minuten für etwa 5 Minuten allein hier: beste Stelle für eine hochauflösende Iris-Aufnahme oder ein ernsthaftes Gespräch über Kunst. Das Glasdach darüber ist der leisere Dacheinstieg (siehe Dach ⑥).'},
 {n:5,t:'Ausstellungsgalerie & Sammlerlift',p:'Acht Stücke auf Sockeln, AR-Einblendungen mit Herkunft und Preis. Dr. Venn erklärt ernsthaft Interessierten gern Details. Hinten der Vorraum zum Sammlerlift: Reader, eine Wache.',g:'Alle ~40 Minuten wird ein Stück zurück nach 110 gebracht: Venn, eine Wache und ein Transportwagen fahren mit dem Sammlerlift (Mitfahrgelegenheit, Kiste, Verkleidung als Logistiker). Dafür holt Kades Freigabe die Keycard aus dem Eventbüro: sie ist dann 10 Minuten unterwegs. Reader verlangt Sicherheitsbadge oder Venns Anmeldung. Zwei Kameras.'},
 {n:6,t:'Bibliothek & Rauchsalon',p:'Leder, Kamin, wenige Gäste, gedämpfte Gespräche. Hier sitzen die ernsthaften Sammler.',g:'Keine Kamera. Die Tür zum Arbeitszimmer hat ein mechanisches Schloss (nicht hackbar, aber Dietrich oder Gewalt). Gäste hier wissen Dinge: wer Venn ist, dass Kade „mit den Chromarmen“ alles sieht, dass um 3 Uhr die Gala endet.'},
 {n:7,t:'Arbeitszimmer (privat)',p:'Verschlossen, Schild „Privat“. Nicht Teil der Veranstaltung.',g:'Vier Zugänge: Galerietür (Reader + Alarmkontakt), Bibliothekstür (mechanisch), Privattreppe aus der Suite auf 112, Privatbalkon (Fassade, von der Sky-Terrasse 112 abseilbar). Bewegungsmelder + Kamera. Hinter der bündigen Holzverkleidung liegt der Privatlift nach 110 (fingerbreite Fuge, warmer Luftzug). Auf dem Tisch ein Papiernotizbuch mit derselben Handschrift wie Mr. Johnsons Notizen.'},
 {n:8,t:'Küche & Kernflur',p:'Cateringbetrieb, Servicedrohnen docken an. Im Kernflur kommen Frachtaufzug und Anlieferung an; eine Wache scannt Lieferscheine und Kisten.',g:'Der Scan prüft Badge und Ladeliste, öffnet aber keine Kisten (Metall/Funk fällt auf, „Bühnentechnik“ erklärt vieles). Drohnenschacht 40×40 cm: Garage ↔ Küche ↔ Dach, Ausrüstung in Portionen liefern lassen. Speiseaufzug 60×60 cm zur Pantry auf 112. Der Küchenchef merkt sich fremde Gesichter, nicht Uniformen.'},
 {n:9,t:'Materiallager / Kunstdepot',p:'Vesperline-Transportkisten, Werkzeug, ein Kunsttransportwagen.',g:'Eine leere Kiste fasst eine Person. Toter Winkel hinter den Kisten. Hinter einem Regal die Revisionstür zum Technikschacht: darin der Wartungsschacht mit Steigleiter hinunter nach 110 (Löschzentrale) und hinauf bis zum Dach. Bewegungssensor erst auf 110.'},
 {n:10,t:'Eventbüro',p:'Kleines Büro, Tür „Nur Eventpersonal“, ein Ausgabefenster zum Personalflur.',g:'Die Keycard liegt in der schwarzen Kassette; Entnahme nur mit Kades Freigabe, alles wird protokolliert. Die Eventmanagerin kommt alle ~15 Minuten vorbei. Kamera innen. Die abgehängte Decke verbindet Umkleide, Personalgang, Lager und Büro (Deckenhohlraum, trägt knapp eine Person). Am Ausgabefenster bekommt, wer Kades Freigabe glaubhaft vorträgt, die Karte über die Theke.'},
 {n:11,t:'Sicherheitsraum',p:'Kades Posten: Monitorwand, Funk, Tür zum Foyer und zum Personalflur.',g:'Kade ist 60 % der Zeit unterwegs. Monitore zeigen alle Kameras dieser Ebene, nicht die von 110 (eigenes System). Wer hier steht, kann Alert senken: Aufnahmen tauschen, Sensor als Defekt markieren. Fenster zum Foyer ist Spiegelglas.'},
 {n:12,t:'Gäste-WC',p:'Vorraum mit Spiegeln, dahinter Kabinen. Im Vorraum eine Tür „Nur Personal“.',g:'Die Personaltür führt in den Personalflur, einfacher Zylinder. Klassischer Rollenwechsel: als Gast hinein, als Personal hinaus (Uniform aus der Umkleide gegenüber). Keine Kamera im WC.'},
],

sits:[
 '<b>Rückführung.</b> Alle ~40 Minuten geht ein Stück zurück nach 110: Venn, eine Wache, ein Transportwagen. Die Keycard verlässt dafür für 10 Minuten die Kassette und wandert Kernflur → Galerie → Vorraum. Beide Faktoren sind kurz am selben Ort.',
 '<b>Stille Prüfung.</b> Der Bogen meldet nur an Kade. Wer auffällt, bekommt keine Szene, sondern einen Schatten. Aufmerksame Runner merken: Dieselbe Wache ist immer in Sichtweite.',
 '<b>Venn allein.</b> Im Wintergarten ohne Kamera, fünf Minuten. Iris-Aufnahme, ehrliches Gespräch, Einladung zur Privatbesichtigung: hier entscheidet sich, ob der biometrische Faktor sozial oder technisch gelöst wird.',
 '<b>Vier Türen ins Arbeitszimmer.</b> Reader (Hacker), Mechanik (Snake/Punk), Treppe von oben (Prowl), Balkon (Rigger/Adept). Jede Gruppe findet ihre.',
 '<b>Rollenwechsel im WC.</b> Als Gast hinein, durch die Personaltür hinaus. Die Umkleide mit Uniformen liegt gegenüber.',
 '<b>Ausgabefenster.</b> Ein Runner in Sicherheitsuniform verlangt die Karte „auf Kades Anweisung für die Rückführung“. Sway oder Command, Risky. Bei 4/5: Die Eventmanagerin ruft Kade an, um sich das bestätigen zu lassen.',
],

spots:[
 {n:1,t:'VIP-Lounge & Umgang',p:'Ein Balkon läuft um das Atrium. Wenige, sehr gut vernetzte Gäste, Lounge-Möbel, die Freitreppe hinunter in den Salon. Vom Geländer sieht man die ganze Party.',g:'Weniger Gäste heißt mehr Aufmerksamkeit pro Person: Wer hier nicht hingehört, fällt in Minuten auf. Eine Sicherheitskraft, zwei Kameras. Das Geländer ist Overwatch für einen Trigger und der schnellste Weg nach unten (Seil ins Atrium, 6 m). Servicedrohnen fliegen durch den Luftraum.'},
 {n:2,t:'Pantry & Speiseaufzug',p:'Kleine Bar-Küche für die Lounge, Nachschub kommt per Speiseaufzug aus der Küche auf 111.',g:'Speiseaufzug 60×60 cm: Gegenstände, Keycard-Übergabe zwischen zwei Runnern auf verschiedenen Ebenen, notfalls ein sehr schlanker Runner (Desperate). Zwei Servicekräfte, die selten hochschauen.'},
 {n:3,t:'Sky-Terrasse & Pool',p:'Außenterrasse mit beheiztem Pool, Glasbalustrade, Wind. Türen zur Lounge, zur Skycab-Lobby und zur Suite.',g:'Keine Kamera außer der an der Lobby-Tür. Die Balustrade ist ein Abseilpunkt zum Privatbalkon 111 (3 m östlich, 5 m tiefer) und Fluchtweg für alles, was fliegt. Die Fassadengondel fährt an der Ostkante vorbei. Die Suite-Tür ist verriegelt, aber Glas.'},
 {n:4,t:'Skycab-Lobby',p:'Ankunft für Gäste, die per Skycab kommen: Empfang, Reader, Treppe zur Landeplattform auf dem Dach.',g:'Eine Sicherheitskraft prüft Skycab-Buchungen gegen die Gästeliste; wer eine Buchung eingetragen hat, gilt als erwartet. Der Reader zur Lounge braucht den Gästebadge. Fluchtweg Nummer eins bei niedrigem Alert: Skycab bestellen, Treppe hoch, weg. Kamera über der Tür.'},
 {n:5,t:'Private Suite',p:'Verschlossen, dunkel, nicht Teil der Gala.',g:'Leer. Bewegungsmelder in drei Ecken, keine Kameras (Veyrath duldet keine in seinen Räumen). Die Privattreppe im Privatsalon führt direkt ins Arbeitszimmer 111: der Weg zum Privatlift, der Galerie und Bibliothek komplett umgeht. Hinweise auf den Besitzer: warmer Boden, überdimensionierte Türen und Möbel, Maßanzüge ohne Etikett in der Ankleide.'},
 {n:6,t:'Wartungsgalerie & Technik',p:'Lüftungsanlage, Kanäle, Personaltreppe, ein Lager mit Möbeln. Laut.',g:'Bodenluke in den Technikschacht: der Wartungsschacht führt hinunter zum Lager 111 und weiter zur Löschzentrale 110, hinauf zum Dach. Die Personaltreppe geht weiter zum Dach (Tür mit Alarmkontakt). Der Abluftlärm überdeckt Werkzeuggeräusche.'},
 {n:7,t:'Technikflur',p:'Personalverbindung zwischen Pantry und Skycab-Lobby.',g:'Keine Kamera. Hier kreuzen sich Servicepersonal und VIP-Empfang: die beste Stelle, Uniform gegen Anzug zu tauschen oder umgekehrt.'},
 {n:8,t:'Glasdach Wintergarten (Luftraum)',p:'Von hier sieht man durch das Glas hinunter in den Wintergarten.',g:'Vom Dach aus: Öffnungsflügel für die Lüftung, mechanisch, ohne Sensor, klemmt (Prowl oder Engineer, Controlled bei Ruhe). Darunter Venns kamerafreier Rückzugsort. 5 m Abseilhöhe in Pflanzen.'},
 {n:9,t:'Luftraum Atrium',p:'Blick 6 m hinab auf die Party, 5 m hinauf zum Glasdach.',g:'Sturzgefahr für Consequences. Seil vom Geländer ist der schnellste Weg nach unten und nach oben (Glasdach-Wartungsflügel). Wer hier hängt, wird gesehen.'},
],

 {id:'B',c:'private',t:'Lounge → Suite → Privattreppe → Arbeitszimmer',d:'Reader an der Suite-Tür, drei Bewegungsmelder, sonst nichts. Landet direkt neben dem Privatlift, ohne Galerie und Bibliothek.',gm:true},

sits:[
 '<b>Wer gehört hierher?</b> In der VIP-Lounge kennt jeder jeden. Ein fremdes Gesicht wird angesprochen, nicht gemeldet: „Und Sie sind mit wem hier?“ Ein Face glänzt, ein Muscle schwitzt.',
 '<b>Skycab-Buchung.</b> Ein Hacker trägt vor dem Run eine Buchung in das Ankunftssystem ein. Dann erwartet die Lobby-Wache Gäste, nicht Eindringlinge. Ohne Buchung: höfliche Rückfrage, Alert +1.',
 '<b>Die Suite riecht nach Drache.</b> Wer hineinkommt, findet nichts Nützliches, aber viele Hinweise: warmer Boden, riesiges Bett, Maßanzüge. Ein Mage spürt eine alte, ruhige Präsenz. Kein Alarm, aber Ahnung.',
 '<b>Von oben nach unten.</b> Vier Wege von 112 nach 111: Freitreppe (öffentlich), Privattreppe (verborgen), Personaltreppe (Personal), Seil ins Atrium (spektakulär).',
 '<b>Pool-Party.</b> Eine Consequence auf der Sky-Terrasse: jemand fällt in den Pool, alle schauen hin. Zwei Minuten, in denen niemand auf die Lounge achtet.',

 {n:1,t:'Skycab-Landeplattform',p:'Beleuchtete Plattform mit Wartehäuschen und Treppe hinunter in die Skycab-Lobby 112. Nachts landen hier autonome Skycabs mit VIP-Gästen.',g:'Der Anflugtransponder erteilt autonomen Skycabs die Landefreigabe: gehackt landet jedes Cab als „angemeldete Ankunft“; ohne Freigabe kreist es 90 Sekunden und meldet sich (Alert +1). Kamera am Häuschen. Landezone B für Fallschirme: eben, aber hell beleuchtet.'},
 {n:2,t:'Dachausstieg Personaltreppe',p:'Der einzige reguläre Weg aufs Dach: Stahltür, Reader.',g:'Alarmkontakt: Öffnen ohne Badge meldet still (Alert +1). Kamera und Bewegungsmelder davor. Die Treppe führt hinunter bis P2: 112 Wartungsgalerie, 111 Kernflur, an 110 vorbei (verriegelte Brandschutztür), EG-Lobby, Garage.'},
 {n:3,t:'Schachtkopf Technikschacht',p:'Unauffällige Luke zwischen den Technikaufbauten.',g:'Darunter der Wartungsschacht (80×80 cm) mit Steigleiter: Ausstiege auf 112 (Bodenluke Wartungsgalerie), 111 (Revisionstür Lager) und 110 (Löschzentrale). Kein Sensor bis 110. Der direkteste Weg vom Dach zur Vault, ohne die Party zu berühren.'},
 {n:4,t:'Drohnenport',p:'Lieferdrohnen landen hier und verschwinden in einem Schacht ins Gebäude.',g:'Drohnenschacht 40×40 cm bis zur Küche 111 und weiter in die Garage. Ein Rigger schickt Ausrüstung portionsweise hinunter oder hinauf. Der ständige Drohnenverkehr überdeckt kleine eigene Fluggeräte. Keine Kamera.'},
 {n:5,t:'Glasdach Atrium',p:'Beleuchtete Glaspyramide über dem Salon. Von unten sieht man jede Silhouette auf dem Glas.',g:'Streben tragen, Scheiben tragen eine Person. Wartungsflügel an der Nordseite mit Kontakt. Wer hier steht, wird bei Blitzen von unten gesehen (Consequence: ein Gast zeigt nach oben). Abseilen: 12 m bis zum Salonboden. Ein Sturz durch das Glas ist eine mögliche Consequence, nie das automatische Ergebnis.'},
 {n:6,t:'Glasdach Wintergarten',p:'Flacheres, dunkles Glasdach über dem Wintergarten.',g:'Lüftungsflügel mechanisch, ohne Sensor, klemmt (Prowl/Engineer). Darunter Venns Rückzugsort ohne Kamera, 5 m Abseilhöhe in weiche Pflanzen. Der leise Dacheinstieg.'},
 {n:7,t:'Fassadenbefahranlage (Gondel)',p:'Wartungskran mit Reinigungsgondel, geparkt an der Ostkante. Fährt auf einer Schiene an der Fassade.',g:'Steuerung manuell am Kasten oder per Interface. Die Gondel fährt an der Ostfassade bis zur Technischen Schleuse 110 (Andockpunkt) und weiter bis zum EG. Fahrten werden protokolliert; Abweichung vom Wartungsplan → stille Prüfung. Dragon’s Deal: „Sie bringt euch exakt ans Ziel und verriegelt sich danach außen.“'},
 {n:8,t:'Steigleiter',p:'Wartungsleiter an der Nordkante, hinunter zur Terrasse 111.',g:'8 m, Käfig oben verschlossen, außen herum kletterbar. Die Terrassenkamera zeigt nur den Drohnen-Landeplatz, nicht die Leiter. Wer hier ankommt, steht direkt neben der angelehnten Küchen-Servicetür.'},
 {n:9,t:'Landezone Ost',p:'',g:'Flaches Dach über der Suite, keine Kamera, Windschatten des Masts. Der beste Absprungpunkt für Fallschirm oder Gleiter. Achtung: Attika nur 1,1 m, Böen. Von hier zu Fuß um die Glaspyramide herum zum Dachausstieg.',gm:true},
 {n:10,t:'Technikaufbauten',p:'Kühltürme, Lüftungsgeräte, Notstrom. Laut, warm, dampfend.',g:'Deckung und Lärm. Notstrom/USV sabotieren löst Notbeleuchtung und Lockdown-Protokoll aus (Alert +2): schlechte Idee als Einstieg, gute Ablenkung bei der Flucht.'},
],

sits:[
 '<b>Anflug ohne Freigabe.</b> Das Skycab kreist, die Gebäudesicherheit fragt nach. Mit gehackter Freigabe erwartet die Lobby-Wache „Gäste“ und hält die Tür auf.',
 '<b>Silhouetten.</b> Blitz über Seattle. Wer auf dem Atrium-Glas steht, wird von unten gesehen: „Ein Gast zeigt nach oben“ ist die Consequence, nicht sofort Alarm.',
 '<b>Böe.</b> Bei 4/5 im Freien: Ausrüstung rutscht Richtung Attika, der Gleiter verfängt sich am Mast, die Gondel schwankt. Harm oder verlorenes Equipment statt Alert.',
 '<b>Die Gondel fährt nur einmal.</b> Dragon’s Deal: exakt ans Ziel, danach verriegelt sie sich außen am Gebäude. Für die Flucht braucht die Crew etwas anderes.',
 '<b>Drei Wege nach unten.</b> Treppe (Alarmkontakt, Kamera), Wartungsschacht (eng, Sensor erst auf 110), Leiter (Terrasse, Küchentür). Die Wahl entscheidet, wo die Crew ankommt und wer sie sieht.',
],
};

spots:[
 {n:1,t:'Zugangsschleuse',p:'Beide Lifte enden in derselben mattschwarzen Schleuse. Sensoren registrieren Bewegung, Gewicht und Geräte. Ein Terminal fragt nach Identität.',g:'Gewichtsplatte zählt Personen und vergleicht mit der Anmeldung. Geräte-Scan markiert Funk und Metall. Kamera mit Gesichtsabgleich erkennt Venn und begrüßt sie namentlich. Abweichung → stiller Alarm, die Schleusentür verriegelt hinter der Crew (Consequence, keine Sackgasse: die Tür lässt sich von innen mit Engineer oder Gewalt öffnen).'},
 {n:2,t:'Sensorkorridor',p:'Ein langer, überraschend leerer Korridor. Museale Beleuchtung, dann ein Knick nach Norden.',g:'Drei Lichtschranken (x-Positionen markiert), Druckplatten vor dem Knick, RFID-Bogen im Knick, drei Kameras. Bei „autorisierter Besichtigung“ bleibt alles scharf, aber die Bewertung ist gnädiger: Position Controlled statt Risky. Schaumdüsen in der Decke füllen den Korridor bei Alarm (Sicht und Bewegung erschwert, auch für Drohnensensoren). Ein Aufklärer schwebt hier auf Patrouille.'},
 {n:3,t:'Authentifizierungspunkt & Tresortür',p:'Konsole mit Kartenleser und Irisscanner vor einer massiven Tür.',g:'Reihenfolge egal, 90-Sekunden-Fenster. Bei nur einem Faktor: „BIOMETRISCHER FAKTOR: BESTÄTIGT · PHYSISCHER FAKTOR: AUSSTEHEND“. Jeder Versuch wird protokolliert. Ohne Faktoren: 40 cm Verbund, Gewebe und Barriere, also laut, lang oder magisch anspruchsvoll, nie unmöglich. Die Kuratorenvorbereitung nebenan ist ein Versteck mit Werkzeug.'},
 {n:4,t:'Drohnenknoten',p:'Seitliche Nische mit Ladeplätzen. Es summt.',g:'Zwei Aufklärer, zwei Wächter. Drei Zustände: Routine (patrouillieren), Besichtigung (begleiten, zählen), Unregelmäßigkeit (blockieren, trennen, erst dann Waffen). Die Wartungsanschlüsse sind ein Interface-Punkt. Die Wartungstür auf der Rückseite führt zum Technikflur Süd: der Hintereingang in den Korridor, mitten durch das Nest.'},
 {n:5,t:'Sammlung (Vault)',p:'',g:'Wände aus lebendem Gewebe als Träger einer dualen Manabarriere (reagiert auf Bohren und Erschütterung, heilt kleine Wunden, verdichtet sich bei Alarm). Der Koffer liegt auf einem niedrigen Sockel ganz hinten: der Weg dorthin führt an der Schatulle mit Edelsteinen direkt neben der Tür, der Cybertech und der magischen Antiquität vorbei. Packtisch mit Werkzeug und Verpackung. Lüftungsgitter innen an der Ostwand.',gm:true},
 {n:6,t:'Technische Schleuse (Gondel)',p:'Von außen als Andockpunkt der Fassadengondel sichtbar.',g:'Außentür öffnet nur mit Wartungsauftrag im System (Interface oder gefälschter Auftrag) oder mit Gewalt (laut). Kamera innen. Von hier: Technikflur Ost → Wartungstür in den Korridor (Alarmkontakt) oder Klimatechnik → Lüftungskanal.'},
 {n:7,t:'Klimatechnik & Lüftungskanal',p:'',g:'Der Kanal (60×60 cm) führt durch die Ostwand in die Sammlung. Gitter mit Kontakt und Vibrationssensor, das Gewebe umwächst den Kanal und zuckt beim Schneiden (Alert +1, sichtbare Spur). Die Barriere schließt den Kanal astral. Eine gemeldete Klimastörung am „empfindlichen Objekt“ ist der perfekte Vorwand, Venn zur Schleuse zu locken.',gm:true},
 {n:8,t:'Sicherheitsserver / Host-Knoten',p:'',g:'Physischer Zugriff auf Türen, Sensoren und Drohnenlogik dieser Ebene (nicht auf 111, eigenes System). Kabeldurchführung 30 cm zum Vorraum: Mikrodrohne oder Kabel passt. Interface hier ist Controlled, aber jeder Login wird protokolliert: kein Alert jetzt, dafür Heat später.',gm:true},
 {n:9,t:'Sensorzentrale',p:'',g:'Lokale Steuerung der Korridorsensoren. Wer hier steht, kann Sensoren als „in Wartung“ markieren (Engineer oder Interface): Korridor fünf Minuten blind. Tür mit Reader vom Technikflur Ost.',gm:true},
 {n:10,t:'Kernvorraum, Frachtschacht & Personaltreppe',p:'Die Personaltreppe führt an dieser Ebene vorbei; die Brandschutztür ist verriegelt.',g:'Frachtaufzug hält hier nicht, aber die Schachttür existiert: Kabine per Interface oder Rigger auf 110 stoppen, Tür manuell öffnen. Die Brandschutztür entriegelt bei Feueralarm (Alert +2, Gäste werden evakuiert, aber Chaos ist Deckung). Technikschacht: Wartungsschacht-Ausstieg in die Löschzentrale, dort ein Bewegungssensor.'},
 {n:11,t:'Löschzentrale',p:'',g:'Vorrat des Sicherungsschaums für den Korridor. Wer die Anlage kontrolliert, löst den Schaum selbst aus oder verhindert ihn. Ausstieg des Wartungsschachts mit Bewegungssensor.',gm:true},
 {n:12,t:'Drohnenwerkstatt',p:'',g:'Ersatzteile, ein zerlegter Wächter, Wartungstransponder: Drohnen ignorieren, was als „Wartungsgerät“ sendet (Täuschung der Zielerkennung, Engineer oder Interface). Werkzeug für alles, was oben fehlte.',gm:true},
 {n:13,t:'Astraler Watcher & Manabarriere',p:'',g:'Der Watcher patrouilliert astral um die Vault (violette Schleife), meldet ungewöhnliche astrale Aktivität (Alert +1) und kämpft nicht. Am Türdurchgang wird die Barriere kontrolliert geöffnet: ein Mage kann den Mechanismus mit Assense studieren und daraus einen Vorteil für einen eigenen Weg gewinnen.',gm:true},
],

 {id:'B',c:'out',t:'Gondel → Technische Schleuse → Technikflur Ost → Wartungstür',d:'Umgeht Schleuse und Lifte, endet im Korridor hinter den Lichtschranken. Alarmkontakt an der Wartungstür.',gm:true},
 {id:'C',c:'tech',t:'Wartungsschacht → Löschzentrale → Technikring → Drohnenknoten (Rückseite)',d:'Lang, dunkel, ohne Kameras im Ring. Endet mitten im Drohnennest; bei Routine schlafen die Drohnen an den Docks.',gm:true},

sits:[
 '<b>Drei Zustände.</b> Die Drohnen reagieren auf den Kontext: Routine, Besichtigung oder Unregelmäßigkeit. Ein sozialer Erfolg oben verändert, wie diese Ebene die Crew begrüßt, beseitigt die Drohnen aber nicht.',
 '<b>Der Weg zum Koffer führt an allem vorbei.</b> Schatulle neben der Tür, Cybertech links, Antiquität mit Aura in der Mitte. Beschreibe alles, bevor der Koffer überhaupt sichtbar wird.',
 '<b>Faktor fehlt.</b> Venn scannt, die Anzeige sagt „PHYSISCHER FAKTOR: AUSSTEHEND“. 90 Sekunden. Wo ist die Karte gerade, und wer steht neben Venn?',
 '<b>Hintereingang durchs Nest.</b> Wer über den Technikring kommt, betritt den Korridor durch den Drohnenknoten. Controlled, wenn niemand etwas berührt; Desperate, wenn die Wächter schon wach sind.',
 '<b>Schaum.</b> Consequence im Korridor: Sicherungsschaum aus der Decke. Sicht und Bewegung erschwert, für alle. Wer die Löschzentrale kontrolliert, entscheidet, wann.',
 '<b>Der Watcher sieht euch.</b> Astrale Aktivität → Meldung (Alert +1), kein Angriff. Ein Mage kann ihn ablenken, täuschen oder einfach still bleiben.',
 '<b>Tür fällt zu.</b> Dragon’s Deal: „Ihr erreicht den Koffer ohne Widerstand. Dafür schließt sich die Tresortür hinter euch.“ Jetzt zählen Lüftungskanal, Kabeldurchführung und der Packtisch mit Werkzeug.',
],

spots:[
 {n:1,t:'Rampe, Schranke & Pförtnerloge',p:'Die Rampe kommt von P1 herunter. Kennzeichenscanner, Schranke, ein gelangweilter Pförtner mit laufendem Trid.',g:'Der Scanner gleicht Kennzeichen mit Lieferplan und Bewohnerliste ab (Hacker: Fahrzeug eintragen). Der Pförtner winkt durch, was „wie Caterer aussieht“. Die Loge sieht Rampe und Fahrgasse Ost, nicht die Anlieferung. Zu Fuß über die Rampe hinein: niemand fragt.'},
 {n:2,t:'Fahrgasse & Sicherheitsbüro Garage',p:'Hauptfahrweg mit zwei Kameras. Ein rollender Sicherheitsroboter patrouilliert. Das Sicherheitsbüro hat ein Fenster zur Fahrgasse.',g:'Der Rollbot fährt eine 4-Minuten-Runde Fahrgasse ↔ Rangierfläche; wer sie kennt, weiß, wann die Anlieferung unbeobachtet ist. Die Monitore zeigen nur die Garage, nicht den Turm. Die eine Wache aus dem Büro steht meist beim Pförtner.'},
 {n:3,t:'Anlieferung & Laderampe',p:'Catering lädt aus, eine Schichtleiterin mit Tablet koordiniert, Vesperline-Kisten stapeln sich. Drei Ladetore, ein Van, ein gepanzerter Kunsttransporter.',g:'Die Schichtliste kennt jeden Namen; ein fremder fällt auf („Springer, kurzfristig“ ist die Antwort). Eine leere Vesperline-Kiste fasst eine Person. Um 01:30 fahren drei Kisten „Bühnentechnik“ mit dem Frachtaufzug nach 111. Der Kunsttransporter holt um 05:00 die Stücke; sein Fahrer schläft in der Kabine. Toter Winkel hinter dem Transporter.'},
 {n:4,t:'Frachtvorraum & Frachtaufzug',p:'Eine Wache scannt Badges, Lieferscheine und Kisten. Der Frachtaufzug fährt bis in den Kernflur des Penthouses.',g:'Kisten werden nur außen gescannt (Metall und Funk fallen auf, „Bühnentechnik“ erklärt vieles). Ebene 110 ist nicht anwählbar, aber die Schachttür dort existiert. Die Wache wechselt alle zwei Stunden; die Ablösung kennt die Gesichter der Frühschicht nicht.'},
 {n:5,t:'Personaltreppe (Notausgang)',p:'Fluchttreppe durch das ganze Gebäude.',g:'111 Stockwerke zu Fuß sind keine Option, aber zwei Ebenen bis zur EG-Lobby sind es: dort wartet der Glasaufzug, und aus Personal werden Gäste. Oben endet die Treppe am Dach (Alarmkontakt), an 110 führt sie mit verriegelter Brandschutztür vorbei.'},
 {n:6,t:'Technikraum / GLT-Knoten',p:'Verschlossen, Schild „Technik“. Trafo, Verteiler.',g:'Physischer Zugang zur Gebäudeleittechnik: Aufzüge, Türen, Kameras der Garage und des Kernflurs 111. Eine Hackerposition außer Sicht. Ebene 110 hat einen eigenen Host und ist von hier nicht erreichbar, aber der Frachtaufzug lässt sich auf 110 anhalten.'},
 {n:7,t:'Lieferdrohnen-Depot & Drohnenschacht',p:'Drohnen summen, laden, starten durch eine Einflugöffnung zur Straße. Ein Schacht führt nach oben.',g:'Der Drohnenschacht (40×40 cm) endet in der Küche 111 und am Drohnenport auf dem Dach. Ein Rigger übernimmt eine Lieferdrohne und schickt Waffe, Werkzeug oder Keycard durchs Gebäude. Der Drohneneinflug ist ein Weg für Mikrodrohnen ohne Pförtner. Keine Kamera.'},
 {n:8,t:'Umkleide Personal',p:'Spinde, Uniformen, ein Waschbecken.',g:'Uniformen von Catering und Haustechnik, Badges hängen an den Spinden. Keine Kamera. Türen zum Frachtvorraum und zur Fahrgasse: der Wechsel zwischen Gast und Personal in beide Richtungen.'},
 {n:9,t:'VIP-Vorfahrt & Lobbyaufzug',p:'Limousinen, Valets, roter Teppich zum Aufzug ins Erdgeschoss, wo der Glasaufzug wartet. Eine Fahrer-Lounge mit Trid.',g:'Einladungen werden erst oben geprüft; hier zählt Auftreten. In der Fahrer-Lounge: Klatsch über Gäste, über Venn („die Kuratorin mit dem schwarzen Auge“) und Kade („der mit den Chromarmen sieht alles“). Valet-Schlüsselboard = Fluchtfahrzeuge. Kamera an der Schranke.'},
 {n:10,t:'Kistenlager & Müllraum',p:'Leergut, eine Müllpresse.',g:'Kein Kamerablick, gutes Versteck. Der Pressenlärm überdeckt vieles. Leere Kisten sind Verkleidung für Ausrüstung, die nicht durch den Scan soll.'},

sits:[
 '<b>Ausladen unter Zeitdruck.</b> Der Catering-Van muss in zehn Minuten die Rampe frei machen. Wer mit anpackt, wird nicht gefragt, wer er ist.',
 '<b>Falscher Name.</b> Die Schichtleiterin scannt ihr Tablet: „Sie stehen hier nicht.“ Sway oder Deception: „Springer, kurzfristig.“ Bei 4/5 ruft sie beim Caterer an, der gerade nicht erreichbar ist. Zehn Minuten Frist.',
 '<b>Kiste geht hoch.</b> Um 01:30 fahren drei Kisten „Bühnentechnik“ nach 111. Wer in einer sitzt, kommt im Kernflur an. Kisten werden nur außen gescannt.',
 '<b>Rollbot.</b> Vier Minuten Runde. Wer den Rhythmus kennt, hat zwei Minuten unbeobachtete Rangierfläche.',
 '<b>Fluchtfahrzeug.</b> Valet-Schlüsselboard, gepanzerter Kunsttransporter mit schlafendem Fahrer, Limousinen mit Fahrern in der Lounge. Drei Optionen, drei Lautstärken.',
 '<b>Hacker im Keller.</b> Vom GLT-Knoten aus: Aufzüge, Türen, Garagenkameras. Nicht Ebene 110. Aber den Frachtaufzug auf 110 stoppen, das geht.',
],
};

PLAN_EN.spots['111']={
1:{t:'Glass elevator, foyer & reception',p:'The glass elevator rides up the outside of the facade and opens straight into the foyer. Two security staff check the guest list, the cloakroom takes coats and bags, an unobtrusive arch stands at the transition to the salon.',g:'The arch detects weapons and heavy cyberware but only reports silently to Kade: conspicuous guests are not stopped but watched (Alert +1, one guard stays in view). The cloakroom is the perfect stash for a flashback (“the bag has been hanging here since 9 pm”). The elevator log stores arrival time and face.'},
2:{t:'Grand Salon & atrium',p:'The social heart: ~50 guests, bar, stage, buffet, service drones with drinks. Above the atrium the room opens up to the glass roof; the grand staircase leads to the VIP lounge on 112.',g:'The crowd is cover, but two cameras see almost everything. Service drones can be hijacked (distraction: a tray drops; transport: a keycard or commlink travels across the room). Anyone standing on the glass roof throws a silhouette over the party during lightning. Two security staff; Kade makes his rounds foyer → salon → gallery.'},
3:{t:'Terrace',p:'Open to the sky, wind and rain. To the west the landing pad of the service drones, to the east a covered smokers’ nook. Doors to the kitchen, the salon and the conservatory.',g:'Only one camera, pointed at the landing pad; the smokers’ nook is unwatched. The service door to the kitchen is often left ajar (staff smoke here). Access ladder to the roof: cage locked at the top, climbable around the outside (Prowl, risky). The terrace is the bypass around the party: kitchen → terrace → conservatory → gallery.'},
4:{t:'Conservatory',p:'A quiet retreat with living plants and its own glass roof. Dr. Venn escapes the small talk here.',g:'No camera (“guest privacy”). Venn is alone here for about 5 minutes every ~40 minutes: the best spot for a high-resolution iris capture or a serious conversation about art. The glass roof above is the quieter roof entry (see roof ⑥).'},
5:{t:'Exhibition gallery & collector lift',p:'Eight pieces on plinths, AR overlays with provenance and price. Dr. Venn gladly explains details to anyone seriously interested. At the back the vestibule to the collector lift: reader, one guard.',g:'Every ~40 minutes a piece is taken back down to 110: Venn, one guard and a transport cart ride the collector lift (a lift to hitch, a crate, a logistics disguise). For that, Kade’s clearance fetches the keycard from the event office: it is then out of the box for 10 minutes. The reader demands a security badge or Venn’s registration. Two cameras.'},
6:{t:'Library & smoking room',p:'Leather, fireplace, few guests, hushed conversation. This is where the serious collectors sit.',g:'No camera. The door to the study has a mechanical lock (not hackable, but lockpicks or force work). Guests here know things: who Venn is, that Kade “with the chrome arms” sees everything, that the gala ends at 3 am.'},
7:{t:'Study (private)',p:'Locked, sign “Private”. Not part of the event.',g:'Four entrances: gallery door (reader + alarm contact), library door (mechanical), private stairs from the suite on 112, private balcony (facade, rappel from the sky terrace 112). Motion sensor + camera. Behind the flush wood panelling lies the private lift to 110 (finger-wide gap, warm draft). On the desk a paper notebook in the same handwriting as Mr. Johnson’s notes.'},
8:{t:'Kitchen & core corridor',p:'Catering in full swing, service drones dock. The freight elevator and deliveries arrive in the core corridor; a guard scans delivery notes and crates.',g:'The scan checks badge and load list but opens no crates (metal and radio stand out; “stage equipment” explains a lot). Drone shaft 40×40 cm: garage ↔ kitchen ↔ roof, have gear delivered in portions. Dumbwaiter 60×60 cm to the pantry on 112. The head chef remembers unfamiliar faces, not uniforms.'},
9:{t:'Storeroom / art depot',p:'Vesperline transport crates, tools, an art transport cart.',g:'An empty crate holds one person. Blind spot behind the crates. Behind a shelf the inspection door to the utility shaft: inside, the maintenance shaft with a ladder down to 110 (suppression plant) and up to the roof. Motion sensor only on 110.'},
10:{t:'Event office',p:'Small office, door “Event staff only”, a service hatch to the staff corridor.',g:'The keycard lies in the black box; removal only with Kade’s clearance, everything is logged. The event manager drops by every ~15 minutes. Camera inside. The suspended ceiling connects locker room, staff passage, storeroom and office (ceiling void, barely carries one person). At the hatch, anyone who plausibly cites Kade’s clearance gets the card handed over the counter.'},
11:{t:'Security room',p:'Kade’s post: monitor wall, radio, doors to the foyer and the staff corridor.',g:'Kade is away 60 % of the time. Monitors show all cameras of this level, not those of 110 (separate system). Anyone standing here can lower Alert: swap footage, mark a sensor as defective. The window to the foyer is mirrored glass.'},
12:{t:'Guest restrooms',p:'Vestibule with mirrors, stalls behind. In the vestibule a door “Staff only”.',g:'The staff door leads into the staff corridor, simple cylinder lock. Classic role change: in as a guest, out as staff (uniform from the locker room opposite). No camera in the restrooms.'},
};
PLAN_EN.routes['111']={
A:{t:'As a guest to the collector lift',d:'Glass elevator → foyer → arch → salon → gallery → vestibule. Needs an invitation; at the vestibule a badge or Venn’s registration.'},
B:{t:'As staff to the keycard',d:'Freight elevator → core corridor (scan) → staff corridor → staff passage → event office (badge reader). Uniform + a reason to be in the office.'},
C:{t:'Library → study → private lift',d:'Mechanical lock, motion sensor, wood panelling. Quiet, no reader log, but the alarm contact on the gallery door stays untouched.'},
D:{t:'Storeroom → maintenance shaft → 110',d:'Inspection door behind the shelf, narrow shaft with a ladder. No staff, but a motion sensor at the exit on 110.'},
E:{t:'Around the outside: kitchen → terrace → conservatory → gallery',d:'Bypasses salon and arch. Wind, rain, one camera at the landing pad. Ends right next to Venn.'},
F:{t:'Ceiling void → event office',d:'Crawl from the locker room or storeroom over the partition wall. Barely carries one person; the office camera points downward.'},
};
PLAN_EN.sits['111']=[

 '<b>Silent check.</b> The arch only reports to Kade. Anyone conspicuous gets no scene, just a shadow. Attentive runners notice: the same guard is always within sight.',

 '<b>Four doors into the study.</b> Reader (hacker), mechanical (snake/punk), stairs from above (prowl), balcony (rigger/adept). Every crew finds its own.',
 '<b>Role change in the restroom.</b> In as a guest, out through the staff door. The locker room with uniforms is right opposite.',
 '<b>Service hatch.</b> A runner in security uniform demands the card “on Kade’s orders for the return transport”. Sway or Command, risky. On a 4/5 the event manager calls Kade to confirm.',
];
PLAN_EN.spots['112']={
1:{t:'VIP lounge & gallery walk',p:'A balcony runs around the atrium. Few, very well-connected guests, lounge furniture, the grand staircase down into the salon. From the railing you see the whole party.',g:'Fewer guests means more attention per person: anyone who does not belong stands out within minutes. One security officer, two cameras. The railing is overwatch for a trigger and the fastest way down (rope into the atrium, 6 m). Service drones fly through the void.'},
2:{t:'Pantry & dumbwaiter',p:'A small bar kitchen for the lounge; supplies come up by dumbwaiter from the kitchen on 111.',g:'Dumbwaiter 60×60 cm: items, a keycard handover between two runners on different levels, at a pinch a very slim runner (desperate). Two service staff who rarely look up.'},
3:{t:'Sky terrace & pool',p:'Outdoor terrace with heated pool, glass balustrade, wind. Doors to the lounge, the skycab lobby and the suite.',g:'No camera except the one at the lobby door. The balustrade is a rappel point to the private balcony 111 (3 m east, 5 m down) and the escape route for anything that flies. The facade gondola passes along the east edge. The suite door is locked, but glass.'},
4:{t:'Skycab lobby',p:'Arrival for guests who come by skycab: reception, reader, stairs to the landing pad on the roof.',g:'One security officer checks skycab bookings against the guest list; anyone with a booking entered counts as expected. The reader to the lounge needs the guest badge. Escape route number one at low Alert: order a skycab, up the stairs, gone. Camera above the door.'},
5:{t:'Private suite',p:'Locked, dark, not part of the gala.',g:'Empty. Motion sensors in three corners, no cameras (Veyrath tolerates none in his rooms). The private stairs in the parlor lead directly into the study on 111: the way to the private lift that bypasses gallery and library entirely. Hints about the owner: warm floor, oversized doors and furniture, tailored suits without labels in the dressing room.'},
6:{t:'Maintenance gallery & utilities',p:'Ventilation plant, ducts, staff stairs, a storage room with furniture. Loud.',g:'Floor hatch into the utility shaft: the maintenance shaft leads down to the storeroom on 111 and on to the suppression plant on 110, up to the roof. The staff stairs continue to the roof (door with alarm contact). The exhaust noise covers tool sounds.'},
7:{t:'Service corridor',p:'Staff connection between pantry and skycab lobby.',g:'No camera. Service staff and VIP reception cross paths here: the best place to swap a uniform for a suit or the other way round.'},
8:{t:'Conservatory glass roof (void)',p:'From here you look down through the glass into the conservatory.',g:'From the roof: vent flap for ventilation, mechanical, no sensor, sticks (Prowl or Engineer, controlled when calm). Below, Venn’s camera-free retreat. 5 m of rappelling into plants.'},
9:{t:'Atrium void',p:'A view 6 m down onto the party, 5 m up to the glass roof.',g:'Fall hazard for consequences. A rope from the railing is the fastest way down and up (glass roof maintenance vent). Anyone hanging here is seen.'},
};

A:{t:'By skycab into the party',d:'Landing pad → stairs → skycab lobby (booking + badge) → lounge → grand staircase → salon. In reverse the most elegant escape.'},
B:{t:'Lounge → suite → private stairs → study',d:'Reader on the suite door, three motion sensors, nothing else. Ends right next to the private lift, without gallery and library.'},
C:{t:'Pantry → service corridor → maintenance gallery → floor hatch',d:'Camera-free all the way to the shaft. Down to the storeroom on 111 or all the way to 110.'},
D:{t:'Sky terrace → rappel to the private balcony 111',d:'Wind, rain, glass. Prowl, risky. Below, the motion sensor in the study is waiting.'},
E:{t:'Staff stairs → service corridor → lounge',d:'The service staff’s route: coming from 111 or the roof, into the lounge without a reader.'},
};
PLAN_EN.sits['112']=[

PLAN_EN.spots['dach']={
1:{t:'Skycab landing pad',p:'Lit platform with a shelter and stairs down to the skycab lobby on 112. At night autonomous skycabs land here with VIP guests.',g:'The approach transponder grants autonomous skycabs landing clearance: hacked, every cab lands as a “registered arrival”; without clearance it circles for 90 seconds and calls in (Alert +1). Camera at the shelter. Landing zone B for parachutes: flat, but brightly lit.'},
2:{t:'Roof access, staff stairs',p:'The only regular way onto the roof: steel door, reader.',g:'Alarm contact: opening without a badge reports silently (Alert +1). Camera and motion sensor in front. The stairs lead down to P2: 112 maintenance gallery, 111 core corridor, past 110 (locked fire door), ground-floor lobby, garage.'},
3:{t:'Utility shaft head',p:'An inconspicuous hatch between the plant rooms.',g:'Below it the maintenance shaft (80×80 cm) with a ladder: exits on 112 (floor hatch, maintenance gallery), 111 (inspection door, storeroom) and 110 (suppression plant). No sensor until 110. The most direct way from the roof to the vault without touching the party.'},
4:{t:'Drone port',p:'Delivery drones land here and disappear into a shaft into the building.',g:'Drone shaft 40×40 cm down to the kitchen on 111 and on to the garage. A rigger sends gear down or up in portions. The constant drone traffic covers small flying devices of your own. No camera.'},
5:{t:'Atrium glass roof',p:'A lit glass pyramid above the salon. From below every silhouette on the glass is visible.',g:'Struts carry, panes carry one person. Maintenance vent on the north side with a contact. Anyone standing here is seen from below during lightning (consequence: a guest points up). Rappelling: 12 m to the salon floor. A fall through the glass is a possible consequence, never the automatic result.'},
6:{t:'Conservatory glass roof',p:'A flatter, dark glass roof above the conservatory.',g:'Vent flap mechanical, no sensor, sticks (Prowl/Engineer). Below, Venn’s retreat without a camera, 5 m of rappelling into soft plants. The quiet roof entry.'},
7:{t:'Building maintenance unit (gondola)',p:'Maintenance crane with a cleaning gondola, parked at the east edge. Runs on a rail along the facade.',g:'Controls manual at the box or via Interface. The gondola runs along the east facade down to the technical airlock on 110 (docking point) and on to the ground floor. Rides are logged; deviation from the maintenance schedule → silent check. Dragon’s Deal: “It takes you exactly to the target and then locks itself to the outside.”'},
8:{t:'Access ladder',p:'Maintenance ladder at the north edge, down to the terrace on 111.',g:'8 m, cage locked at the top, climbable around the outside. The terrace camera only sees the drone landing pad, not the ladder. Whoever arrives here stands right next to the kitchen service door left ajar.'},
9:{t:'Landing zone east',p:'',g:'Flat roof above the suite, no camera, lee of the mast. The best drop point for parachute or glider. Caution: parapet only 1.1 m, gusts. From here on foot around the glass pyramid to the roof access.'},
10:{t:'Plant rooms',p:'Cooling towers, air handlers, backup power. Loud, warm, steaming.',g:'Cover and noise. Sabotaging backup power/UPS triggers emergency lighting and the lockdown protocol (Alert +2): a bad idea as an entry, a good distraction for the escape.'},
};

C:{t:'Shaft head → maintenance shaft',d:'Tight, dark, no sensor until 110. Exits on 112, 111, 110. The way around the party.'},

PLAN_EN.spots['110']={
1:{t:'Access airlock',p:'Both lifts end in the same matte-black airlock. Sensors register movement, weight and devices. A terminal asks for identity.',g:'The weight plate counts people and compares with the registration. The device scan flags radio and metal. A camera with face matching recognizes Venn and greets her by name. Deviation → silent alarm, the airlock door locks behind the crew (a consequence, not a dead end: the door opens from inside with Engineer or force).'},
2:{t:'Sensor corridor',p:'A long, surprisingly empty corridor. Museum lighting, then a turn to the north.',g:'Three light barriers (x positions marked), pressure plates before the turn, RFID arch in the turn, three cameras. During an “authorized viewing” everything stays armed, but the judgement is kinder: position controlled instead of risky. Foam nozzles in the ceiling flood the corridor on alarm (vision and movement impaired, drone sensors too). A recon drone patrols here.'},
3:{t:'Authentication point & vault door',p:'A console with card reader and iris scanner in front of a massive door.',g:'Order does not matter, 90-second window. With only one factor: “BIOMETRIC FACTOR: CONFIRMED · PHYSICAL FACTOR: PENDING”. Every attempt is logged. Without factors: 40 cm of composite, tissue and barrier, so loud, long or magically demanding, never impossible. The curators’ prep room next door is a hiding place with tools.'},
4:{t:'Drone node',p:'A side niche with charging bays. It hums.',g:'Two recon drones, two guardians. Three states: routine (patrol), viewing (escort, count), irregularity (block, separate, only then weapons). The maintenance ports are an Interface point. The maintenance door at the back leads to the south service corridor: the back entrance into the corridor, right through the nest.'},
5:{t:'Collection (vault)',p:'',g:'Walls of living tissue carrying a dual mana barrier (reacts to drilling and shock, heals small wounds, densifies on alarm). The case lies on a low plinth at the very back: the way there passes the jewel casket right next to the door, the cybertech and the magical antique. Packing table with tools and packaging. Ventilation grille inside on the east wall.'},
6:{t:'Technical airlock (gondola)',p:'Visible from outside as the facade gondola’s docking point.',g:'The outer door opens only with a maintenance order in the system (Interface or forged order) or with force (loud). Camera inside. From here: east service corridor → maintenance door into the corridor (alarm contact) or climate control → ventilation duct.'},
7:{t:'Climate control & ventilation duct',p:'',g:'The duct (60×60 cm) leads through the east wall into the collection. Grille with contact and vibration sensor; the tissue grows around the duct and twitches when cut (Alert +1, visible trace). The barrier closes the duct astrally. A reported climate fault at the “sensitive object” is the perfect pretext to lure Venn to the airlock.'},
8:{t:'Security server / host node',p:'',g:'Physical access to doors, sensors and drone logic of this level (not 111, separate system). Cable pass-through 30 cm to the authentication room: a micro drone or a cable fits. Interface here is controlled, but every login is logged: no Alert now, Heat later.'},
9:{t:'Sensor control',p:'',g:'Local controller of the corridor sensors. Anyone standing here can mark sensors as “under maintenance” (Engineer or Interface): corridor blind for five minutes. Door with reader from the east service corridor.'},
10:{t:'Core lobby, freight shaft & staff stairs',p:'The staff stairs pass this level; the fire door is locked.',g:'The freight elevator does not stop here, but the shaft door exists: stop the cab on 110 via Interface or a rigger, open the door manually. The fire door unlocks during a fire alarm (Alert +2, guests are evacuated, but chaos is cover). Utility shaft: maintenance shaft exit into the suppression plant, motion sensor there.'},
11:{t:'Suppression plant',p:'',g:'Stock of the security foam for the corridor. Whoever controls the plant releases the foam or prevents it. Exit of the maintenance shaft with a motion sensor.'},
12:{t:'Drone workshop',p:'',g:'Spare parts, a disassembled guardian, maintenance transponders: drones ignore whatever broadcasts as a “maintenance device” (spoofing target recognition, Engineer or Interface). Tools for everything that was missing upstairs.'},
13:{t:'Astral watcher & mana barrier',p:'',g:'The watcher patrols astrally around the vault (violet loop), reports unusual astral activity (Alert +1) and does not fight. At the doorway the barrier is opened in a controlled way: a mage can study the mechanism with Assense and gain an advantage for a route of their own.'},
};

B:{t:'Gondola → technical airlock → east service corridor → maintenance door',d:'Bypasses airlock and lifts, ends in the corridor behind the light barriers. Alarm contact on the maintenance door.'},
C:{t:'Maintenance shaft → suppression plant → service ring → drone node (rear)',d:'Long, dark, no cameras in the ring. Ends in the middle of the drone nest; on routine the drones sleep at their docks.'},
D:{t:'Climate control → ventilation duct → collection',d:'60×60 cm, grille with contact, the tissue twitches. Bypasses the vault door completely, but not the barrier (closed astrally).'},

PLAN_EN.sits['110']=[
 '<b>Three states.</b> The drones react to context: routine, viewing or irregularity. A social success upstairs changes how this level greets the crew, but does not remove the drones.',
 '<b>The way to the case passes everything.</b> Casket next to the door, cybertech on the left, antique with an aura in the middle. Describe it all before the case is even visible.',
 '<b>Factor missing.</b> Venn scans, the display says “PHYSICAL FACTOR: PENDING”. 90 seconds. Where is the card right now, and who is standing next to Venn?',
 '<b>Back entrance through the nest.</b> Whoever comes via the service ring enters the corridor through the drone node. Controlled if nobody touches anything; desperate if the guardians are already awake.',
 '<b>Foam.</b> A consequence in the corridor: security foam from the ceiling. Vision and movement impaired, for everyone. Whoever controls the suppression plant decides when.',

 '<b>The door slams shut.</b> Dragon’s Deal: “You reach the case without resistance. In return the vault door closes behind you.” Now the ventilation duct, the cable pass-through and the packing table with tools matter.',
];

/* English long texts for the parking garage and the section. */
PLAN_EN.spots['garage']={
1:{t:'Ramp, barrier & gatekeeper',p:'The ramp comes down from P1. Plate scanner, barrier, a bored gatekeeper with the trid running.',g:'The scanner matches plates against the delivery schedule and resident list (hacker: enter a vehicle). The gatekeeper waves through anything that “looks like catering”. The booth sees the ramp and the east end of the drive aisle, not the deliveries. Walking in over the ramp: nobody asks.'},
2:{t:'Drive aisle & garage security office',p:'Main driveway with two cameras. A rolling security robot patrols. The security office has a window onto the drive aisle.',g:'The rollbot runs a 4-minute loop drive aisle ↔ maneuvering area; whoever knows it knows when the deliveries are unwatched. The monitors show only the garage, not the tower. The one guard from the office mostly stands with the gatekeeper.'},
3:{t:'Deliveries & loading dock',p:'Catering unloads, a shift supervisor with a tablet coordinates, Vesperline crates pile up. Three dock gates, one van, one armored art transport.',g:'The shift list knows every name; an unknown one stands out (“temp, last minute” is the answer). An empty Vesperline crate holds one person. At 01:30 three crates of “stage equipment” ride the freight elevator to 111. The art transport collects the pieces at 05:00; its driver sleeps in the cab. Blind spot behind the transport.'},
4:{t:'Freight lobby & freight elevator',p:'A guard scans badges, delivery notes and crates. The freight elevator goes up to the penthouse core corridor.',g:'Crates are only scanned from the outside (metal and radio stand out; “stage equipment” explains a lot). Level 110 cannot be selected, but the shaft door there exists. The guard changes every two hours; the relief does not know the early shift’s faces.'},
5:{t:'Staff stairs (emergency exit)',p:'Escape stairs through the whole building.',g:'111 floors on foot are not an option, but two levels to the ground-floor lobby are: the glass elevator waits there, and staff becomes guests. At the top the stairs end at the roof (alarm contact); they pass 110 with a locked fire door.'},
6:{t:'Utility room / building control node',p:'Locked, sign “Utilities”. Transformer, distribution.',g:'Physical access to the building automation: elevators, doors, cameras of the garage and the core corridor on 111. A hacker position out of sight. Level 110 has its own host and cannot be reached from here, but the freight elevator can be stopped at 110.'},
7:{t:'Delivery drone depot & drone shaft',p:'Drones hum, charge, launch through an entry opening to the street. A shaft leads upward.',g:'The drone shaft (40×40 cm) ends in the kitchen on 111 and at the drone port on the roof. A rigger takes over a delivery drone and sends a weapon, tool or keycard through the building. The drone entry is a way for micro drones past the gatekeeper. No camera.'},
8:{t:'Staff locker room',p:'Lockers, uniforms, a sink.',g:'Uniforms of catering and building services, badges hang on the lockers. No camera. Doors to the freight lobby and the drive aisle: the change between guest and staff in both directions.'},
9:{t:'VIP drop-off & lobby elevator',p:'Limousines, valets, a red carpet to the elevator up to the ground floor, where the glass elevator waits. A drivers’ lounge with a trid.',g:'Invitations are only checked upstairs; here appearance counts. In the drivers’ lounge: gossip about guests, about Venn (“the curator with the black eye”) and Kade (“the one with the chrome arms sees everything”). Valet key board = getaway vehicles. Camera at the barrier.'},
10:{t:'Crate storage & waste room',p:'Empties, a waste compactor.',g:'No camera coverage, a good hiding place. The compactor noise covers a lot. Empty crates disguise gear that should not pass the scan.'},
};

const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim()||'#888';

const matCache=new Map();
function mat(name,opts={}){
  const key=name+JSON.stringify(opts);if(matCache.has(key))return matCache.get(key);
  const m=new THREE.MeshStandardMaterial(Object.assign({color:col(name),roughness:.85,metalness:0},opts));
  if(opts.opacity!==undefined&&opts.opacity<1){m.transparent=true;m.depthWrite=false;}
  matCache.set(key,m);return m;
}
// Planpixel → Welt: x bleibt x, Plan-y wird z, Höhe y in Planpixeln (L.scale px = 1 m)
function box(parent,x0,z0,x1,z1,y0,y1,m,shadow=true){
  if(y1<=y0||x1<=x0||z1<=z0)return null;
  const g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0);const me=new THREE.Mesh(g,m);
  me.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);me.castShadow=shadow;me.receiveShadow=true;parent.add(me);return me;
}
function sprite(parent,text,opts={}){
  const fs=opts.size||44,font=`${opts.weight||600} ${fs}px "Barlow Condensed","Arial Narrow",sans-serif`;
  const cv=document.createElement('canvas'),cx=cv.getContext('2d');cx.font=font;
  const up=!opts.round&&opts.upper!==false;// gemessen wird, was gezeichnet wird (Großbuchstaben sind breiter)
  const lines=String(text).split('|').map(l=>up?l.toUpperCase():l);const w=Math.ceil(Math.max(...lines.map(l=>cx.measureText(l).width)))+(opts.round?0:28);
  const lh=fs*1.08,h=Math.ceil(lh*lines.length+(opts.round?0:16));
  const side=opts.round?Math.max(w,h)+24:0;
  cv.width=opts.round?side:w;cv.height=opts.round?side:h;
  const c2=cv.getContext('2d');c2.font=font;c2.textAlign='center';c2.textBaseline='middle';
  if(opts.round){c2.beginPath();c2.arc(side/2,side/2,side/2-4,0,Math.PI*2);c2.fillStyle=opts.bg||css('surface');c2.fill();c2.lineWidth=6;c2.strokeStyle=opts.ring||css('ink');c2.stroke();c2.fillStyle=opts.fg||css('ink');c2.fillText(text,side/2,side/2+2);}
  else{if(opts.bg){c2.fillStyle=opts.bg;c2.globalAlpha=.82;c2.beginPath();c2.roundRect?c2.roundRect(0,0,cv.width,cv.height,10):c2.rect(0,0,cv.width,cv.height);c2.fill();c2.globalAlpha=1;}
    c2.fillStyle=opts.fg||css('ink');lines.forEach((l,i)=>c2.fillText(l,cv.width/2,cv.height/2+(i-(lines.length-1)/2)*lh+2));}
  const tex=new THREE.CanvasTexture(cv);tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:opts.depthTest??true,transparent:true}));
  const k=(opts.world||22)/fs;sp.scale.set(cv.width*k,cv.height*k,1);sp.renderOrder=opts.renderOrder||10;parent.add(sp);return sp;
}

function roomAt(rooms,x,y){
  for(let i=rooms.length-1;i>=0;i--){const r=rooms[i];if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h)return r;}
  return null;
}

function buildLevel(L){
  const S=L.scale||20,X=EXTRA3D[L.id]||{},gm=state.gm;
  const H={wall:3.2*S,low:1.15*S,mid:2.0*S,door:2.3*S,sill:.9*S,rail:1.1*S,open:2.8*S,eye:2.7*S};
  // Wandstufen: niedrig = Blick in jeden Raum, halb = Türöffnungen erkennbar, voll = echte Sichtlinien
  const top=walk.on?H.wall:{low:H.low,mid:H.mid,full:H.wall}[state.walls],T=6;
  colliders=[];sensors=[];actors=[];doorPicks=[];
  const clampTop=y=>Math.min(y,top);
  const g=new THREE.Group();
  const rooms=(L.rooms||[]).filter(r=>gm||!r.gm);
  const isGlass=r=>r&&(X.glassRooms||[]).includes(r.label);
  const isOut=r=>!r||['outdoor','roof','glass'].includes(r.t);
  const isVoid=r=>r&&r.t==='void'&&!X.voidIsFloor;
  const isOpen=r=>r&&(X.openTypes||[]).includes(r.t);
  const outside=r=>r&&(X.outsideVoids||[]).includes(r.label)?null:r;
  const slab=-0.6*S;

  // Böden: je Raum eine Platte; Lufträume als dunkle Grube, Glasdächer durchsichtig, Rampen schräg
  rooms.forEach((r,i)=>{
    const y1=0.2+i*0.06;
    if(isVoid(r)){colliders.push([r.x,r.y,r.x+r.w,r.y+r.h,0]);const p=box(g,r.x,r.y,r.x+r.w,r.y+r.h,slab-2*S,slab-1.95*S,mat('floor-void',{opacity:.85}),false);if(p)p.renderOrder=1;return;}
    if(r.t==='glass'){
      if((X.pyramids||[]).includes(r.label)){const mn=Math.min(r.w,r.h),py=new THREE.Mesh(new THREE.ConeGeometry(mn/2*Math.SQRT2,3*S,4,1,true),mat('glass',{opacity:.3,roughness:.1,side:THREE.DoubleSide}));
        py.rotation.y=Math.PI/4;py.position.set(r.x+r.w/2,1.5*S,r.y+r.h/2);g.add(py);
        const ed=new THREE.LineSegments(new THREE.EdgesGeometry(py.geometry),new THREE.LineBasicMaterial({color:col('ink-2')}));ed.rotation.copy(py.rotation);ed.position.copy(py.position);g.add(ed);}
      const p=box(g,r.x,r.y,r.x+r.w,r.y+r.h,0,y1,mat('floor-glass',{opacity:.55,roughness:.1}),false);if(p)p.renderOrder=2;return;}
    const ftype=r.t==='void'?'void':r.t;
    const m=r.gm?mat('floor-'+ftype,{roughness:.95,emissive:col('hidden'),emissiveIntensity:.18}):mat('floor-'+ftype,{roughness:.95});
    if((X.ramps||[]).includes(r.label)){
      box(g,r.x,r.y,r.x+r.w,r.y+r.h,slab,0,mat('line-2'),false);
      const hN=H.wall,v=[r.x,hN,r.y, r.x+r.w,hN,r.y, r.x+r.w,y1,r.y+r.h, r.x,y1,r.y+r.h];
      const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));geo.setIndex([0,3,1,1,3,2]);geo.computeVertexNormals();
      const rm=new THREE.Mesh(geo,mat('floor-'+ftype,{roughness:.95,side:THREE.DoubleSide}));rm.receiveShadow=true;g.add(rm);return;}
    box(g,r.x,r.y,r.x+r.w,r.y+r.h,slab,y1,m,false);
  });

  // Wände aus den Raumkanten: jede Kante wird beidseitig abgetastet, Öffnungen schneiden sie auf
  const lines=new Map();const add=(k,a,b)=>{if(!lines.has(k))lines.set(k,{iv:[],ops:[]});lines.get(k).iv.push([a,b]);};
  rooms.forEach(r=>{add('h:'+r.y,r.x,r.x+r.w);add('h:'+(r.y+r.h),r.x,r.x+r.w);add('v:'+r.x,r.y,r.y+r.h);add('v:'+(r.x+r.w),r.y,r.y+r.h);});
  (L.ops||[]).forEach(o=>{if(o.gm&&!gm&&o.k==='hidden')return;const hz=o.w>=o.h;const k=hz?'h:'+(o.y+o.h/2):'v:'+(o.x+o.w/2);if(lines.has(k))lines.get(k).ops.push({o,a:hz?o.x:o.y,b:hz?o.x+o.w:o.y+o.h});});
  const xs=[...new Set(rooms.flatMap(r=>[r.x,r.x+r.w]))],ys=[...new Set(rooms.flatMap(r=>[r.y,r.y+r.h]))];
  for(const [k,ln] of lines){
    const hz=k[0]==='h',c=+k.slice(2);
    const lo=Math.min(...ln.iv.map(v=>v[0])),hi=Math.max(...ln.iv.map(v=>v[1]));
    const bps=[...new Set([...(hz?xs:ys),...ln.iv.flat(),...ln.ops.flatMap(o=>[o.a,o.b])])].filter(v=>v>=lo&&v<=hi).sort((a,b)=>a-b);
    const pieces=[];
    for(let i=0;i<bps.length-1;i++){
      const a=bps[i],b=bps[i+1],m=(a+b)/2;if(b-a<0.5)continue;
      if(!ln.iv.some(v=>m>v[0]&&m<v[1]))continue;
      const A=outside(hz?roomAt(rooms,m,c-1):roomAt(rooms,c-1,m)),B=outside(hz?roomAt(rooms,m,c+1):roomAt(rooms,c+1,m));
      let kind;
      if(A===B)kind=null;
      else if(isOpen(A)&&isOpen(B))kind=null;
      else if((A&&A.t==='void')||(B&&B.t==='void'))kind=X.voidIsFloor?null:'rail';
      else if((A&&A.t==='vault')||(B&&B.t==='vault'))kind='vault';
      else if((isGlass(A)&&isOut(B))||(isGlass(B)&&isOut(A)))kind='glass';
      else if(isOut(A)&&isOut(B))kind=A&&B?null:(X.parapet?'parapet':'rail');
      else kind='wall';
      const op=ln.ops.find(o=>m>o.a&&m<o.b);
      if(!kind&&!op)continue;
      const last=pieces[pieces.length-1];
      if(last&&last.b===a&&last.kind===kind&&last.op===op)last.b=b;else pieces.push({a,b,kind:kind||'none',op});
    }
    pieces.forEach((p,i)=>{
      const prevOp=i>0&&pieces[i-1].b===p.a&&pieces[i-1].op,nextOp=i<pieces.length-1&&pieces[i+1].a===p.b&&pieces[i+1].op;
      const ext=p.op?0:(p.kind==='vault'?6:T/2);const a=p.a-(prevOp?0:ext),b=p.b+(nextOp?0:ext);
      wallPiece(g,hz,c,a,b,p.kind,p.op&&p.op.o,{H,top,T,clampTop,gm,lid:L.id});
    });
  }

  // Einrichtung, Personen, Sensoren
  (L.items||[]).forEach(it=>{if(it.gm&&!gm)return;item(g,it,{S,H,top,gm,L});});

  // Wege
  if(state.routes)(L.routes||[]).forEach(r=>{if(r.gm&&!gm)return;
    const path=new THREE.CurvePath();const y=0.35*S;
    for(let i=0;i<r.pts.length-1;i++)path.add(new THREE.LineCurve3(new THREE.Vector3(r.pts[i][0],y,r.pts[i][1]),new THREE.Vector3(r.pts[i+1][0],y,r.pts[i+1][1])));
    const tube=new THREE.Mesh(new THREE.TubeGeometry(path,r.pts.length*8,3,6,false),new THREE.MeshBasicMaterial({color:col('r-'+r.c),transparent:true,opacity:r.dash?.6:.9}));
    tube.renderOrder=5;g.add(tube);
    const s=sprite(g,r.id,{round:true,bg:css('r-'+r.c),ring:css('surface'),fg:'#fff',world:24,size:52,weight:700});s.position.set(r.pts[0][0],y+14,r.pts[0][1]);
  });

  // Nachts: warme Raumleuchten in den größten Räumen, grünliches Licht in Glasräumen
  if(state.night){const big=rooms.filter(r=>['public','private','outdoor','secure','drive','service'].includes(r.t)).sort((a,b)=>b.w*b.h-a.w*a.h).slice(0,6);
    big.forEach(r=>{const green=isGlass(r)||r.t==='outdoor';const pl=new THREE.PointLight(green?0x9fe0b0:0xffc98a,green?.7:.9,Math.max(r.w,r.h)*1.3,1.6);pl.position.set(r.x+r.w/2,2.8*S,r.y+r.h/2);g.add(pl);});}

  // Übergänge zu anderen Ebenen: farbige Bodenfläche, beim Begehen mit Schild
  linksOn(L.id).forEach(({link,r})=>{const c='r-'+link.c;const p=box(g,r[0],r[1],r[0]+r[2],r[1]+r[3],0,2.4,mat(c,{opacity:.45,emissive:col(c),emissiveIntensity:.4}),false);if(p)p.renderOrder=3;
    if(walk.on){const s=sprite(g,tr(link.name),{world:9,bg:css(c),fg:'#fff',upper:false});s.position.set(r[0]+r[2]/2,H.wall+.5*S,r[1]+r[3]/2);}});

  // Raumbeschriftung
  if(state.labels)rooms.forEach(r=>{if(!r.label)return;
    const s=sprite(g,tr(r.label),{world:r.small?11:16,bg:css('surface'),fg:css('ink'),depthTest:walk.on});
    s.position.set(r.lx??(r.x+r.w/2),top+(r.small?14:22),r.ly??(r.y+r.h/2));s.renderOrder=20;
  });

  // Nummern (anklickbar)
  pickables=[];
  (L.marks||[]).forEach(m=>{if(m.gm&&!gm)return;
    const hl=selected===m.n;
    const s=sprite(g,String(m.n),{round:true,world:22,size:56,weight:700,bg:hl?css('accent'):css('surface'),fg:hl?css('surface'):css('ink'),ring:m.gm?css('gmnote'):css('ink'),depthTest:walk.on,renderOrder:30});
    const y=top+40;s.position.set(m.x,y,m.y);s.userData.n=m.n;pickables.push(s);
    const pin=new THREE.Mesh(new THREE.CylinderGeometry(.8,.8,y,6),new THREE.MeshBasicMaterial({color:col('ink'),transparent:true,opacity:.35}));pin.position.set(m.x,y/2,m.y);g.add(pin);
  });
  return g;
}

function wallPiece(g,hz,c,a,b,kind,o,{H,top,T,clampTop,gm,lid}){
  // block: Bauteil steht am Boden und versperrt den Weg (Türblätter, Glastüren und Schranken lassen durch)
  const seg=(y0,y1,m,t=T,sh=true,block=true)=>{if(block&&y0<=0)colliders.push(hz?[a,c-t/2,b,c+t/2,m.transparent?0:1]:[c-t/2,a,c+t/2,b,m.transparent?0:1]);return hz?box(g,a,c-t/2,b,c+t/2,y0,clampTop(y1),m,sh):box(g,c-t/2,a,c+t/2,b,y0,clampTop(y1),m,sh);};
  const glass=mat('glass',{opacity:.28,roughness:.1,metalness:.1}),wall=mat('wall',{roughness:.7}),frame=mat('ink-2');
  if(!o){
    if(kind==='wall')seg(0,H.wall,wall);
    else if(kind==='vault')seg(0,H.wall,mat('floor-vault',{roughness:.5,emissive:col('astral'),emissiveIntensity:.25}),12);
    else if(kind==='parapet')seg(0,H.rail,wall,8);
    else if(kind==='glass'){seg(0,H.wall,glass,2,false);seg(H.wall-6,H.wall,frame,4);}
    else if(kind==='rail'){seg(0,H.rail,glass,2,false);seg(H.rail-3,H.rail,frame,4);}
    return;
  }
  const k=o.k||'door',solid=kind==='wall'||kind==='vault';
  const lintel=(y)=>{if(solid)seg(y,H.wall,wall);else if(kind==='glass')seg(y,H.wall,glass,2,false);};
  const leaf=(m,block=false)=>seg(0,H.door,m,2.5,true,block);
  switch(k){
    case 'open':if(solid)seg(H.open,H.wall,wall);break;
    case 'glass':lintel(H.door);seg(0,H.door,glass,2,false,false);break;
    case 'window':seg(0,H.sill,solid?wall:glass,solid?T:2);seg(H.sill,H.door,glass,2,false);lintel(H.door);break;
    case 'hidden':{seg(0,H.wall,gm?mat('wall',{emissive:col('hidden'),emissiveIntensity:.55}):wall,T,true,!gm);break;}// die SL kennt den Weg
    case 'lift':lintel(H.door);leaf(mat('line-2',{metalness:.6,roughness:.35}));break;
    case 'fire':lintel(H.door);leaf(mat('sec',{roughness:.6}));break;
    case 'mech':lintel(H.door);leaf(mat('venn',{roughness:.6}));break;
    // Gesicherte Türen: verriegelt sperren sie in der Spieleransicht; die SL öffnet sie per Klick (Reader leuchtet dann grün)
    case 'reader':case 'vault':case 'secure':{lintel(H.door);
      const key=lid+':'+o.x+','+o.y,open=openDoors.has(key);
      const lf=leaf(open?mat('r-public',{opacity:.18}):k==='reader'?mat('line-2'):mat('wall',{metalness:.5,roughness:.4}),!open&&!gm);
      if(lf){lf.userData.door=key;doorPicks.push(lf);}
      if(k==='reader'){const p=hz?[a-3,c-5,a+3,c+5]:[c-5,a-3,c+5,a+3],lc=open?'r-public':'sec';box(g,p[0],p[1],p[2],p[3],H.sill+4,Math.min(H.sill+14,top),mat(lc,{emissive:col(lc),emissiveIntensity:.8}),false);}
      break;}
    case 'gate':lintel(H.door);seg(0,H.door,mat('ink-2',{opacity:.55}),2,false,false);break;
    default:lintel(H.door);leaf(mat('surface-2'));
  }
}

const geoCache={};
// Figur: Körper als nach unten weiter werdender Kegelstumpf (Mantel/Abendkleid), Kopf als Kugel
function figure(g,x,z,m,S,k=1){
  if(!geoCache.body){geoCache.body=new THREE.CylinderGeometry(.15*S,.27*S,1.3*S,12);geoCache.head=new THREE.SphereGeometry(.13*S,12,8);geoCache.body.userData.keep=geoCache.head.userData.keep=true;}
  const b=new THREE.Mesh(geoCache.body,m);b.position.set(x,.65*S*k,z);b.scale.set(1,k,1);b.castShadow=true;g.add(b);
  const h=new THREE.Mesh(geoCache.head,headMat());h.position.set(x,(1.3*k+.16)*S,z);h.castShadow=true;g.add(h);
}
function person(g,x,z,color,S,letter,ring){
  figure(g,x,z,mat(color,{roughness:.6}),S,1.05);

}
function tag(g,x,z,color,S,letter,y,ring){const s=sprite(g,letter,{round:true,world:12,size:44,weight:700,bg:css(color),fg:'#fff',ring:ring||css('surface')});s.position.set(x,y*S,z);}
// Bauteil einer Figur; Maße in Metern relativ zum Fußpunkt
function part(g,geo,m,x,z,S,dx,y,dz,rx=0,rz=0){const me=new THREE.Mesh(geo,m);me.position.set(x+dx*S,y*S,z+dz*S);me.rotation.set(rx,0,rz);me.castShadow=true;g.add(me);return me;}
const headMat=()=>{if(!matCache.has('head'))matCache.set('head',new THREE.MeshStandardMaterial({color:new THREE.Color('#D2C4B4'),roughness:.7}));return matCache.get('head');};
const chrome=()=>mat('line-2',{color:new THREE.Color('#C9D2DC'),metalness:.35,roughness:.25,emissive:new THREE.Color('#2A3340')});
// Sicherheit: kantig, breite Schultern im Blazer, Schirmmütze

// Kade: größer und massiger, verchromte Cyberarme, rotes Cyberauge
function kadeFig(g,x,z,S){
  const c=mat('kade',{roughness:.5}),dark=mat('ink-2',{roughness:.6}),cr=chrome();
  part(g,new THREE.BoxGeometry(.38*S,.88*S,.24*S),dark,x,z,S,0,.44,0);

// Dr. Venn: schmal und hochgewachsen im langen Mantel, goldenes AR-Visier, leuchtendes Tablet
function vennFig(g,x,z,S){
  const c=mat('venn',{roughness:.5});
  part(g,new THREE.CylinderGeometry(.11*S,.21*S,1.42*S,14),c,x,z,S,0,.71,0);
