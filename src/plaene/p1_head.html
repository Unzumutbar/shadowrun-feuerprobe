<title>Meridian Spire Pläne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{

  --r-public:#2B8A55; --r-staff:#D06F05; --r-tech:#0F7B86; --r-out:#2A67D3; --r-private:#7443B5;

  --hatch:rgba(22,28,38,.55);
}

  :root:not([data-theme="light"]){

    --wall:#D8DFE8; --cut:#151B23;
    --floor-public:#1E2630; --floor-service:#2B2620; --floor-secure:#1C2636; --floor-private:#28202F; --floor-outdoor:#162622; --floor-tech:#20262D; --floor-core:#2E3641; --floor-void:#111720; --floor-vault:#07090C; --floor-drive:#20262C; --floor-roof:#1B2129; --floor-glass:#143142; --floor-ramp:#262D36;
    --glass:#5CC0EA; --accent:#3FC1CC; --accent-ink:#8FE3EA; --accent-soft:rgba(63,193,204,.16);
    --sec:#FF6D5F; --guard:#78A6F2; --venn:#E9BC3F; --kade:#E5717F; --drone:#FFAB45; --astral:#B892F2; --plant:#74C283; --hidden:#CD85FF; --gmnote:#CD85FF;
    --r-public:#5AD08A; --r-staff:#FFB347; --r-tech:#3FC1CC; --r-out:#78A8FF; --r-private:#C6A1FF;

  --bg:#0D1218; --surface:#151B23; --surface-2:#1B222C; --ink:#E7EBF0; --ink-2:#C4CCD6; --muted:#8E9AA9; --line:#293441; --line-2:#3B4756;
  --wall:#D8DFE8; --cut:#151B23;
  --floor-public:#1E2630; --floor-service:#2B2620; --floor-secure:#1C2636; --floor-private:#28202F; --floor-outdoor:#162622; --floor-tech:#20262D; --floor-core:#2E3641; --floor-void:#111720; --floor-vault:#07090C; --floor-drive:#20262C; --floor-roof:#1B2129; --floor-glass:#143142; --floor-ramp:#262D36;
  --glass:#5CC0EA; --accent:#3FC1CC; --accent-ink:#8FE3EA; --accent-soft:rgba(63,193,204,.16);
  --sec:#FF6D5F; --guard:#78A6F2; --venn:#E9BC3F; --kade:#E5717F; --drone:#FFAB45; --astral:#B892F2; --plant:#74C283; --hidden:#CD85FF; --gmnote:#CD85FF;
  --r-public:#5AD08A; --r-staff:#FFB347; --r-tech:#3FC1CC; --r-out:#78A8FF; --r-private:#C6A1FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --hatch:rgba(231,235,240,.55);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1480px;margin:0 auto;padding-block:20px 48px;padding-inline:16px}
h1,h2,h3,.disp{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-wrap:balance;margin:0}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-block:4px 18px;border-bottom:1px solid var(--line)}
header.top h1{font-size:clamp(34px,5vw,50px);line-height:.95;font-weight:700;letter-spacing:.01em}
header.top h1 small{display:block;font-size:.42em;font-weight:500;color:var(--ink-2);letter-spacing:.04em;margin-top:6px}
.controls{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
@media (min-width:900px){.controls{align-items:flex-end}}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:600 15px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:9px 13px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.seg button small{font:11px/1 "IBM Plex Mono",monospace;letter-spacing:0;text-transform:none;color:var(--muted)}
.seg button:hover{background:var(--surface)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.seg button[aria-selected="true"] small{color:var(--surface);opacity:.75}
.seg button:focus-visible,.tog button:focus-visible,.spots li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tog{display:flex;flex-wrap:wrap;gap:8px}
.tog button{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 13px/1 "IBM Plex Sans",sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tog button .dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);flex:none}
.tog button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tog button[aria-pressed="true"] .dot{background:var(--accent)}
.tog button.gmtog[aria-pressed="true"]{border-color:var(--gmnote);background:rgba(138,63,179,.12)}
.tog button.gmtog[aria-pressed="true"] .dot{background:var(--gmnote)}

main.app{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:20px}
@media (min-width:1100px){main.app{grid-template-columns:minmax(0,1.55fr) minmax(320px,.8fr);align-items:start}}
.mappanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.maphead{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:space-between;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.maphead h2{font-size:28px;font-weight:700;letter-spacing:.01em}
.maphead h2 span{color:var(--muted);font-weight:500;margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px/1 "IBM Plex Mono",monospace;padding:6px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.svgbox{overflow-x:auto;padding:6px 6px 0}
.svgbox svg{display:block;width:100%;height:auto;min-width:640px;color:var(--ink);font-family:"IBM Plex Sans",sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 18px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend .lg svg{width:26px;height:16px;color:var(--ink);overflow:visible}
.legend .lg.gm{color:var(--gmnote)}
.legend .lgh{width:100%;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* SVG classes */
.rm{stroke:var(--wall);stroke-width:5;stroke-linejoin:miter}
.rm-public{fill:var(--floor-public)} .rm-service{fill:var(--floor-service)} .rm-secure{fill:var(--floor-secure)} .rm-private{fill:var(--floor-private)} .rm-outdoor{fill:var(--floor-outdoor)} .rm-tech{fill:var(--floor-tech)} .rm-core{fill:var(--floor-core)} .rm-void{fill:var(--floor-void);stroke-dasharray:10 6;stroke-width:2.5} .rm-vault{fill:var(--floor-vault);stroke-width:20} .rm-drive{fill:var(--floor-drive)} .rm-roof{fill:var(--floor-roof)} .rm-glass{fill:var(--floor-glass);stroke:var(--glass);stroke-width:3} .rm-ramp{fill:var(--floor-ramp)}
.rm-thin{stroke-width:2.5}
.plate{fill:none;stroke:var(--wall);stroke-width:8}
.cut{fill:var(--cut);stroke:none}
.leaf{stroke:var(--ink);stroke-width:1.6;fill:none}
.glassline{stroke:var(--glass);stroke-width:3;stroke-linecap:round}
.gateline{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.reader{fill:var(--sec);stroke:none}
.mech{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.hiddenop{fill:none;stroke:var(--hidden);stroke-width:2.5;stroke-dasharray:5 4}
.liftline{stroke:var(--ink);stroke-width:1.5}
.firedoor{fill:var(--sec)}
.vaultleaf{stroke:var(--ink);stroke-width:5}
.secureleaf{stroke:var(--ink);stroke-width:3}
.win{stroke:var(--glass);stroke-width:2.5;stroke-dasharray:6 3}
.glyph{stroke:var(--ink);fill:none;stroke-width:1.4}
.glyph-fill{fill:var(--floor-core);stroke:var(--ink);stroke-width:1.4}
.furn{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.2}
.furn-dark{fill:var(--line-2);stroke:var(--ink-2);stroke-width:1.2}
.furn-t{font:10px "IBM Plex Sans",sans-serif;fill:var(--ink-2);text-anchor:middle}
.furn-t.onvault{fill:#D6DCE4}
.plant{fill:var(--plant);opacity:.55}
.water{fill:var(--floor-glass);stroke:var(--glass);stroke-width:1.5}
.crate{fill:var(--floor-service);stroke:var(--ink-2);stroke-width:1.2}
.car{fill:var(--surface-2);stroke:var(--ink-2);stroke-width:1.4}
.lbl{font:600 12.5px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;fill:var(--ink);text-anchor:middle}
.lbl.sm{font-size:10.5px;letter-spacing:.04em}
.lbl.onvault{fill:#F2F4F7}
.sub{font:10px "IBM Plex Sans",sans-serif;fill:var(--muted);text-anchor:middle}
.sub.onvault{fill:#C9D0DA}
.note{font:italic 10px "IBM Plex Sans",sans-serif;fill:var(--ink-2);text-anchor:middle}
.cam{fill:var(--sec)} .cone{fill:var(--sec);opacity:.13;stroke:var(--sec);stroke-width:.6;stroke-opacity:.5}
.beam{stroke:var(--sec);stroke-width:1.5;stroke-dasharray:3 3}
.plate-s{stroke:var(--sec);stroke-width:1;stroke-dasharray:2 2}
.motion{fill:var(--sec);opacity:.2;stroke:var(--sec);stroke-width:1}
.rfid{stroke:var(--sec);stroke-width:2;fill:none}
.tok{stroke:var(--surface);stroke-width:1.5}
.tok-t{font:700 9px "IBM Plex Sans",sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.guard{fill:var(--guard)} .kade{fill:var(--kade)} .venn{fill:var(--venn)} .staff{fill:var(--muted)} .guest{fill:var(--line-2);stroke:none}
.droneR{fill:var(--drone);stroke:var(--ink);stroke-width:1} .droneW{fill:var(--drone);stroke:var(--ink);stroke-width:1.4}
.blind{stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
.blind-t{font:italic 9.5px "IBM Plex Sans",sans-serif;fill:var(--accent-ink);text-anchor:middle}
.hatchline{stroke:var(--hatch);stroke-width:.8}
.hatchsec{stroke:var(--sec);stroke-width:.8;opacity:.7}
.watcher{fill:none;stroke:var(--astral);stroke-width:2;stroke-dasharray:8 5;opacity:.9}
.barrier{fill:none;stroke:var(--astral);stroke-width:7;opacity:.35}
.duct{stroke:var(--line-2);stroke-width:10;stroke-linecap:butt;fill:none} .duct2{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3;fill:none}
.gmtxt{font:italic 10px "IBM Plex Sans",sans-serif;fill:var(--gmnote);text-anchor:middle}
.route{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.route-lbl{font:700 11px "IBM Plex Sans",sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.rc-public{stroke:var(--r-public);fill:var(--r-public)} .rc-staff{stroke:var(--r-staff);fill:var(--r-staff)} .rc-tech{stroke:var(--r-tech);fill:var(--r-tech)} .rc-out{stroke:var(--r-out);fill:var(--r-out)} .rc-private{stroke:var(--r-private);fill:var(--r-private)}
.routes{display:none} svg.routes-on .routes{display:block}
svg.view-player .gm{display:none}
.mk circle{fill:var(--surface);stroke:var(--ink);stroke-width:2} .mk text{font:700 12px "IBM Plex Sans",sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central} .mk{cursor:pointer}
.mk.hl circle{fill:var(--accent);stroke:var(--accent)} .mk.hl text{fill:#fff}
.mk.gmmk circle{stroke:var(--gmnote);stroke-dasharray:3 2}
.scale{stroke:var(--ink);stroke-width:2} .scale-t{font:10px "IBM Plex Mono",monospace;fill:var(--ink-2)}
.north{stroke:var(--ink);stroke-width:1.5;fill:none} .north-f{fill:var(--ink)}
.tblock{font:10.5px "IBM Plex Mono",monospace;fill:var(--muted)}
.grid{stroke:var(--line);stroke-width:.6;opacity:.7}
.arrow-r{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.rail{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:2 4}
.lights{fill:var(--drone)}
.outline{fill:none;stroke:var(--gmnote);stroke-width:1.5;stroke-dasharray:6 4;opacity:.8}
.outline-acc{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4;opacity:.9}
.lz{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2;stroke-dasharray:6 4}
.secl{font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;fill:var(--ink);text-anchor:end}
.secband{stroke:var(--line);stroke-width:1}
.secv{stroke-width:6;stroke-linecap:round;fill:none}
.secstop{fill:var(--surface);stroke-width:2.5}
.secblock{stroke:var(--sec);stroke-width:2.5}
.secnum{font:700 11px "IBM Plex Sans",sans-serif;text-anchor:middle;fill:var(--ink)}

/* Sidebar */
aside.key{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
.card h3{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Mono",monospace;margin-bottom:10px}
.spots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.spots li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 6px;border-radius:8px;border-top:1px solid var(--line);cursor:default}
.spots li:first-child{border-top:0}
.spots li:hover,.spots li.hl{background:var(--accent-soft)}
.spots .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 12px "IBM Plex Sans",sans-serif;background:var(--surface);margin-top:1px}
.spots li.gmonly .n{border-color:var(--gmnote);border-style:dashed}
.spots b{display:block;font-weight:600;font-size:14.5px}
.spots p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.spots .gmn{margin-top:6px;padding:7px 9px;border-left:3px solid var(--gmnote);background:rgba(138,63,179,.07);border-radius:0 6px 6px 0;font-size:13px;color:var(--ink)}
.spots .gmn::before{content:attr(data-l);font:600 10px "IBM Plex Mono",monospace;letter-spacing:.1em;color:var(--gmnote);display:block;margin-bottom:2px}
.gmsfx{font:600 10px "IBM Plex Mono",monospace;color:var(--gmnote);letter-spacing:.08em;font-style:normal}
body.player .legend .lg.gm{display:none}
.tog .langs{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.tog .langs button{border:0;border-radius:0;padding:8px 13px;font-weight:600;letter-spacing:.04em}
.tog .langs button+button{border-left:1px solid var(--line-2)}
.tog .langs button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.player .gmn,.player .gmonly,.player .gmline,.player .gmcard{display:none}
.routelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.routelist li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:13.5px}
.routelist .rl{width:22px;height:22px;border-radius:50%;color:#fff;display:grid;place-items:center;font:700 11px "IBM Plex Sans",sans-serif;margin-top:1px}
.routelist b{font-weight:600}
.routelist span{color:var(--ink-2)}
.sits{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--ink-2)}
.sits li::marker{color:var(--accent)}
.sits b{color:var(--ink);font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.sectable{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.sectable th,.sectable td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.sectable th{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0}
.sectable td:first-child{font:700 12px "IBM Plex Sans",sans-serif;white-space:nowrap}
.sectable .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tablewrap{overflow-x:auto}
/* Druckansicht */
body.printmode main.app{display:none}
.ptoolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:20px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ptoolbar button{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 13px "IBM Plex Sans",sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer}
.ptoolbar .seg2{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.ptoolbar .seg2 button{border:0;border-radius:0;font-weight:600}
.ptoolbar .seg2 button+button{border-left:1px solid var(--line-2)}
.ptoolbar .seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ptoolbar .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ptoolbar .hint{flex-basis:100%;margin:0;font-size:12.5px;color:var(--muted)}
#psheets{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 30px;overflow-x:auto}
.psheet{width:297mm;min-height:210mm;background:#fff;color:#161C26;box-shadow:0 2px 6px rgba(0,0,0,.18),0 14px 40px rgba(0,0,0,.14);font:7pt/1.35 "IBM Plex Sans",sans-serif;--pline:#C4CBD3;--pmuted:#66717F;--pink2:#3C4756}
.psheet{--bg:#fff;--surface:#FBFBFC;--surface-2:#F0F2F5;--ink:#161C26;--ink-2:#3C4756;--muted:#66717F;--line:#CBD1D8;--line-2:#AEB7C1;--wall:#232C39;--cut:#FBFBFC;--floor-public:#F4F6F8;--floor-service:#EDE4D2;--floor-secure:#DFE6F1;--floor-private:#E9DFEE;--floor-outdoor:#D5E5DE;--floor-tech:#E1E4E8;--floor-core:#C9D0D8;--floor-void:#F7F8F9;--floor-vault:#2E333B;--floor-drive:#D3D8DE;--floor-roof:#ECEEF0;--floor-glass:#C8E3F0;--floor-ramp:#C4CBD3;--glass:#2C8AB8;--accent:#0F7B86;--accent-ink:#0A5B64;--accent-soft:rgba(15,123,134,.12);--sec:#C2372A;--guard:#2352A3;--venn:#B07C00;--kade:#7A1F2B;--drone:#D2730A;--astral:#7443B5;--plant:#4B8757;--hidden:#8A3FB3;--gmnote:#8A3FB3;--r-public:#2B8A55;--r-staff:#D06F05;--r-tech:#0F7B86;--r-out:#2A67D3;--r-private:#7443B5;--hatch:rgba(22,28,38,.55)}
.psheet:not(.auto){height:210mm;overflow:hidden}
.psheet .pin{padding:8mm;display:flex;flex-direction:column;gap:2.5mm;height:100%}
.psheet .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;border-bottom:.6pt solid var(--pline);padding-bottom:1.6mm}
.psheet .pe{font:600 6.4pt "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--pmuted)}
.psheet h2{font:700 19pt/1 "Barlow Condensed",sans-serif;margin:.8mm 0 0;color:#161C26}
.psheet h2 span{font:500 9pt "Barlow Condensed",sans-serif;color:var(--pink2);margin-left:3mm;letter-spacing:.02em}
