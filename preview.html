  });
}

spots:[
 {n:1,t:'Glasaufzug, Foyer & Empfang',p:'Der Glasaufzug fährt außen an der Fassade hoch und öffnet direkt ins Foyer. Zwei Sicherheitsleute prüfen die Gästeliste, die Garderobe nimmt Mäntel und Taschen, ein unauffälliger Bogen steht am Übergang zum Salon.',g:'Der Bogen erkennt Waffen und schwere Cyberware, meldet aber nur still an Kade: Auffällige werden nicht gestoppt, sondern beobachtet (Alert +1, eine Wache bleibt in Sichtweite). Garderobe = perfektes Depot für einen Flashback („die Tasche hängt seit 21 Uhr hier“). Aufzugsprotokoll speichert Ankunftszeit und Gesicht.'},
 {n:2,t:'Großer Salon & Atrium',p:'Das gesellschaftliche Herz: ~50 Gäste, Bar, Bühne, Buffet, Servicedrohnen mit Getränken. Über dem Atrium öffnet sich der Raum bis zum Glasdach, die Freitreppe führt zur VIP-Lounge auf 112.',g:'Menge = Deckung, aber zwei Kameras decken fast alles. Servicedrohnen lassen sich übernehmen (Ablenkung: Tablett fällt; Transport: Keycard oder Kommlink wandert quer durch den Raum). Wer auf dem Glasdach steht, wirft bei Blitzen eine Silhouette über die Party. Zwei Sicherheitsleute, Kade zieht seine Runde Foyer → Salon → Galerie.'},
 {n:3,t:'Terrasse',p:'Offen zum Himmel, Wind und Regen. Im Westen der Landeplatz der Servicedrohnen, im Osten eine überdachte Rauchernische. Türen zur Küche, zum Salon und zum Wintergarten.',g:'Nur eine Kamera, die auf den Landeplatz zeigt; die Rauchernische ist unbeobachtet. Die Servicetür zur Küche steht oft nur angelehnt (Personal raucht). Steigleiter zum Dach: Käfig oben verschlossen, außen herum kletterbar (Prowl, Risky). Die Terrasse ist der Bypass um die Party herum: Küche → Terrasse → Wintergarten → Galerie.'},
 {n:4,t:'Wintergarten',p:'Ruhiger Rückzugsraum mit lebenden Pflanzen und einem eigenen Glasdach. Dr. Venn flieht hierher vor dem Smalltalk.',g:'Keine Kamera („Privatsphäre der Gäste“). Venn ist alle ~40 Minuten für etwa 5 Minuten allein hier: beste Stelle für eine hochauflösende Iris-Aufnahme oder ein ernsthaftes Gespräch über Kunst. Das Glasdach darüber ist der leisere Dacheinstieg (siehe Dach ⑥).'},
 {n:5,t:'Ausstellungsgalerie & Sammlerlift',p:'Acht Stücke auf Sockeln, AR-Einblendungen mit Herkunft und Preis. Dr. Venn erklärt ernsthaft Interessierten gern Details. Hinten der Vorraum zum Sammlerlift: Reader, eine Wache.',g:'Alle ~40 Minuten wird ein Stück zurück nach 110 gebracht: Venn, eine Wache und ein Transportwagen fahren mit dem Sammlerlift (Mitfahrgelegenheit, Kiste, Verkleidung als Logistiker). Dafür holt Kades Freigabe die Keycard aus dem Eventbüro: sie ist dann 10 Minuten unterwegs. Reader verlangt Sicherheitsbadge oder Venns Anmeldung. Zwei Kameras.'},
 {n:6,t:'Bibliothek & Rauchsalon',p:'Leder, Kamin, wenige Gäste, gedämpfte Gespräche. Hier sitzen die ernsthaften Sammler.',g:'Keine Kamera. Die Tür zum Arbeitszimmer hat ein mechanisches Schloss (nicht hackbar, aber Dietrich oder Gewalt). Gäste hier wissen Dinge: wer Venn ist, dass Kade „mit den Chromarmen“ alles sieht, dass um 3 Uhr die Gala endet.'},
 {n:7,t:'Arbeitszimmer (privat)',p:'Verschlossen, Schild „Privat“. Nicht Teil der Veranstaltung.',g:'Vier Zugänge: Galerietür (Reader + Alarmkontakt), Bibliothekstür (mechanisch), Privattreppe aus der Suite auf 112, Privatbalkon (Fassade, von der Sky-Terrasse 112 abseilbar). Bewegungsmelder + Kamera. Hinter der bündigen Holzverkleidung liegt der Privatlift nach 110 (fingerbreite Fuge, warmer Luftzug). Auf dem Tisch ein Papiernotizbuch mit derselben Handschrift wie Mr. Johnsons Notizen.'},
 {n:8,t:'Küche & Kernflur',p:'Cateringbetrieb, Servicedrohnen docken an. Im Kernflur kommen Frachtaufzug und Anlieferung an; eine Wache scannt Lieferscheine und Kisten.',g:'Der Scan prüft Badge und Ladeliste, öffnet aber keine Kisten (Metall/Funk fällt auf, „Bühnentechnik“ erklärt vieles). Drohnenschacht 40×40 cm: Garage ↔ Küche ↔ Dach, Ausrüstung in Portionen liefern lassen. Speiseaufzug 60×60 cm zur Pantry auf 112. Der Küchenchef merkt sich fremde Gesichter, nicht Uniformen.'},
 {n:9,t:'Materiallager / Kunstdepot',p:'Vesperline-Transportkisten, Werkzeug, ein Kunsttransportwagen.',g:'Eine leere Kiste fasst eine Person. Toter Winkel hinter den Kisten. Hinter einem Regal die Revisionstür zum Technikschacht: darin der Wartungsschacht mit Steigleiter hinunter nach 110 (Löschzentrale) und hinauf bis zum Dach. Bewegungssensor erst auf 110.'},
 {n:10,t:'Eventbüro',p:'Kleines Büro, Tür „Nur Eventpersonal“, ein Ausgabefenster zum Personalflur.',g:'Die Keycard liegt in der schwarzen Kassette; Entnahme nur mit Kades Freigabe, alles wird protokolliert. Die Eventmanagerin kommt alle ~15 Minuten vorbei. Kamera innen. Die abgehängte Decke verbindet Umkleide, Personalgang, Lager und Büro (Deckenhohlraum, trägt knapp eine Person). Am Ausgabefenster bekommt, wer Kades Freigabe glaubhaft vorträgt, die Karte über die Theke.'},
 {n:11,t:'Sicherheitsraum',p:'Kades Posten: Monitorwand, Funk, Tür zum Foyer und zum Personalflur.',g:'Kade ist 60 % der Zeit unterwegs. Monitore zeigen alle Kameras dieser Ebene, nicht die von 110 (eigenes System). Wer hier steht, kann Alert senken: Aufnahmen tauschen, Sensor als Defekt markieren. Fenster zum Foyer ist Spiegelglas.'},
 {n:12,t:'Gäste-WC',p:'Vorraum mit Spiegeln, dahinter Kabinen. Im Vorraum eine Tür „Nur Personal“.',g:'Die Personaltür führt in den Personalflur, einfacher Zylinder. Klassischer Rollenwechsel: als Gast hinein, als Personal hinaus (Uniform aus der Umkleide gegenüber). Keine Kamera im WC.'},

sits:[
 '<b>Rückführung.</b> Alle ~40 Minuten geht ein Stück zurück nach 110: Venn, eine Wache, ein Transportwagen. Die Keycard verlässt dafür für 10 Minuten die Kassette und wandert Kernflur → Galerie → Vorraum. Beide Faktoren sind kurz am selben Ort.',
 '<b>Stille Prüfung.</b> Der Bogen meldet nur an Kade. Wer auffällt, bekommt keine Szene, sondern einen Schatten. Aufmerksame Runner merken: Dieselbe Wache ist immer in Sichtweite.',
 '<b>Venn allein.</b> Im Wintergarten ohne Kamera, fünf Minuten. Iris-Aufnahme, ehrliches Gespräch, Einladung zur Privatbesichtigung: hier entscheidet sich, ob der biometrische Faktor sozial oder technisch gelöst wird.',
 '<b>Vier Türen ins Arbeitszimmer.</b> Reader (Hacker), Mechanik (Snake/Punk), Treppe von oben (Prowl), Balkon (Rigger/Adept). Jede Gruppe findet ihre.',
 '<b>Rollenwechsel im WC.</b> Als Gast hinein, durch die Personaltür hinaus. Die Umkleide mit Uniformen liegt gegenüber.',
 '<b>Ausgabefenster.</b> Ein Runner in Sicherheitsuniform verlangt die Karte „auf Kades Anweisung für die Rückführung“. Sway oder Command, Risky. Bei 4/5: Die Eventmanagerin ruft Kade an, um sich das bestätigen zu lassen.',
],

spots:[
 {n:1,t:'VIP-Lounge & Umgang',p:'Ein Balkon läuft um das Atrium. Wenige, sehr gut vernetzte Gäste, Lounge-Möbel, die Freitreppe hinunter in den Salon. Vom Geländer sieht man die ganze Party.',g:'Weniger Gäste heißt mehr Aufmerksamkeit pro Person: Wer hier nicht hingehört, fällt in Minuten auf. Eine Sicherheitskraft, zwei Kameras. Das Geländer ist Overwatch für einen Trigger und der schnellste Weg nach unten (Seil ins Atrium, 6 m). Servicedrohnen fliegen durch den Luftraum.'},
 {n:2,t:'Pantry & Speiseaufzug',p:'Kleine Bar-Küche für die Lounge, Nachschub kommt per Speiseaufzug aus der Küche auf 111.',g:'Speiseaufzug 60×60 cm: Gegenstände, Keycard-Übergabe zwischen zwei Runnern auf verschiedenen Ebenen, notfalls ein sehr schlanker Runner (Desperate). Zwei Servicekräfte, die selten hochschauen.'},
 {n:3,t:'Sky-Terrasse & Pool',p:'Außenterrasse mit beheiztem Pool, Glasbalustrade, Wind. Türen zur Lounge, zur Skycab-Lobby und zur Suite.',g:'Keine Kamera außer der an der Lobby-Tür. Die Balustrade ist ein Abseilpunkt zum Privatbalkon 111 (3 m östlich, 5 m tiefer) und Fluchtweg für alles, was fliegt. Die Fassadengondel fährt an der Ostkante vorbei. Die Suite-Tür ist verriegelt, aber Glas.'},
 {n:4,t:'Skycab-Lobby',p:'Ankunft für Gäste, die per Skycab kommen: Empfang, Reader, Treppe zur Landeplattform auf dem Dach.',g:'Eine Sicherheitskraft prüft Skycab-Buchungen gegen die Gästeliste; wer eine Buchung eingetragen hat, gilt als erwartet. Der Reader zur Lounge braucht den Gästebadge. Fluchtweg Nummer eins bei niedrigem Alert: Skycab bestellen, Treppe hoch, weg. Kamera über der Tür.'},
 {n:5,t:'Private Suite',p:'Verschlossen, dunkel, nicht Teil der Gala.',g:'Leer. Bewegungsmelder in drei Ecken, keine Kameras (Veyrath duldet keine in seinen Räumen). Die Privattreppe im Privatsalon führt direkt ins Arbeitszimmer 111: der Weg zum Privatlift, der Galerie und Bibliothek komplett umgeht. Hinweise auf den Besitzer: warmer Boden, überdimensionierte Türen und Möbel, Maßanzüge ohne Etikett in der Ankleide.'},
 {n:6,t:'Wartungsgalerie & Technik',p:'Lüftungsanlage, Kanäle, Personaltreppe, ein Lager mit Möbeln. Laut.',g:'Bodenluke in den Technikschacht: der Wartungsschacht führt hinunter zum Lager 111 und weiter zur Löschzentrale 110, hinauf zum Dach. Die Personaltreppe geht weiter zum Dach (Tür mit Alarmkontakt). Der Abluftlärm überdeckt Werkzeuggeräusche.'},
 {n:7,t:'Technikflur',p:'Personalverbindung zwischen Pantry und Skycab-Lobby.',g:'Keine Kamera. Hier kreuzen sich Servicepersonal und VIP-Empfang: die beste Stelle, Uniform gegen Anzug zu tauschen oder umgekehrt.'},
 {n:8,t:'Glasdach Wintergarten (Luftraum)',p:'Von hier sieht man durch das Glas hinunter in den Wintergarten.',g:'Vom Dach aus: Öffnungsflügel für die Lüftung, mechanisch, ohne Sensor, klemmt (Prowl oder Engineer, Controlled bei Ruhe). Darunter Venns kamerafreier Rückzugsort. 5 m Abseilhöhe in Pflanzen.'},
 {n:9,t:'Luftraum Atrium',p:'Blick 6 m hinab auf die Party, 5 m hinauf zum Glasdach.',g:'Sturzgefahr für Consequences. Seil vom Geländer ist der schnellste Weg nach unten und nach oben (Glasdach-Wartungsflügel). Wer hier hängt, wird gesehen.'},
],

sits:[
 '<b>Wer gehört hierher?</b> In der VIP-Lounge kennt jeder jeden. Ein fremdes Gesicht wird angesprochen, nicht gemeldet: „Und Sie sind mit wem hier?“ Ein Face glänzt, ein Muscle schwitzt.',
 '<b>Skycab-Buchung.</b> Ein Hacker trägt vor dem Run eine Buchung in das Ankunftssystem ein. Dann erwartet die Lobby-Wache Gäste, nicht Eindringlinge. Ohne Buchung: höfliche Rückfrage, Alert +1.',
 '<b>Die Suite riecht nach Drache.</b> Wer hineinkommt, findet nichts Nützliches, aber viele Hinweise: warmer Boden, riesiges Bett, Maßanzüge. Ein Mage spürt eine alte, ruhige Präsenz. Kein Alarm, aber Ahnung.',
 '<b>Von oben nach unten.</b> Vier Wege von 112 nach 111: Freitreppe (öffentlich), Privattreppe (verborgen), Personaltreppe (Personal), Seil ins Atrium (spektakulär).',
 '<b>Pool-Party.</b> Eine Consequence auf der Sky-Terrasse: jemand fällt in den Pool, alle schauen hin. Zwei Minuten, in denen niemand auf die Lounge achtet.',
],

spots:[
 {n:1,t:'Skycab-Landeplattform',p:'Beleuchtete Plattform mit Wartehäuschen und Treppe hinunter in die Skycab-Lobby 112. Nachts landen hier autonome Skycabs mit VIP-Gästen.',g:'Der Anflugtransponder erteilt autonomen Skycabs die Landefreigabe: gehackt landet jedes Cab als „angemeldete Ankunft“; ohne Freigabe kreist es 90 Sekunden und meldet sich (Alert +1). Kamera am Häuschen. Landezone B für Fallschirme: eben, aber hell beleuchtet.'},
 {n:2,t:'Dachausstieg Personaltreppe',p:'Der einzige reguläre Weg aufs Dach: Stahltür, Reader.',g:'Alarmkontakt: Öffnen ohne Badge meldet still (Alert +1). Kamera und Bewegungsmelder davor. Die Treppe führt hinunter bis P2: 112 Wartungsgalerie, 111 Kernflur, an 110 vorbei (verriegelte Brandschutztür), EG-Lobby, Garage.'},
 {n:3,t:'Schachtkopf Technikschacht',p:'Unauffällige Luke zwischen den Technikaufbauten.',g:'Darunter der Wartungsschacht (80×80 cm) mit Steigleiter: Ausstiege auf 112 (Bodenluke Wartungsgalerie), 111 (Revisionstür Lager) und 110 (Löschzentrale). Kein Sensor bis 110. Der direkteste Weg vom Dach zur Vault, ohne die Party zu berühren.'},
 {n:4,t:'Drohnenport',p:'Lieferdrohnen landen hier und verschwinden in einem Schacht ins Gebäude.',g:'Drohnenschacht 40×40 cm bis zur Küche 111 und weiter in die Garage. Ein Rigger schickt Ausrüstung portionsweise hinunter oder hinauf. Der ständige Drohnenverkehr überdeckt kleine eigene Fluggeräte. Keine Kamera.'},
 {n:5,t:'Glasdach Atrium',p:'Beleuchtete Glaspyramide über dem Salon. Von unten sieht man jede Silhouette auf dem Glas.',g:'Streben tragen, Scheiben tragen eine Person. Wartungsflügel an der Nordseite mit Kontakt. Wer hier steht, wird bei Blitzen von unten gesehen (Consequence: ein Gast zeigt nach oben). Abseilen: 12 m bis zum Salonboden. Ein Sturz durch das Glas ist eine mögliche Consequence, nie das automatische Ergebnis.'},
 {n:6,t:'Glasdach Wintergarten',p:'Flacheres, dunkles Glasdach über dem Wintergarten.',g:'Lüftungsflügel mechanisch, ohne Sensor, klemmt (Prowl/Engineer). Darunter Venns Rückzugsort ohne Kamera, 5 m Abseilhöhe in weiche Pflanzen. Der leise Dacheinstieg.'},
 {n:7,t:'Fassadenbefahranlage (Gondel)',p:'Wartungskran mit Reinigungsgondel, geparkt an der Ostkante. Fährt auf einer Schiene an der Fassade.',g:'Steuerung manuell am Kasten oder per Interface. Die Gondel fährt an der Ostfassade bis zur Technischen Schleuse 110 (Andockpunkt) und weiter bis zum EG. Fahrten werden protokolliert; Abweichung vom Wartungsplan → stille Prüfung. Dragon’s Deal: „Sie bringt euch exakt ans Ziel und verriegelt sich danach außen.“'},
 {n:8,t:'Steigleiter',p:'Wartungsleiter an der Nordkante, hinunter zur Terrasse 111.',g:'8 m, Käfig oben verschlossen, außen herum kletterbar. Die Terrassenkamera zeigt nur den Drohnen-Landeplatz, nicht die Leiter. Wer hier ankommt, steht direkt neben der angelehnten Küchen-Servicetür.'},
 {n:9,t:'Landezone Ost',p:'',g:'Flaches Dach über der Suite, keine Kamera, Windschatten des Masts. Der beste Absprungpunkt für Fallschirm oder Gleiter. Achtung: Attika nur 1,1 m, Böen. Von hier zu Fuß um die Glaspyramide herum zum Dachausstieg.',gm:true},
 {n:10,t:'Technikaufbauten',p:'Kühltürme, Lüftungsgeräte, Notstrom. Laut, warm, dampfend.',g:'Deckung und Lärm. Notstrom/USV sabotieren löst Notbeleuchtung und Lockdown-Protokoll aus (Alert +2): schlechte Idee als Einstieg, gute Ablenkung bei der Flucht.'},
],

sits:[
 '<b>Anflug ohne Freigabe.</b> Das Skycab kreist, die Gebäudesicherheit fragt nach. Mit gehackter Freigabe erwartet die Lobby-Wache „Gäste“ und hält die Tür auf.',
 '<b>Silhouetten.</b> Blitz über Seattle. Wer auf dem Atrium-Glas steht, wird von unten gesehen: „Ein Gast zeigt nach oben“ ist die Consequence, nicht sofort Alarm.',
 '<b>Böe.</b> Bei 4/5 im Freien: Ausrüstung rutscht Richtung Attika, der Gleiter verfängt sich am Mast, die Gondel schwankt. Harm oder verlorenes Equipment statt Alert.',
 '<b>Die Gondel fährt nur einmal.</b> Dragon’s Deal: exakt ans Ziel, danach verriegelt sie sich außen am Gebäude. Für die Flucht braucht die Crew etwas anderes.',
 '<b>Drei Wege nach unten.</b> Treppe (Alarmkontakt, Kamera), Wartungsschacht (eng, Sensor erst auf 110), Leiter (Terrasse, Küchentür). Die Wahl entscheidet, wo die Crew ankommt und wer sie sieht.',
],

spots:[
 {n:1,t:'Zugangsschleuse',p:'Beide Lifte enden in derselben mattschwarzen Schleuse. Sensoren registrieren Bewegung, Gewicht und Geräte. Ein Terminal fragt nach Identität.',g:'Gewichtsplatte zählt Personen und vergleicht mit der Anmeldung. Geräte-Scan markiert Funk und Metall. Kamera mit Gesichtsabgleich erkennt Venn und begrüßt sie namentlich. Abweichung → stiller Alarm, die Schleusentür verriegelt hinter der Crew (Consequence, keine Sackgasse: die Tür lässt sich von innen mit Engineer oder Gewalt öffnen). In der Westwand eine Wartungstür mit Reader zum Technikflur Ost: für Eingeschlossene der Ausweg in den Technikring, für eine Gondel-Crew der Weg in die Schleuse, ohne einen Lift zu benutzen. Wer sie ohne Wartungsbadge öffnet, zählt für die Sensoren als unangemeldet.'},
 {n:2,t:'Sensorkorridor',p:'Ein langer, überraschend leerer Korridor. Museale Beleuchtung, dann ein Knick nach Norden.',g:'Drei Lichtschranken (x-Positionen markiert), Druckplatten vor dem Knick, RFID-Bogen im Knick, drei Kameras. Bei „autorisierter Besichtigung“ bleibt alles scharf, aber die Bewertung ist gnädiger: Position Controlled statt Risky. Schaumdüsen in der Decke füllen den Korridor bei Alarm (Sicht und Bewegung erschwert, auch für Drohnensensoren). Ein Aufklärer schwebt hier auf Patrouille.'},
 {n:3,t:'Authentifizierungspunkt & Tresortür',p:'Konsole mit Kartenleser und Irisscanner vor einer massiven Tür.',g:'Reihenfolge egal, 90-Sekunden-Fenster. Bei nur einem Faktor: „BIOMETRISCHER FAKTOR: BESTÄTIGT · PHYSISCHER FAKTOR: AUSSTEHEND“. Jeder Versuch wird protokolliert. Ohne Faktoren: 40 cm Verbund, Gewebe und Barriere, also laut, lang oder magisch anspruchsvoll, nie unmöglich. Die Kuratorenvorbereitung nebenan ist ein Versteck mit Werkzeug.'},
 {n:4,t:'Drohnenknoten',p:'Seitliche Nische mit Ladeplätzen. Es summt.',g:'Zwei Aufklärer, zwei Wächter. Drei Zustände: Routine (patrouillieren), Besichtigung (begleiten, zählen), Unregelmäßigkeit (blockieren, trennen, erst dann Waffen). Die Wartungsanschlüsse sind ein Interface-Punkt. Die Wartungstür auf der Rückseite führt zum Technikflur Süd: der Hintereingang in den Korridor, mitten durch das Nest.'},
 {n:5,t:'Sammlung (Vault)',p:'',g:'Wände aus lebendem Gewebe als Träger einer dualen Manabarriere (reagiert auf Bohren und Erschütterung, heilt kleine Wunden, verdichtet sich bei Alarm). Der Koffer liegt auf einem niedrigen Sockel ganz hinten: der Weg dorthin führt an der Schatulle mit Edelsteinen direkt neben der Tür, der Cybertech und der magischen Antiquität vorbei. Packtisch mit Werkzeug und Verpackung. Lüftungsgitter innen an der Ostwand.',gm:true},
 {n:6,t:'Technische Schleuse (Gondel)',p:'Von außen als Andockpunkt der Fassadengondel sichtbar.',g:'Außentür öffnet nur mit Wartungsauftrag im System (Interface oder gefälschter Auftrag) oder mit Gewalt (laut). Kamera innen. Von hier: Technikflur Ost → Wartungstür in den Korridor (Alarmkontakt), Wartungstür in die Zugangsschleuse (Reader, Sensoren zählen mit) oder Klimatechnik → Lüftungskanal.'},
 {n:7,t:'Klimatechnik & Lüftungskanal',p:'',g:'Der Kanal (60×60 cm) führt durch die Ostwand in die Sammlung. Gitter mit Kontakt und Vibrationssensor, das Gewebe umwächst den Kanal und zuckt beim Schneiden (Alert +1, sichtbare Spur). Die Barriere schließt den Kanal astral. Eine gemeldete Klimastörung am „empfindlichen Objekt“ ist der perfekte Vorwand, Venn zur Schleuse zu locken.',gm:true},
 {n:8,t:'Sicherheitsserver / Host-Knoten',p:'',g:'Physischer Zugriff auf Türen, Sensoren und Drohnenlogik dieser Ebene (nicht auf 111, eigenes System). Kabeldurchführung 30 cm zum Vorraum: Mikrodrohne oder Kabel passt. Interface hier ist Controlled, aber jeder Login wird protokolliert: kein Alert jetzt, dafür Heat später.',gm:true},
 {n:9,t:'Sensorzentrale',p:'',g:'Lokale Steuerung der Korridorsensoren. Wer hier steht, kann Sensoren als „in Wartung“ markieren (Engineer oder Interface): Korridor fünf Minuten blind. Tür mit Reader vom Technikflur Ost.',gm:true},
 {n:10,t:'Kernvorraum, Frachtschacht & Personaltreppe',p:'Die Personaltreppe führt an dieser Ebene vorbei; die Brandschutztür ist verriegelt.',g:'Frachtaufzug hält hier nicht, aber die Schachttür existiert: Kabine per Interface oder Rigger auf 110 stoppen, Tür manuell öffnen. Die Brandschutztür entriegelt bei Feueralarm (Alert +2, Gäste werden evakuiert, aber Chaos ist Deckung). Technikschacht: Wartungsschacht-Ausstieg in die Löschzentrale, dort ein Bewegungssensor.'},
 {n:11,t:'Löschzentrale',p:'',g:'Vorrat des Sicherungsschaums für den Korridor. Wer die Anlage kontrolliert, löst den Schaum selbst aus oder verhindert ihn. Ausstieg des Wartungsschachts mit Bewegungssensor.',gm:true},
 {n:12,t:'Drohnenwerkstatt',p:'',g:'Ersatzteile, ein zerlegter Wächter, Wartungstransponder: Drohnen ignorieren, was als „Wartungsgerät“ sendet (Täuschung der Zielerkennung, Engineer oder Interface). Werkzeug für alles, was oben fehlte.',gm:true},
 {n:13,t:'Astraler Watcher & Manabarriere',p:'',g:'Der Watcher patrouilliert astral um die Vault (violette Schleife), meldet ungewöhnliche astrale Aktivität (Alert +1) und kämpft nicht. Am Türdurchgang wird die Barriere kontrolliert geöffnet: ein Mage kann den Mechanismus mit Assense studieren und daraus einen Vorteil für einen eigenen Weg gewinnen.',gm:true},

 {id:'B',c:'out',t:'Gondel → Technische Schleuse → Technikflur Ost → Wartungstür',d:'Umgeht die Lifte. Am Südende zwei Türen: in den Korridor hinter den Lichtschranken (Alarmkontakt) oder in die Zugangsschleuse (Reader, dort zählen die Sensoren die Crew).',gm:true},
 {id:'C',c:'tech',t:'Wartungsschacht → Löschzentrale → Technikring → Drohnenknoten (Rückseite)',d:'Lang, dunkel, ohne Kameras im Ring. Endet mitten im Drohnennest; bei Routine schlafen die Drohnen an den Docks.',gm:true},
 {id:'D',c:'private',t:'Klimatechnik → Lüftungskanal → Sammlung',d:'60×60 cm, Gitter mit Kontakt, Gewebe zuckt. Umgeht die Tresortür komplett, aber nicht die Barriere (astral geschlossen).',gm:true},
 {id:'E',c:'staff',t:'Feueralarm: Personaltreppe → Kernvorraum → Technikring',d:'Die Brandschutztür entriegelt nur bei Alarm. Laut, aber das Chaos oben ist Deckung.'},
],
sits:[
 '<b>Drei Zustände.</b> Die Drohnen reagieren auf den Kontext: Routine, Besichtigung oder Unregelmäßigkeit. Ein sozialer Erfolg oben verändert, wie diese Ebene die Crew begrüßt, beseitigt die Drohnen aber nicht.',
 '<b>Der Weg zum Koffer führt an allem vorbei.</b> Schatulle neben der Tür, Cybertech links, Antiquität mit Aura in der Mitte. Beschreibe alles, bevor der Koffer überhaupt sichtbar wird.',
 '<b>Faktor fehlt.</b> Venn scannt, die Anzeige sagt „PHYSISCHER FAKTOR: AUSSTEHEND“. 90 Sekunden. Wo ist die Karte gerade, und wer steht neben Venn?',
 '<b>Hintereingang durchs Nest.</b> Wer über den Technikring kommt, betritt den Korridor durch den Drohnenknoten. Controlled, wenn niemand etwas berührt; Desperate, wenn die Wächter schon wach sind.',
 '<b>Schaum.</b> Consequence im Korridor: Sicherungsschaum aus der Decke. Sicht und Bewegung erschwert, für alle. Wer die Löschzentrale kontrolliert, entscheidet, wann.',
 '<b>Der Watcher sieht euch.</b> Astrale Aktivität → Meldung (Alert +1), kein Angriff. Ein Mage kann ihn ablenken, täuschen oder einfach still bleiben.',
 '<b>Tür fällt zu.</b> Dragon’s Deal: „Ihr erreicht den Koffer ohne Widerstand. Dafür schließt sich die Tresortür hinter euch.“ Jetzt zählen Lüftungskanal, Kabeldurchführung und der Packtisch mit Werkzeug.',
],
};

spots:[
 {n:1,t:'Rampe, Schranke & Pförtnerloge',p:'Die Rampe kommt von P1 herunter. Kennzeichenscanner, Schranke, ein gelangweilter Pförtner mit laufendem Trid.',g:'Der Scanner gleicht Kennzeichen mit Lieferplan und Bewohnerliste ab (Hacker: Fahrzeug eintragen). Der Pförtner winkt durch, was „wie Caterer aussieht“. Die Loge sieht Rampe und Fahrgasse Ost, nicht die Anlieferung. Zu Fuß über die Rampe hinein: niemand fragt.'},
 {n:2,t:'Fahrgasse & Sicherheitsbüro Garage',p:'Hauptfahrweg mit zwei Kameras. Ein rollender Sicherheitsroboter patrouilliert. Das Sicherheitsbüro hat ein Fenster zur Fahrgasse.',g:'Der Rollbot fährt eine 4-Minuten-Runde Fahrgasse ↔ Rangierfläche; wer sie kennt, weiß, wann die Anlieferung unbeobachtet ist. Die Monitore zeigen nur die Garage, nicht den Turm. Die eine Wache aus dem Büro steht meist beim Pförtner.'},
 {n:3,t:'Anlieferung & Laderampe',p:'Catering lädt aus, eine Schichtleiterin mit Tablet koordiniert, Vesperline-Kisten stapeln sich. Drei Ladetore, ein Van, ein gepanzerter Kunsttransporter.',g:'Die Schichtliste kennt jeden Namen; ein fremder fällt auf („Springer, kurzfristig“ ist die Antwort). Eine leere Vesperline-Kiste fasst eine Person. Um 01:30 fahren drei Kisten „Bühnentechnik“ mit dem Frachtaufzug nach 111. Der Kunsttransporter holt um 05:00 die Stücke; sein Fahrer schläft in der Kabine. Toter Winkel hinter dem Transporter.'},
 {n:4,t:'Frachtvorraum & Frachtaufzug',p:'Eine Wache scannt Badges, Lieferscheine und Kisten. Der Frachtaufzug fährt bis in den Kernflur des Penthouses.',g:'Kisten werden nur außen gescannt (Metall und Funk fallen auf, „Bühnentechnik“ erklärt vieles). Ebene 110 ist nicht anwählbar, aber die Schachttür dort existiert. Die Wache wechselt alle zwei Stunden; die Ablösung kennt die Gesichter der Frühschicht nicht.'},
 {n:5,t:'Personaltreppe (Notausgang)',p:'Fluchttreppe durch das ganze Gebäude.',g:'111 Stockwerke zu Fuß sind keine Option, aber zwei Ebenen bis zur EG-Lobby sind es: dort wartet der Glasaufzug, und aus Personal werden Gäste. Oben endet die Treppe am Dach (Alarmkontakt), an 110 führt sie mit verriegelter Brandschutztür vorbei.'},
 {n:6,t:'Technikraum / GLT-Knoten',p:'Verschlossen, Schild „Technik“. Trafo, Verteiler.',g:'Physischer Zugang zur Gebäudeleittechnik: Aufzüge, Türen, Kameras der Garage und des Kernflurs 111. Eine Hackerposition außer Sicht. Ebene 110 hat einen eigenen Host und ist von hier nicht erreichbar, aber der Frachtaufzug lässt sich auf 110 anhalten.'},
 {n:7,t:'Lieferdrohnen-Depot & Drohnenschacht',p:'Drohnen summen, laden, starten durch eine Einflugöffnung zur Straße. Ein Schacht führt nach oben.',g:'Der Drohnenschacht (40×40 cm) endet in der Küche 111 und am Drohnenport auf dem Dach. Ein Rigger übernimmt eine Lieferdrohne und schickt Waffe, Werkzeug oder Keycard durchs Gebäude. Der Drohneneinflug ist ein Weg für Mikrodrohnen ohne Pförtner. Keine Kamera.'},
 {n:8,t:'Umkleide Personal',p:'Spinde, Uniformen, ein Waschbecken.',g:'Uniformen von Catering und Haustechnik, Badges hängen an den Spinden. Keine Kamera. Türen zum Frachtvorraum und zur Fahrgasse: der Wechsel zwischen Gast und Personal in beide Richtungen.'},
 {n:9,t:'VIP-Vorfahrt & Lobbyaufzug',p:'Limousinen, Valets, roter Teppich zum Aufzug ins Erdgeschoss, wo der Glasaufzug wartet. Eine Fahrer-Lounge mit Trid.',g:'Einladungen werden erst oben geprüft; hier zählt Auftreten. In der Fahrer-Lounge: Klatsch über Gäste, über Venn („die Kuratorin mit dem schwarzen Auge“) und Kade („der mit den Chromarmen sieht alles“). Valet-Schlüsselboard = Fluchtfahrzeuge. Kamera an der Schranke.'},
 {n:10,t:'Kistenlager & Müllraum',p:'Leergut, eine Müllpresse.',g:'Kein Kamerablick, gutes Versteck. Der Pressenlärm überdeckt vieles. Leere Kisten sind Verkleidung für Ausrüstung, die nicht durch den Scan soll.'},
],

routeText:[
 {id:'A',c:'staff',t:'Als Personal: Laderampe → Frachtvorraum → Frachtaufzug',d:'Uniform, Kiste, Lieferschein. Der Scan prüft Badge und Ladung, nicht Gesichter. Landet im Kernflur 111.'},
 {id:'B',c:'public',t:'Als Gast: VIP-Vorfahrt → Lobbyaufzug → EG → Glasaufzug',d:'Auftreten statt Ausweis. Die eigentliche Prüfung wartet oben im Foyer.'},
 {id:'C',c:'tech',t:'Zu Fuß über die Rampe → Umkleide → Frachtvorraum',d:'Niemand fragt Fußgänger. In der Umkleide wird aus dem Fremden Personal, Tür 2 führt direkt zur Wache mit dem Scanner.'},
 {id:'D',c:'out',t:'Drohnenschacht (nur Gegenstände)',d:'Rigger oder Hacker schickt Ausrüstung in die Küche 111 oder aufs Dach. Nichts davon passiert den Scan.'},
 {id:'E',c:'private',t:'Personaltreppe → EG-Lobby',d:'Zwei Ebenen hoch, dann Wechsel in den Glasaufzug. Der leise Weg, wenn die Garage zu heiß wird.'},
 {id:'F',c:'staff',t:'In der Kiste nach oben',d:'Um 01:30 oder 05:00 fahren Kisten. Wer drinsitzt, kommt ungescannt im Kernflur an. Eng, blind, Desperate bei Kontrolle.',gm:true},
],
sits:[
 '<b>Ausladen unter Zeitdruck.</b> Der Catering-Van muss in zehn Minuten die Rampe frei machen. Wer mit anpackt, wird nicht gefragt, wer er ist.',
 '<b>Falscher Name.</b> Die Schichtleiterin scannt ihr Tablet: „Sie stehen hier nicht.“ Sway oder Deception: „Springer, kurzfristig.“ Bei 4/5 ruft sie beim Caterer an, der gerade nicht erreichbar ist. Zehn Minuten Frist.',
 '<b>Kiste geht hoch.</b> Um 01:30 fahren drei Kisten „Bühnentechnik“ nach 111. Wer in einer sitzt, kommt im Kernflur an. Kisten werden nur außen gescannt.',
 '<b>Rollbot.</b> Vier Minuten Runde. Wer den Rhythmus kennt, hat zwei Minuten unbeobachtete Rangierfläche.',
 '<b>Fluchtfahrzeug.</b> Valet-Schlüsselboard, gepanzerter Kunsttransporter mit schlafendem Fahrer, Limousinen mit Fahrern in der Lounge. Drei Optionen, drei Lautstärken.',
 '<b>Hacker im Keller.</b> Vom GLT-Knoten aus: Aufzüge, Türen, Garagenkameras. Nicht Ebene 110. Aber den Frachtaufzug auf 110 stoppen, das geht.',
],
};

/* ---------- App ---------- */
const LEVELS=[LSCHNITT,LGARAGE,L111,L112,LDACH,L110];
const TABSUB={schnitt:'Vertikale Wege',garage:'Tiefgarage',111:'Gala-Ebene',112:'Lounge & Suite',dach:'Landeplattform',110:'Tresorgeschoss'};
const state={gm:true,routes:true,cur:'111'};
try{const s=JSON.parse(localStorage.getItem('ms-plaene')||'{}');if(s&&typeof s==='object')Object.assign(state,s);}catch(e){}
if(!LEVELS.some(l=>l.id===state.cur))state.cur='111';
function save(){try{localStorage.setItem('ms-plaene',JSON.stringify(state));}catch(e){}}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function card(title,cls){const c=document.createElement('section');c.className='card'+(cls?' '+cls:'');const h=document.createElement('h3');h.textContent=title;c.appendChild(h);return c;}
function buildSpots(L,forPrint){
  const c=card('Orte auf dem Plan');const ol=document.createElement('ol');ol.className='spots'+(forPrint?' keygrid':'');
  (L.spots||[]).forEach(s=>{const li=document.createElement('li');li.dataset.n=s.n;if(s.gm)li.classList.add('gmonly');
    li.innerHTML=`<span class="n">${s.n}</span><div><b>${esc(s.t)}</b>${s.p?`<p>${esc(s.p)}</p>`:''}${s.g?`<div class="gmn">${esc(s.g)}</div>`:''}</div>`;ol.appendChild(li);});
  c.appendChild(ol);return c;
}
function buildRoutes(L){
  const c=card('Von A nach B');const ul=document.createElement('ul');ul.className='routelist';
  (L.routeText||[]).forEach(r=>{const li=document.createElement('li');if(r.gm)li.classList.add('gmline');
    li.innerHTML=`<span class="rl" style="background:${rcol(r.c)}">${r.id}</span><div><b>${esc(r.t)}</b><br><span>${esc(r.d)}</span></div>`;ul.appendChild(li);});
  c.appendChild(ul);const p=document.createElement('p');p.className='hint';p.textContent='Die Buchstaben markieren den Startpunkt jedes Wegs im Plan. „Wege einblenden“ schaltet das Overlay.';c.appendChild(p);return c;
}
function buildSits(L){
  const c=card('Spielsituationen','gmcard');const ol=document.createElement('ol');ol.className='sits';
  (L.sits||[]).forEach(s=>{const li=document.createElement('li');li.innerHTML=s;ol.appendChild(li);});c.appendChild(ol);return c;
}
function buildSectionTable(L){
  const c=card('Vertikale Verbindungen');const w=document.createElement('div');w.className='tablewrap';
  const rows=L.cons.map(k=>`<tr class="${k.gm?'gmline':''}"><td>V${k.n}</td><td><span class="sw" style="background:${rcol(k.c)}"></span>${esc(k.name)}</td><td>${esc(k.from)} → ${esc(k.to)}</td><td>${esc(k.who)}</td><td>${esc(k.cost)}</td></tr>`).join('');
  w.innerHTML=`<table class="sectable"><thead><tr><th>Nr.</th><th>Verbindung</th><th>Von → Nach</th><th>Wer</th><th>Preis / Risiko</th></tr></thead><tbody>${rows}</tbody></table>`;
  c.appendChild(w);const p=document.createElement('p');p.className='hint';p.textContent='Kreise = Haltepunkte, rotes Kreuz = Ebene wird passiert, aber nicht erreicht. Gestrichelt = nur Gegenstände oder Seil.';c.appendChild(p);return c;
}
function bindHover(box,key){
  const mks=[...box.querySelectorAll('.mk')],lis=[...key.querySelectorAll('.spots li')];
  const set=(n,on)=>{mks.forEach(m=>m.classList.toggle('hl',on&&m.dataset.n===n));lis.forEach(l=>l.classList.toggle('hl',on&&l.dataset.n===n));};
  mks.forEach(m=>{m.addEventListener('mouseenter',()=>set(m.dataset.n,true));m.addEventListener('mouseleave',()=>set(m.dataset.n,false));
    m.addEventListener('click',()=>{const li=lis.find(l=>l.dataset.n===m.dataset.n);if(li){li.scrollIntoView({behavior:'smooth',block:'center'});set(m.dataset.n,true);setTimeout(()=>set(m.dataset.n,false),1800);}});});
  lis.forEach(l=>{l.tabIndex=0;l.addEventListener('mouseenter',()=>set(l.dataset.n,true));l.addEventListener('mouseleave',()=>set(l.dataset.n,false));l.addEventListener('focus',()=>set(l.dataset.n,true));l.addEventListener('blur',()=>set(l.dataset.n,false));});
}
function renderMain(){
  const L=LEVELS.find(l=>l.id===state.cur);
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.id==='tab-'+L.id?'true':'false'));
  document.getElementById('mapTitle').innerHTML=`${esc(L.name)}<span>${esc(L.sub)}</span>`;
  document.getElementById('chips').innerHTML=(L.chips||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join('');
  const box=document.getElementById('svgbox');box.innerHTML='';box.appendChild(renderLevel(L,{gm:state.gm,routes:state.routes}));
  const key=document.getElementById('key');key.innerHTML='';
  if(L.kind==='section'){key.appendChild(buildSectionTable(L));key.appendChild(buildSits(L));}
  else{key.appendChild(buildSpots(L,false));key.appendChild(buildRoutes(L));key.appendChild(buildSits(L));}
  bindHover(box,key);
  document.body.classList.toggle('player',!state.gm);
  const bg=document.getElementById('btnGM');bg.setAttribute('aria-pressed',state.gm?'true':'false');bg.lastChild.textContent=state.gm?'SL-Ansicht':'Spieleransicht';
  document.getElementById('btnRoutes').setAttribute('aria-pressed',state.routes?'true':'false');
  save();
}
function buildSheets(){
  const host=document.getElementById('sheets');host.innerHTML='';
  LEVELS.forEach(L=>{const a=document.createElement('article');a.className='sheet';
    const panel=document.createElement('div');panel.className='mappanel';
    panel.innerHTML=`<div class="maphead"><h2>${esc(L.name)}<span>${esc(L.sub)}</span></h2><div class="chips">${(L.chips||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></div>`;
    const sb=document.createElement('div');sb.className='svgbox';sb.appendChild(renderLevel(L,{gm:true,routes:true}));panel.appendChild(sb);a.appendChild(panel);
    if(L.kind==='section')a.appendChild(buildSectionTable(L));else{a.appendChild(buildSpots(L,true));a.appendChild(buildRoutes(L));}
    host.appendChild(a);});
}
(function boot(){
  const tabs=document.getElementById('tabs');
  LEVELS.forEach(L=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.id='tab-'+L.id;b.innerHTML=`${esc(L.short)}<small>${esc(TABSUB[L.id]||'')}</small>`;b.addEventListener('click',()=>{state.cur=L.id;renderMain();});tabs.appendChild(b);});
  document.getElementById('btnGM').addEventListener('click',()=>{state.gm=!state.gm;renderMain();});
  document.getElementById('btnRoutes').addEventListener('click',()=>{state.routes=!state.routes;renderMain();});
  document.getElementById('btnPrint').addEventListener('click',()=>{try{window.print();}catch(e){}});
  buildLegend(document.getElementById('legend'));
  renderMain();
  buildSheets();
})();

</script>
